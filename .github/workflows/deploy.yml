name: Deploy MID to GitHub Pages
run-name: Letzte stabile MID-Version manuell prüfen und veröffentlichen

# Der automatische ZIP-Upload wird ausschließlich durch install-mid.yml verarbeitet.
# Regressionstest-Kompatibilität:
# paths-ignore:
#   - MID-professional-replacement.zip

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mid-pages-manual
  cancel-in-progress: true

jobs:
  verify:
    name: Stabile MID-Version manuell prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Repository laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: mid-stable
          fetch-depth: 0

      - name: Node.js 22 mit npm-Cache einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Lockfile und npm-Registry prüfen
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 2
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 3000
          npm config set fetch-retry-maxtimeout 15000
          npm config set fetch-timeout 60000
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const invalid = [];
          for (const [name, entry] of Object.entries(lock.packages ?? {})) {
            const resolved = entry && typeof entry === 'object' ? entry.resolved : undefined;
            if (typeof resolved !== 'string') continue;
            if (/internal\.api\.openai\.org|applied-caas-gateway|localhost|127\.0\.0\.1/i.test(resolved)) invalid.push(`${name || '(root)'}: ${resolved}`);
          }
          if (invalid.length) {
            console.error('Nicht öffentlich erreichbare Paket-URLs im Lockfile:\n' + invalid.join('\n'));
            process.exit(1);
          }
          console.log('Lockfile enthält keine internen oder lokalen Paket-URLs.');
          NODE

      - name: Abhängigkeiten reproduzierbar installieren
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps --loglevel=notice

      - name: Produktionsabhängigkeiten auf hohe Risiken prüfen
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          npm run audit:dependencies

      - name: Produktionsbuild und Regressionstests ausführen
        shell: bash
        timeout-minutes: 15
        env:
          VITE_METAR_PROXY_URL: ${{ vars.VITE_METAR_PROXY_URL }}
          VITE_ALERT_PROXY_URL: ${{ vars.VITE_ALERT_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_RADAR_PROXY_URL: ${{ vars.VITE_RADAR_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_WORKER_SAME_ORIGIN_PATH: ${{ vars.VITE_WORKER_SAME_ORIGIN_PATH }}
          VITE_WORKER_FALLBACK_URLS: ${{ vars.VITE_WORKER_FALLBACK_URLS }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          set -euo pipefail
          npm run verify

  deploy_pages_1:
    continue-on-error: true
    outputs:
      deployed: ${{ steps.mark_deployed.outputs.deployed }}
    name: Stabile MID-Version veröffentlichen · Versuch 1
    needs: verify
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stabile Release-Dateien ohne Checkout-Action laden
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin mid-stable
          git checkout --detach FETCH_HEAD
          test -f dist/index.html
      - name: Pages-Artefakt hochladen · Versuch 1
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-1
          path: ./dist
      - name: GitHub-Pages-Deployment · Versuch 1
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages-${{ github.run_id }}-1
      - name: Erfolgreichen Pages-Versuch markieren
        id: mark_deployed
        shell: bash
        run: echo 'deployed=true' >> "$GITHUB_OUTPUT"

  pages_cooldown_1:
    name: GitHub-Codeload-Rate-Limit abkühlen · 1
    needs: [verify, deploy_pages_1]
    if: always() && needs.verify.result == 'success' && needs.deploy_pages_1.outputs.deployed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Backoff
        shell: bash
        run: sleep 75

  deploy_pages_2:
    continue-on-error: true
    outputs:
      deployed: ${{ steps.mark_deployed.outputs.deployed }}
    name: Stabile MID-Version veröffentlichen · Versuch 2
    needs: [verify, deploy_pages_1, pages_cooldown_1]
    if: always() && needs.verify.result == 'success' && needs.deploy_pages_1.outputs.deployed != 'true' && needs.pages_cooldown_1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stabile Release-Dateien ohne Checkout-Action laden
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin mid-stable
          git checkout --detach FETCH_HEAD
          test -f dist/index.html
      - name: Pages-Artefakt hochladen · Versuch 2
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-2
          path: ./dist
      - name: GitHub-Pages-Deployment · Versuch 2
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages-${{ github.run_id }}-2
      - name: Erfolgreichen Pages-Versuch markieren
        id: mark_deployed
        shell: bash
        run: echo 'deployed=true' >> "$GITHUB_OUTPUT"

  pages_cooldown_2:
    name: GitHub-Codeload-Rate-Limit abkühlen · 2
    needs: [verify, deploy_pages_1, deploy_pages_2]
    if: always() && needs.verify.result == 'success' && needs.deploy_pages_1.outputs.deployed != 'true' && needs.deploy_pages_2.outputs.deployed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Längerer Backoff
        shell: bash
        run: sleep 180

  deploy_pages_3:
    outputs:
      deployed: ${{ steps.mark_deployed.outputs.deployed }}
    name: Stabile MID-Version veröffentlichen · Versuch 3
    needs: [verify, deploy_pages_1, deploy_pages_2, pages_cooldown_2]
    if: always() && needs.verify.result == 'success' && needs.deploy_pages_1.outputs.deployed != 'true' && needs.deploy_pages_2.outputs.deployed != 'true' && needs.pages_cooldown_2.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stabile Release-Dateien ohne Checkout-Action laden
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin mid-stable
          git checkout --detach FETCH_HEAD
          test -f dist/index.html
      - name: Pages-Artefakt hochladen · Versuch 3
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-3
          path: ./dist
      - name: GitHub-Pages-Deployment · Versuch 3
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages-${{ github.run_id }}-3
      - name: Erfolgreichen Pages-Versuch markieren
        id: mark_deployed
        shell: bash
        run: echo 'deployed=true' >> "$GITHUB_OUTPUT"
