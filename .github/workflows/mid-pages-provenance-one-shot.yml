name: MID one-time Pages provenance QA (read-only)
on:
  push:
    branches:
      - chatgpt/v0.9.85.516-pages-provenance-diagnostics
    paths:
      - .github/workflows/mid-pages-provenance-one-shot.yml
permissions:
  contents: read
  actions: read
  deployments: read
jobs:
  observe:
    name: Read-only Pages deployment SHA and origin
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read newest real GitHub Pages status, SHA and run identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          R = "MeteoMartini/MID"
          MAIN = "ab96ac712fd4f3ba9be5af2cb546febf9ee13329"
          STABLE = "331fffff081303e1c597badddfa4ae41c4b4e0f0"
          SHA = re.compile(r"[0-9a-f]{40}\Z")
          URL = re.compile(r"https://github\.com/MeteoMartini/MID/actions/runs/([1-9]\d*)(?:/job/([1-9]\d*))?\Z")
          if os.getenv("GITHUB_REPOSITORY") != R or os.getenv("GITHUB_REF_NAME") != "chatgpt/v0.9.85.516-pages-provenance-diagnostics":
              raise SystemExit("MISMATCHED_PROTECTED_REF")
          def api(path):
              if not re.fullmatch(r"[A-Za-z0-9?=&/_-]+", path):
                  raise SystemExit("INVALID_API_PATH")
              try:
                  p = subprocess.run(["gh", "api", "-X", "GET", "repos/" + R + "/" + path],
                                     capture_output=True, text=True, timeout=25)
              except subprocess.TimeoutExpired:
                  raise SystemExit("API_TIMEOUT") from None
              if p.returncode:
                  raise SystemExit("API_UNAVAILABLE:" + path.split("?")[0])
              return json.loads(p.stdout)
          m = api("git/ref/heads/main")["object"]["sha"]
          s = api("git/ref/heads/mid-stable")["object"]["sha"]
          if m != MAIN or s != STABLE:
              raise SystemExit("SHA_DRIFT")
          deployments = api("deployments?environment=github-pages&per_page=30")
          if not isinstance(deployments, list) or not (1 <= len(deployments) <= 30):
              raise SystemExit("INVALID_HISTORY")
          print(f"PROVENANCE_REFS_MAIN={m} STABLE={s} COUNT={len(deployments)}")
          for index, entry in enumerate(deployments):
              did = entry.get("id")
              if type(did) is not int or did <= 0 or entry.get("environment") != "github-pages":
                  raise SystemExit("INVALID_DEPLOYMENT_ID")
              status = api(f"deployments/{did}/statuses?per_page=1")
              if not isinstance(status, list) or len(status) != 1:
                  raise SystemExit("INVALID_STATUS")
              state = status[0].get("state")
              if state not in ("success", "failure", "error", "in_progress"):
                  raise SystemExit("INVALID_DEPLOYMENT_STATE")
              raw_sha = entry.get("sha")
              sha = raw_sha if isinstance(raw_sha, str) and SHA.fullmatch(raw_sha) else "INVALID"
              print(f"PAGES_RANK={index+1} ID={did} SOURCE_SHA={sha} STATE={state}")
              if state != "success":
                  continue
              link = status[0].get("log_url")
              match = URL.fullmatch(link) if isinstance(link, str) else None
              if not match:
                  print("PAGES_ORIGIN=UNPARSEABLE (untrusted URL not emitted)")
                  break
              rid, jid = int(match[1]), int(match[2]) if match[2] else None
              run = api(f"actions/runs/{rid}")
              run_sha = run.get("head_sha")
              run_sha = run_sha if isinstance(run_sha, str) and SHA.fullmatch(run_sha) else "INVALID"
              who = (run.get("actor") or {}).get("login")
              who = who if isinstance(who, str) and re.fullmatch(r"[A-Za-z0-9-]{1,39}", who) else "INVALID"
              path = run.get("path")
              path = path if isinstance(path, str) and re.fullmatch(r"[A-Za-z0-9_./-]{1,140}", path) else "INVALID"
              attempt = run.get("run_attempt")
              attempt = attempt if type(attempt) is int and 1 <= attempt <= 1000 else "INVALID"
              print(f"PAGES_ORIGIN_RUN={rid} JOB={jid or 'RUN_LEVEL'} ACTOR={who} RUN_SHA={run_sha} PATH={path} ATTEMPT={attempt}")
              if jid is not None:
                  job = api(f"actions/jobs/{jid}")
                  js = job.get("head_sha")
                  js = js if isinstance(js, str) and SHA.fullmatch(js) else "INVALID"
                  print(f"PAGES_ORIGIN_JOB={jid} JOB_SHA={js} JOB_ATTEMPT={job.get('run_attempt') if type(job.get('run_attempt')) is int else 'INVALID'}")
              if sha not in (STABLE, "acd7fb23ce44e7445c51ce5ccf816c1512fa61f6"):
                  print("PAGES_FOREIGN_SUCCESS_WITHOUT_STABLE_SOURCE_CONTINUE_PROBING")
                  continue
              print("PAGES_OLDER_STABLE_SOURCE_IDENTIFIED")
              break
          else:
              raise SystemExit("NO_SUCCESS_IN_FIRST_30_DEPLOYMENTS")
          PY
