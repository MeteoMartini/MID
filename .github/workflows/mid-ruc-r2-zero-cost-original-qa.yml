name: MID RUC 0-USD offline original-DWD R2 pack QA (no deploy)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'tools/ruc/ruc_r2_lossless_pack_qa.py'
      - 'tools/ruc/test_ruc_r2_lossless_pack_qa.py'
      - '.github/workflows/mid-ruc-r2-zero-cost-original-qa.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: mid-ruc-zero-cost-original-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  offline_original_27h_eps20:
    if: ${{ github.event.pull_request.number == 738 && github.event.pull_request.head.repo.full_name == 'MeteoMartini/MID' }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Source-checkout exact PR HEAD, NO production or R2 writes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run isolated lossless pack and original 0-USD fixture tests
        run: |
          python3 tools/ruc/test_ruc_r2_zero_cost_qa.py
          python3 tools/ruc/test_ruc_r2_lossless_pack_qa.py
      - name: Read exact original 09 Nov 14Z RUC artifact, never re-fetch DWD
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '13686254117'
          run-id: '42641878671'
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error
          path: .ruc-out
      - name: Strict authentic 27h + 20 EPS source and digest qualification
        shell: bash
        run: |
          set -euo pipefail
          test -s .ruc-out/latest.json
          python3 - <<'PY'
          import json
          m=json.load(open('.ruc-out/latest.json', encoding='utf-8'))
          assert m.get('run')=='2026-11-09T14:00', 'source run mismatch'
          assert m.get('eps',{}).get('memberCount')==20
          assert len(m.get('deterministic',{}).get('times',[]))==28
          assert len(m.get('epsSummary',{}).get('times',[]))==28
          assert len(m.get('eps',{}).get('times',[]))==28
          assert 'eps-members.bin' in (m.get('objects') or {})
          print('Exact original-DWD source metadata read; SHA-revalidation in offline pack')
          PY
      - name: Byte-verified lossless offline pack and full decompression readback
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ruc/ruc_r2_lossless_pack_qa.py \
            --source .ruc-out \
            --output .ruc-r2-offline-qa \
            --run '2026-11-09T14:00' \
            --producer-sha 'd8852f672a40d26348d214dc85e9a3a1b9d79c1f' \
            --artifact-sha256 '5a2275e4d75497c08e400b6e6b899254def2330a1b22472fe676d2cf112efe43' \
            --chunk-bytes 131072 \
            > .ruc-r2-qa-output.json
          python3 - <<'PY'
          import json
          r=json.load(open('.ruc-r2-offline-qa/report.json'))
          assert r['postDecodeAllSourceSHAsMatch'] is True
          assert r['sourceObjects']>=12
          assert r['originalBytes']>=1990000000
          assert r['productionApproved'] is False and r['r2ActivationAuthorized'] is False
          print('RUC offline pack: originalBytes='+str(r['originalBytes'])+', packedBytes='+str(r['packedBytes'])+', ratio='+str(r['compressionRatio']))
          print('R2 ACTIVATION: BLOCKED; no Cloudflare writes/credentials')
          PY
      - name: Set up Node 22 to emulate Worker DecompressionStream without R2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
      - name: Independent pointwise R2-range/Worker-style decoder parity
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/ruc/ruc_r2_range_consumer_qa.mjs
          node tools/ruc/ruc_r2_range_consumer_qa.mjs \
            --source .ruc-out \
            --pack .ruc-r2-offline-qa \
            --report .ruc-r2-offline-qa/consumer-parity.json
          python3 - <<'PY'
          import json
          r=json.load(open('.ruc-r2-offline-qa/consumer-parity.json'))
          assert r['allPointBytesMatchOriginal'] is True
          assert r['productionApproved'] is False and r['r2ActivationAuthorized'] is False
          print('Only local Node Worker-stream parity passed; live Cloudflare CPU, billing and range not tested')
          PY
      - name: Upload small SHA proof ONLY, never RUC data or R2 packed objects
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-ruc-r2-offline-byte-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ruc-r2-offline-qa/report.json
            .ruc-r2-offline-qa/inventory.json
            .ruc-r2-offline-qa/range-index.json
            .ruc-r2-offline-qa/consumer-parity.json
          if-no-files-found: error
          retention-days: 2
          compression-level: 6
