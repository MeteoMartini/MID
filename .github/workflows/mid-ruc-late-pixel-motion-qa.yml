name: MID RUC native late IR10.8/GSP real 15min pixel-motion QA (read-only)
on:
  push:
    branches: [chatgpt/v0.9.85.485-surroundings-radar-native-qa]
    paths: ['.github/workflows/mid-ruc-late-pixel-motion-qa.yml']
permissions:
  contents: read
concurrency:
  group: mid-ruc-late-pixel-motion-qa
  cancel-in-progress: false
jobs:
  late-private-real-pixels:
    if: "${{ github.event.head_commit.message == 'qa(ruc): real late IR10.8 GSP 15min pixel movement proof' }}"
    name: True +24h45..+27h DWD originals, same-run lookup, 10 private PNGs (NO RELEASE)
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: read
    steps:
      - name: Checkout exact HEAD without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: SHA lineage and mirrored workflow safety
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/chatgpt/v0.9.85.485-surroundings-radar-native-qa
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cmp .github/workflows/mid-ruc-late-pixel-motion-qa.yml ci/github/workflows/mid-ruc-late-pixel-motion-qa.yml
          main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          stable="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/mid-stable" --jq .object.sha)"
          test "$main" = "$stable"
          test "$stable" = c9fadfcd0969e949a92f414b321627dd3d4fb0cc
          compare="$(gh api "repos/$GITHUB_REPOSITORY/compare/$stable...$GITHUB_SHA")"
          jq -e --arg stable "$stable" '.status == "ahead" and .merge_base_commit.sha == $stable' <<< "$compare" >/dev/null
          echo 'Only SHA-bound private scientific QA, no source release.'
      - name: Existing MID ecCodes + native-grid Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned MID science libraries; validate actual pixel/mask adversarial regressions
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r tools/ruc/requirements-pages.txt
          python -m unittest discover -s tools/ruc -p 'test_qa_ruc_late_pixel_preview.py' -v
          python -m unittest discover -s tools/ruc -p 'test_qa_ruc_full_109_originals.py' -v
          python -m unittest discover -s tools/ruc -p 'test_qa_ruc_same_run_preview.py' -v
      - name: Real native +24h45..+27h source→SHA→ecCodes→geographic model raster animation
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          umask 077
          python -u tools/ruc/qa_ruc_late_pixel_preview.py
          echo 'All private PNGs deleted; no image artifact, no synthetic original and no deployment.'
