name: MID Unit Coverage
run-name: Vitest Unit-/Coverage-Pilot

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mid-unit-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-coverage:
    name: Vitest 5 + V8 Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Repository laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 22 einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: MID-Abhängigkeiten reproduzierbar installieren
        shell: bash
        run: npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps

      # Coverage executes the same unit suite and fails on assertion errors.
      - name: Unit-Tests einmal mit V8-Coverage ausführen
        shell: bash
        run: npm run test:coverage

      - name: CI/CD-Effizienz- und Herkunftsregressionen (read-only)
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-release-timing-0985376.mjs scripts/test-release-train-plan-0985376.mjs scripts/test-source-gate-evidence-0985376.mjs scripts/test-build-parity-0985377.mjs
          node scripts/test-versioning.mjs
          node scripts/test-installer-sharding-0985193.mjs
          node scripts/test-installer-verification-budget-0985190.mjs
          node scripts/test-core-regression-isolated-matrix-0985354.mjs
          node scripts/test-install-main-race-09572.mjs
          node scripts/test-github-actions-runtime.mjs
          node scripts/test-security-diagnostics-0985347.mjs
          node scripts/test-ruc-pages-free-storage-09700.mjs

      - name: Verbindliche RUC-D2-EU-Global-Phasenpriorität und OPERA-Isolation
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/metar-proxy.js
          node scripts/test-ruc-native-phase-radar-098491.mjs
          node scripts/test-radar-model-phase-reliability-09395.mjs
          node scripts/test-composite-precipitation-type-layer-09366.mjs
          npm run verify:types
          cmp ci/github/workflows/unit-coverage.yml .github/workflows/unit-coverage.yml
          npm run sync:github-workflows
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"

      # SHA256-pinned, read-only, optional P1 tool evaluation; never an approval.
      - name: MID P1 · actionlint, zizmor, Biome (QA-Pilot)
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'chatgpt/') || startsWith(github.head_ref, 'codex/'))
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          ZIZMOR_GITHUB_TOKEN: ''
        run: |
          set -euo pipefail
          node scripts/qa-mid-workflow-quality-pilot-0985455.mjs
          node tools/ci/mid-p1-tool-bootstrap.mjs

      - name: MID P1 · QA-Evidenz sichern
        if: always() && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'chatgpt/') || startsWith(github.head_ref, 'codex/'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-p1-quality-report
          path: ${{ runner.temp }}/mid-p1-tool-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Coverage-Bericht sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-vitest-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  draft-performance-build-evidence:
    name: MID Draft · unabhängiger CSS/JS-Diagnosebuild
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'chatgpt/') || startsWith(github.head_ref, 'codex/')) &&
      contains(github.head_ref, '-performance-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Performance-Draft auf exakten Quell-SHA binden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Node.js 22 für den unveränderten MID-Build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Reproduzierbare Abhängigkeiten installieren
        shell: bash
        run: npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps
      - name: Read-only QA-Build und SHA-gebundene Startup-Budgets prüfen
        shell: bash
        env:
          MID_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          SOURCE_HEAD=$(git rev-parse HEAD)
          echo "Diagnostic checkout SHA: $SOURCE_HEAD; expected: $MID_EXPECTED_SOURCE_SHA"
          test "$SOURCE_HEAD" = "$MID_EXPECTED_SOURCE_SHA"
          export GITHUB_SHA="$MID_EXPECTED_SOURCE_SHA"
          npm run build
          node scripts/test-bundle-budget-098594.mjs
          node scripts/check-build-budget.mjs
          node scripts/measure-startup-assets-0985482.mjs dist
          node scripts/audit-css-move-candidates-0985482.mjs
          node scripts/test-versioning.mjs
          node -e 'const f=require("node:fs");const i=JSON.parse(f.readFileSync("dist/mid-build-identity.json"));if(i.sourceGitSha!==process.env.MID_EXPECTED_SOURCE_SHA)throw Error("Build-Identität passt nicht zum Performance-Draft-HEAD");console.log("SHA-bound diagnostic build",i.sourceGitSha,"fingerprint",i.assetsSha256)'
          {
            echo '### MID Performance-Draft: unabhängig gebaut (keine Releasefreigabe)'
            echo
            echo '```json'
            node -e 'const j=require("./artifacts/build-budget.json");console.log(JSON.stringify({ok:j.ok,totals:j.totals,failures:j.failures},null,2))'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnosedaten des Performance-Drafts sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-draft-performance-build-evidence
          path: |
            artifacts/build-budget.json
            artifacts/startup-assets-0985482.json
            artifacts/css-move-risk-0985482.json
            dist/mid-build-identity.json
          if-no-files-found: warn
          retention-days: 7



  draft-css-mountain-browser-parity:
    name: MID Draft · Mountain CSS Original-Vergleich (16 reale Chromium-Profile)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'chatgpt/v0.9.85.483-css-js-performance-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    permissions:
      contents: read
    steps:
      - name: Kandidatenquellen auf exakt geprüften SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verifizierten .482-Stable als unveränderliche Layoutreferenz laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MeteoMartini/MID
          ref: f9c0b182b0e11278651e2afa13039015e1aa0f0b
          path: .mid-css-reference
          persist-credentials: false
      - name: Node 22 für unveränderte Vite-/Chromium-Fixtures
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Nur vertraglich festgeschriebene Pakete installieren
        shell: bash
        timeout-minutes: 8
        run: npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps
      - name: Historischen CSS-Golden und echte Chromium-Viewport-Parität prüfen
        timeout-minutes: 18
        shell: bash
        env:
          MID_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          MID_PARITY_BASE: ${{ github.workspace }}/.mid-css-reference
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MID_EXPECTED_SOURCE_SHA"
          test "$(git -C .mid-css-reference rev-parse HEAD)" = "f9c0b182b0e11278651e2afa13039015e1aa0f0b"
          export GITHUB_SHA="$MID_EXPECTED_SOURCE_SHA"
          node scripts/test-deferred-mountain-css-0985483.mjs
          node scripts/test-module-css-consolidation-0985170.mjs
      - name: Regelverwendungsdiagnose ablegen (kein Release-Gate-Ersatz)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-css-mountain-parity-evidence
          path: artifacts/css-module-coverage.json
          if-no-files-found: warn
          retention-days: 7


  draft-performance-map-postgc-evidence:
    name: MID Draft · vollständiger 20-Zyklen-Post-GC-Kartentest
    needs: draft-css-mountain-browser-parity
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'chatgpt/v0.9.85.483-css-js-performance-integration' &&
      needs['draft-css-mountain-browser-parity'].result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Unveränderlichen PR-Quellstand laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Node 22.16 einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Lockfile-Abhängigkeiten installieren
        timeout-minutes: 8
        run: npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps
      - name: RUC-Python-Testumgebung gemäß bestehendem Vollregressionsvertrag
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ruc/requirements-pages.txt
      - name: Reproduzierbare Python-/RUC-Abhängigkeiten
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check -r tools/ruc/requirements-pages.txt
      - name: Alle unveränderten Kartenfälle des 1/3-Shards und 20 Post-GC-Rundwechsel
        timeout-minutes: 18
        shell: bash
        env:
          MID_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          MID_REGRESSION_SHARD: heavy-unified-map
          MID_MAP_QA_SHARD: '1/3'
          MID_REGRESSION_VERBOSE: '1'
          MID_REGRESSION_JOBS: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MID_EXPECTED_SOURCE_SHA"
          export GITHUB_SHA="$MID_EXPECTED_SOURCE_SHA"
          npm run build
          npm run test:regressions
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          import {mapBrowserCases} from './scripts/map-browser-shards.mjs';
          const report=JSON.parse(readFileSync('/tmp/mid-map-runtime-baseline-1_3.json','utf8'));
          assert.equal(report.schema,'mid.map.runtime.fixture.v2');
          assert.equal(report.commit,process.env.MID_EXPECTED_SOURCE_SHA);
          assert.equal(report.version,'0.9.85.483');
          assert.equal(report.shard,'1/3');
          const functional=report.cases.filter(x=>x.caseKind==='functional-matrix');
          assert.equal(functional.length,mapBrowserCases('1/3').length,'Full mapped browser cases must execute');
          const samples=report.cases.filter(x=>x.caseKind==='isolated-memory-cycles');
          assert.equal(samples.length,1,'Exactly one full 20-cycle Post-GC memory case required');
          const memory=samples[0].memoryProfile;
          assert.ok(memory,'Missing real CDP-GC observations');
          assert.equal(memory.completedCycles,20);
          assert.deepEqual(memory.samples.map(x=>x.cycle),[0,5,10,15,20]);
          for(const row of memory.samples)for(const k of ['usedHeapBytes','allocatedHeapBytes','documents','nodes','listeners'])
            assert.ok(Number.isFinite(row[k])&&row[k]>=0,'Invalid '+k);
          mkdirSync('artifacts',{recursive:true});
          const artifact={schema:'mid.map.postgc.draft.v1',sourceSha:report.commit,
            note:'Synthetic Chromium MapLibre fixture only: not a leak verdict, GPU metric, iOS or user CWV',
            cases:functional.length,viewport:samples[0].width,theme:samples[0].theme,design:samples[0].design,memory};
          writeFileSync('artifacts/map-postgc-0985483.json',JSON.stringify(artifact,null,2)+'\n');
          console.log('MID_POST_GC_EVIDENCE '+JSON.stringify({sourceSha:report.commit,
            mapCases:functional.length,cycles:memory.completedCycles,heapDeltaBytes:memory.heapDeltaBytes,
            nodeDelta:memory.nodeDelta,listenerDelta:memory.listenerDelta}));
          NODE
      - name: Unveränderte Laufzeit-Samples speichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-performance-map-postgc-evidence
          path: |
            artifacts/map-postgc-0985483.json
            /tmp/mid-map-runtime-baseline-1_3.json
          if-no-files-found: warn
          retention-days: 7

  draft-regression-preflight:
    name: MID Draft · gezielte Regressionen
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'chatgpt/') || startsWith(github.head_ref, 'codex/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Exakten Draft-Commit laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Node.js 22 einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Betroffene Regressionen ermitteln
        id: regression-plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node --test tools/ci/mid-draft-regression-preflight.test.mjs
          plan="$RUNNER_TEMP/mid-draft-regression-plan.json"
          node tools/ci/mid-draft-regression-preflight.mjs --base "$BASE_SHA" --head "$HEAD_SHA" > "$plan"
          {
            echo '### MID Draft · gezielte Regressionen'
            echo
            echo '```json'
            cat "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "needs_npm=$(jq -r '.selected | length > 0' "$plan")" >> "$GITHUB_OUTPUT"
          echo "needs_scientific_python=$(jq -r '.requiresScientificPython' "$plan")" >> "$GITHUB_OUTPUT"

      - name: Abhängigkeiten für ausgewählte Regressionen installieren
        if: steps.regression-plan.outputs.needs_npm == 'true'
        shell: bash
        run: npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps

      - name: Scientific Python nur für gewählte RUC/GRIB-Regressionen
        if: steps.regression-plan.outputs.needs_scientific_python == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/ruc/requirements-pages.txt

      - name: Offizielle ecCodes-/Numerik-Testabhängigkeiten bereitstellen
        if: steps.regression-plan.outputs.needs_scientific_python == 'true'
        shell: bash
        run: python -m pip install --disable-pip-version-check -r tools/ruc/requirements-pages.txt

      - name: Gezielte Prüfungen am Draft-SHA ausführen
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/ci/mid-draft-regression-preflight.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --run

draft-css-cdp-real-browser-evidence:
    name: MID Draft · echte Chromium CSS-CDP-Belege (${{ matrix.fixture }})
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'chatgpt/v0.9.85.485-css-cdp-integrity-qa' &&
      github.event.pull_request.base.sha == 'c9fadfcd0969e949a92f414b321627dd3d4fb0cc'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fixture: [module, favorites]
    steps:
      - name: Unveränderten CSS-CDP-QA-HEAD SHA-gebunden laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Freigegebenen Stable als CSS-Paritätsreferenz unverändert laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MeteoMartini/MID
          ref: c9fadfcd0969e949a92f414b321627dd3d4fb0cc
          path: .mid-css-reference
          persist-credentials: false

      - name: Node.js für die unveränderten Chromium-Fixtures
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Unveränderte Projektabhängigkeiten reproduzierbar installieren
        shell: bash
        run: npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps

      - name: Browser-Fixture mit echter CSSOM-/Coverage-Regelerfassung prüfen
        shell: bash
        timeout-minutes: 19
        env:
          MID_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          MID_PARITY_BASE: ${{ github.workspace }}/.mid-css-reference
          FIXTURE: ${{ matrix.fixture }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MID_EXPECTED_SOURCE_SHA"
          test "$(git -C .mid-css-reference rev-parse HEAD)" = "c9fadfcd0969e949a92f414b321627dd3d4fb0cc"
          export GITHUB_SHA="$MID_EXPECTED_SOURCE_SHA"
          node --check scripts/lib/cssRuleUsageDiagnostic.mjs
          case "$FIXTURE" in
            module) node scripts/verify-module-css-browser-0985170.mjs ;;
            favorites) node scripts/verify-favorites-app-browser-0985242.mjs ;;
            *) echo "Unknown CSS fixture" >&2; exit 1 ;;
          esac
          echo "SHA-bound, real-Chromium CSS-CDP fixture $FIXTURE passed; NOT an iOS/VoiceOver or release approval."

      - name: CSS-CDP-Artefakt des echten Browserlaufs sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-design12-css-cdp-${{ matrix.fixture }}
          path: |
            artifacts/css-module-coverage.json
            artifacts/css-app-coverage.json
          if-no-files-found: warn
          retention-days: 7
