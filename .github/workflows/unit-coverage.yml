name: MID Unit Coverage
run-name: Vitest Unit-/Coverage-Pilot

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mid-unit-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-coverage:
    name: Vitest 5 + V8 Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Repository laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 22 einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: MID-Abhängigkeiten reproduzierbar installieren
        shell: bash
        run: npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps

      # Coverage executes the same unit suite and fails on assertion errors.
      - name: Unit-Tests einmal mit V8-Coverage ausführen
        shell: bash
        run: npm run test:coverage

      - name: CI/CD-Effizienz- und Herkunftsregressionen (read-only)
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-release-timing-0985376.mjs scripts/test-release-train-plan-0985376.mjs scripts/test-source-gate-evidence-0985376.mjs scripts/test-build-parity-0985377.mjs
          node scripts/test-installer-sharding-0985193.mjs
          node scripts/test-installer-verification-budget-0985190.mjs
          node scripts/test-core-regression-isolated-matrix-0985354.mjs
          node scripts/test-install-main-race-09572.mjs
          node scripts/test-github-actions-runtime.mjs
          node scripts/test-security-diagnostics-0985347.mjs
          node scripts/test-ruc-pages-free-storage-09700.mjs

      - name: Verbindliche RUC-D2-EU-Global-Phasenpriorität und OPERA-Isolation
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/metar-proxy.js
          node scripts/test-ruc-native-phase-radar-098491.mjs
          node scripts/test-radar-model-phase-reliability-09395.mjs
          node scripts/test-composite-precipitation-type-layer-09366.mjs
          npm run verify:types
          cmp ci/github/workflows/unit-coverage.yml .github/workflows/unit-coverage.yml
          npm run sync:github-workflows
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"

      # Non-gating, branch-scoped experiment: never part of Source/Installer/Stable authorization.
      # Official GitHub release asset SHA-256 digests verified on 2026-11-11.
      - name: MID actionlint + zizmor · optionaler Offline-Sicherheits-Pilot
        if: github.event_name == 'pull_request' && github.head_ref == 'chatgpt/v0.9.85.455-release-quality-pilot-12'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          ZIZMOR_GITHUB_TOKEN: ''
          ZIZMOR_OFFLINE: '1'
          NO_COLOR: '1'
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/mid-quality-scan-tools"
          report="$RUNNER_TEMP/mid-workflow-scan.json"
          mkdir -p "$tool_dir"
          trap 'if [ ! -s "$report" ]; then printf "%s\\n" "{\"schema\":1,\"status\":\"SCANNER_BOOTSTRAP_ERROR\",\"releaseAuthorized\":false,\"mergeAuthorized\":false}" > "$report"; fi' EXIT
          cd "$tool_dir"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' actionlint.tgz | sha256sum --check
          tar -xzf actionlint.tgz actionlint
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output zizmor.tgz \
            https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' 'bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b' zizmor.tgz | sha256sum --check
          tar -xzf zizmor.tgz zizmor
          chmod 755 "$tool_dir/actionlint" "$tool_dir/zizmor"
          export PATH="$tool_dir:$PATH"
          actionlint -version
          zizmor --version
          cd "$GITHUB_WORKSPACE"
          # Always retain the full read-only finding inventory, even on nonzero
          # security findings. The step remains explicitly non-gating.
          set +e
          node tools/ci/mid-workflow-quality-pilot.mjs > "$report"
          result=$?
          set -e
          cat "$report"
          if [ "$result" -ne 0 ]; then
            echo "::warning::Optional offline QA reported findings or tool errors, NOT a release approval."
          fi
          exit "$result"

      - name: MID optionalen Offline-Scannerbericht sichern
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'chatgpt/v0.9.85.455-release-quality-pilot-12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-offline-actionlint-zizmor-pilot
          path: ${{ runner.temp }}/mid-workflow-scan.json
          if-no-files-found: warn
          retention-days: 7

      - name: Coverage-Bericht sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-vitest-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
