name: MID Unit Coverage
run-name: Vitest Unit-/Coverage-Pilot

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mid-unit-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-coverage:
    name: Vitest 5 + V8 Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Repository laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 22 einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: MID-Abhängigkeiten reproduzierbar installieren
        shell: bash
        run: npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps

      # Coverage executes the same unit suite and fails on assertion errors.
      - name: Unit-Tests einmal mit V8-Coverage ausführen
        shell: bash
        run: npm run test:coverage

      - name: CI/CD-Effizienz- und Herkunftsregressionen (read-only)
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-release-timing-0985376.mjs scripts/test-release-train-plan-0985376.mjs scripts/test-source-gate-evidence-0985376.mjs scripts/test-build-parity-0985377.mjs
          node scripts/test-versioning.mjs
          node scripts/test-installer-sharding-0985193.mjs
          node scripts/test-installer-verification-budget-0985190.mjs
          node scripts/test-core-regression-isolated-matrix-0985354.mjs
          node scripts/test-install-main-race-09572.mjs
          node scripts/test-github-actions-runtime.mjs
          node scripts/test-security-diagnostics-0985347.mjs
          node scripts/test-ruc-pages-free-storage-09700.mjs

      - name: Verbindliche RUC-D2-EU-Global-Phasenpriorität und OPERA-Isolation
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/metar-proxy.js
          node scripts/test-ruc-native-phase-radar-098491.mjs
          node scripts/test-radar-model-phase-reliability-09395.mjs
          node scripts/test-composite-precipitation-type-layer-09366.mjs
          npm run verify:types
          cmp ci/github/workflows/unit-coverage.yml .github/workflows/unit-coverage.yml
          npm run sync:github-workflows
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"

      # SHA256-pinned, read-only, optional P1 tool evaluation; never an approval.
      - name: MID P1 · actionlint, zizmor, Biome (QA-Pilot)
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'chatgpt/') || startsWith(github.head_ref, 'codex/'))
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          ZIZMOR_GITHUB_TOKEN: ''
        run: |
          set -euo pipefail
          node scripts/qa-mid-workflow-quality-pilot-0985455.mjs
          node tools/ci/mid-p1-tool-bootstrap.mjs

      - name: MID P1 · QA-Evidenz sichern
        if: always() && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'chatgpt/') || startsWith(github.head_ref, 'codex/'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-p1-quality-report
          path: ${{ runner.temp }}/mid-p1-tool-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Coverage-Bericht sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-vitest-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  draft-regression-preflight:
    name: MID Draft · gezielte Regressionen
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'chatgpt/') || startsWith(github.head_ref, 'codex/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Exakten Draft-Commit laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Node.js 22 einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Betroffene Regressionen ermitteln
        id: regression-plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node --test tools/ci/mid-draft-regression-preflight.test.mjs
          plan="$RUNNER_TEMP/mid-draft-regression-plan.json"
          node tools/ci/mid-draft-regression-preflight.mjs --base "$BASE_SHA" --head "$HEAD_SHA" > "$plan"
          {
            echo '### MID Draft · gezielte Regressionen'
            echo
            echo '```json'
            cat "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "needs_npm=$(jq -r '.selected | length > 0' "$plan")" >> "$GITHUB_OUTPUT"
          echo "needs_scientific_python=$(jq -r '.requiresScientificPython' "$plan")" >> "$GITHUB_OUTPUT"

      - name: Abhängigkeiten für ausgewählte Regressionen installieren
        if: steps.regression-plan.outputs.needs_npm == 'true'
        shell: bash
        run: npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps

      - name: Scientific Python nur für gewählte RUC/GRIB-Regressionen
        if: steps.regression-plan.outputs.needs_scientific_python == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/ruc/requirements-pages.txt

      - name: Offizielle ecCodes-/Numerik-Testabhängigkeiten bereitstellen
        if: steps.regression-plan.outputs.needs_scientific_python == 'true'
        shell: bash
        run: python -m pip install --disable-pip-version-check -r tools/ruc/requirements-pages.txt

      - name: Gezielte Prüfungen am Draft-SHA ausführen
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/ci/mid-draft-regression-preflight.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --run
