name: MID 18.2.5 UI-Patch anwenden

on:
  push:
    branches:
      - chatgpt/mid-18-2-5-ui-fixes-098585

permissions:
  contents: write

concurrency:
  group: mid-18-2-5-ui-fixes-098585
  cancel-in-progress: false

jobs:
  apply:
    name: Gesammelte Replit-Patches in Produktquellen übernehmen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Branch laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/mid-18-2-5-ui-fixes-098585
          fetch-depth: 0
      - name: UI-Patch deterministisch anwenden
        run: node scripts/apply-mid-18-2-5-ui-fixes-098585.mjs
      - name: Geänderten Quellstand committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json MID_BASELINE.json src/version.ts src/App.tsx src/ForecastCockpit.tsx src/main.tsx
          if git diff --cached --quiet; then
            echo "Patch ist bereits vollständig angewendet."
            exit 0
          fi
          git commit -m "MID v0.9.85.85: apply combined Replit UI fixes"
          git push origin HEAD:chatgpt/mid-18-2-5-ui-fixes-098585
