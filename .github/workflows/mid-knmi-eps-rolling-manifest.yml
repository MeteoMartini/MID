name: MID KNMI EPS rolling manifest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mid-knmi-eps-rolling-manifest
  cancel-in-progress: true

jobs:
  validate-rolling-eps:
    name: Validate six-hour KNMI P4a rolling ensemble
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KNMI_DATASET: harmonie_arome_cy43_p4a
      KNMI_DATASET_VERSION: "1.0"
      KNMI_API_KEY: ${{ secrets.KNMI_OPEN_DATA_API_KEY }}

    steps:
      - name: Validate six latest hourly archives and member batches
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KNMI_API_KEY:-}" ]; then
            echo "::error::KNMI_OPEN_DATA_API_KEY fehlt oder ist leer."
            exit 1
          fi

          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request

          api_key = os.environ["KNMI_API_KEY"]
          dataset = os.environ["KNMI_DATASET"]
          version = os.environ["KNMI_DATASET_VERSION"]
          base = "https://api.dataplatform.knmi.nl/open-data/v1"

          archive_re = re.compile(r"^harm43_v1_P4a_(\d{10})\.tar$")
          member_re = re.compile(
              r"_meteo_(\d{3})_(\d{12})_(\d{5})_GB$"
          )

          transferred_header_bytes = 0

          def api_json(url):
              req = urllib.request.Request(
                  url,
                  headers={"Authorization": api_key},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          # Ask for a few extra objects so duplicate/non-matching entries
          # cannot prevent us from finding six unique hourly P4a archives.
          query = urllib.parse.urlencode({
              "maxKeys": 12,
              "orderBy": "created",
              "sorting": "desc",
          })
          list_url = f"{base}/datasets/{dataset}/versions/{version}/files?{query}"

          try:
              listing = api_json(list_url)
          except Exception as exc:
              print(f"::error::KNMI-Dateiliste fehlgeschlagen: {exc}")
              sys.exit(1)

          candidates = []
          seen_stamp = set()

          for item in listing.get("files") or []:
              filename = item.get("filename") or ""
              match = archive_re.match(filename)
              if not match:
                  continue

              stamp_text = match.group(1)
              if stamp_text in seen_stamp:
                  continue

              try:
                  run_time = dt.datetime.strptime(
                      stamp_text,
                      "%Y%m%d%H",
                  ).replace(tzinfo=dt.timezone.utc)
              except ValueError:
                  continue

              seen_stamp.add(stamp_text)
              candidates.append({
                  "filename": filename,
                  "stamp": stamp_text,
                  "run_time": run_time,
                  "created": item.get("created"),
                  "size": item.get("size"),
              })

              if len(candidates) == 6:
                  break

          if len(candidates) < 6:
              print(
                  f"::error::Nur {len(candidates)} eindeutige P4a-Stundenarchive "
                  "unter den jüngsten KNMI-Dateien gefunden."
              )
              sys.exit(1)

          # API order is newest -> oldest. Work chronologically.
          archives = list(reversed(candidates))

          def range_get(url, start, length):
              nonlocal_dummy = None
              global transferred_header_bytes
              end = start + length - 1
              req = urllib.request.Request(
                  url,
                  headers={
                      "Range": f"bytes={start}-{end}",
                      "Accept-Encoding": "identity",
                      "User-Agent": "MID-KNMI-EPS-rolling-manifest/1.0",
                  },
              )
              try:
                  response = urllib.request.urlopen(req, timeout=30)
              except Exception as exc:
                  print(
                      f"::error::HTTP-Range {start}-{end} fehlgeschlagen: {exc}"
                  )
                  sys.exit(1)

              try:
                  status = getattr(response, "status", None)
                  content_range = response.headers.get("Content-Range", "")
                  if status != 206:
                      print(
                          "::error::Range-Request nicht mit HTTP 206 beantwortet "
                          f"(Status {status})."
                      )
                      sys.exit(1)

                  match = re.match(
                      r"bytes\s+(\d+)-(\d+)/(\d+|\*)",
                      content_range,
                  )
                  if not match:
                      print(
                          f"::error::Ungültiger Content-Range: {content_range!r}"
                      )
                      sys.exit(1)

                  if int(match.group(1)) != start or int(match.group(2)) != end:
                      print(
                          "::error::Gelieferter Range entspricht nicht der Anfrage: "
                          f"{content_range}"
                      )
                      sys.exit(1)

                  data = response.read(length + 1)
                  if len(data) != length:
                      print(
                          f"::error::Range lieferte {len(data)} statt {length} Byte."
                      )
                      sys.exit(1)

                  transferred_header_bytes += len(data)
                  return data
              finally:
                  response.close()

          def parse_octal(raw):
              text = raw.rstrip(b"\0 ").lstrip(b" ")
              if not text:
                  return 0
              try:
                  return int(text, 8)
              except ValueError:
                  return None

          def decode_text(raw):
              return raw.split(b"\0", 1)[0].decode(
                  "utf-8",
                  "replace",
              ).strip()

          def first_real_member(download_url):
              # Current KNMI TARs begin with a tiny PAX header followed by
              # a regular HARMONIE GRIB member. Keep the parser generic
              # and allow a few metadata entries before the first GRIB.
              offset = 0

              for _ in range(8):
                  header = range_get(download_url, offset, 512)

                  if header == b"\0" * 512:
                      return None

                  name = decode_text(header[0:100])
                  prefix = decode_text(header[345:500])
                  if prefix:
                      name = f"{prefix}/{name}"

                  size = parse_octal(header[124:136])
                  typeflag = header[156:157].decode(
                      "ascii",
                      "replace",
                  ) or "0"

                  if size is None:
                      return None

                  match = member_re.search(name)
                  if typeflag in ("0", "\x00") and match:
                      return {
                          "name": name,
                          "member": int(match.group(1)),
                          "nominal_stamp": match.group(2),
                          "forecast_code": match.group(3),
                          "size": size,
                      }

                  offset += 512 + ((size + 511) // 512) * 512

              return None

          # Verify the six archives are truly consecutive hourly runs.
          gap_errors = []

          for older, newer in zip(archives, archives[1:]):
              delta = newer["run_time"] - older["run_time"]
              if delta != dt.timedelta(hours=1):
                  gap_errors.append(
                      f"{older['stamp']} -> {newer['stamp']} = "
                      f"{delta.total_seconds()/3600:g} h"
                  )

          if gap_errors:
              print("::error::Die sechs jüngsten P4a-Archive sind nicht lückenlos:")
              for error in gap_errors:
                  print(f"  - {error}")
              print(
                  "::error::Kein vollständiges rollendes 30-Member-EPS "
                  "für diesen Zeitpunkt ableitbar."
              )
              sys.exit(1)

          observed_batches = []
          all_members = set()

          for archive in archives:
              encoded = urllib.parse.quote(
                  archive["filename"],
                  safe="",
              )
              endpoint = (
                  f"{base}/datasets/{dataset}/versions/{version}/files/"
                  f"{encoded}/url"
              )

              try:
                  url_payload = api_json(endpoint)
              except Exception as exc:
                  print(
                      f"::error::Download-URL für {archive['filename']} "
                      f"fehlgeschlagen: {exc}"
                  )
                  sys.exit(1)

              download_url = url_payload.get("temporaryDownloadUrl")
              if (
                  not isinstance(download_url, str)
                  or not download_url.startswith("https://")
              ):
                  print(
                      f"::error::Keine gültige Download-URL für "
                      f"{archive['filename']}."
                  )
                  sys.exit(1)

              first = first_real_member(download_url)
              if not first:
                  print(
                      f"::error::Kein reguläres HARMONIE-Mitglied in "
                      f"{archive['filename']} erkannt."
                  )
                  sys.exit(1)

              hour = archive["run_time"].hour
              batch_index = (hour % 6) + 1
              expected_start = (batch_index - 1) * 5 + 1
              expected_end = batch_index * 5
              expected_members = list(
                  range(expected_start, expected_end + 1)
              )

              # KNMI TAR ordering observed in production starts with the
              # highest member number of the current five-member batch.
              if first["member"] != expected_end:
                  print(
                      f"::error::{archive['filename']}: erstes TAR-Mitglied "
                      f"ist Member {first['member']}, erwartet wurde "
                      f"Batch-Ende {expected_end}."
                  )
                  sys.exit(1)

              all_members.update(expected_members)
              observed_batches.append({
                  "archive": archive["filename"],
                  "run_utc": archive["run_time"].isoformat(),
                  "created": archive["created"],
                  "archive_size": archive["size"],
                  "batch_index": batch_index,
                  "members": expected_members,
                  "first_tar_member": first["member"],
                  "first_tar_name": first["name"],
                  "first_forecast_code": first["forecast_code"],
              })

          if all_members != set(range(1, 31)):
              missing = sorted(set(range(1, 31)) - all_members)
              extra = sorted(all_members - set(range(1, 31)))
              print(
                  "::error::Rollende Batchfolge deckt Member 1..30 nicht exakt ab."
              )
              print(f"Missing: {missing}")
              print(f"Extra: {extra}")
              sys.exit(1)

          oldest = archives[0]["run_time"]
          newest = archives[-1]["run_time"]

          result = {
              "schema": "mid.knmi.eps-rolling-manifest.v1",
              "dataset": f"{dataset}/{version}",
              "status": "complete",
              "oldest_batch_run_utc": oldest.isoformat(),
              "newest_batch_run_utc": newest.isoformat(),
              "batch_span_hours": int(
                  (newest - oldest).total_seconds() / 3600
              ),
              "ensemble_members": list(range(1, 31)),
              "member_count": 30,
              "control_member_0": (
                  "present in every KNMI run; not counted as a 31st MID "
                  "ensemble member"
              ),
              "knmi_documented_common_horizon_hours": 54,
              "archives": observed_batches,
              "header_bytes_transferred": transferred_header_bytes,
              "full_tar_downloaded": False,
          }

          print("KNMI rolling EPS manifest: OK")
          print(
              f"Runs: {oldest.isoformat()} -> {newest.isoformat()} "
              f"({result['batch_span_hours']} h span)"
          )
          print("Member coverage: 1..30 complete")
          print(
              "Member 0: control/reference only; excluded from the "
              "30-member MID ensemble distribution"
          )
          print(
              "KNMI documented common rolling horizon: "
              f"{result['knmi_documented_common_horizon_hours']} h"
          )
          print(
              f"TAR header bytes actually transferred: "
              f"{transferred_header_bytes}"
          )
          print("Complete TAR downloaded: NO")
          print("")
          print("Batches:")

          for batch in observed_batches:
              members = batch["members"]
              print(
                  f"- {batch['run_utc']}  "
                  f"members {members[0]:02d}-{members[-1]:02d}  "
                  f"first TAR member={batch['first_tar_member']:02d}"
              )

          print("")
          print("JSON:")
          print(json.dumps(
              result,
              indent=2,
              ensure_ascii=False,
              sort_keys=True,
          ))
          PY
