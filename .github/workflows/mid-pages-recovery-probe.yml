name: MID Pages Recovery Probe (read-only)
on:
  push:
    branches: [chatgpt/v0.9.85.516-pages-provenance-diagnostics]
    paths: ['.github/workflows/mid-pages-recovery-probe.yml']
permissions:
  contents: read
  actions: read
  deployments: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify original installer evidence and archive metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = MeteoMartini/MID
          mkdir -p "$RUNNER_TEMP/mid-evidence"
          cd "$RUNNER_TEMP/mid-evidence"
          main=ab96ac712fd4f3ba9be5af2cb546febf9ee13329
          stable=331fffff081303e1c597badddfa4ae41c4b4e0f0
          packet=1fde94a858f5c2d405f6dc3f91e2b763b5319c8f
          api() { gh api "repos/MeteoMartini/MID/$1"; }
          api "commits/$main" > installed.json
          api "commits/$packet" > packet.json
          api "compare/$stable...$main" > lineage.json
          api actions/runs/45256731707 > run.json
          api 'actions/runs/45256731707/attempts/1/jobs?per_page=100' > inventory.json
          api git/ref/heads/main > main.json
          api git/ref/heads/mid-stable > stable.json
          api actions/artifacts/14857424295 | jq -e --arg sha "$packet" '
            .expired == false and .workflow_run.id == 45256731707 and .workflow_run.head_sha == $sha and
            .digest == "sha256:41ac1474f7bc90c560c314e8f2a359fba59e4ba5e5db5666d4f789ebb4656acf"' >/dev/null
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const {assessPostInstallEvidence} = await import(process.env.GITHUB_WORKSPACE + '/tools/ci/post-install-recovery-evidence.mjs');
          const read = name => JSON.parse(readFileSync(name + '.json','utf8'));
          const stable = read('stable').object.sha;
          const result = assessPostInstallEvidence({
            installed: read('installed'), packet: read('packet'), lineage: read('lineage'),
            run: read('run'), inventory: read('inventory'), stable,
            finalRefs: {main: read('main').object.sha, stable},
          });
          console.log(JSON.stringify(result));
          if (!result.evidenceComplete) process.exit(1);
          JS
      - name: Find authenticated active Pages artifact without deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/MeteoMartini/MID/deployments?environment=github-pages&per_page=12' --jq '.[] | [.id,.sha] | @tsv' |
            while read -r id sha; do
              [[ "$id" =~ ^[0-9]+$ && "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
              gh api "repos/MeteoMartini/MID/deployments/$id/statuses?per_page=1" |
                jq -c --arg id "$id" --arg sha "$sha" '[.[] | {id:$id,sha:$sha,state,created_at,run:(.log_url|capture("/runs/(?<id>[0-9]+)").id // "")}]'
            done
          PYTHONPATH=tools/ruc python3 -B - <<'PY'
          import json
          from resolve_fast_pages_base import resolve_installer_pages
          proof = resolve_installer_pages(
              '331fffff081303e1c597badddfa4ae41c4b4e0f0',
              pending_release='ab96ac712fd4f3ba9be5af2cb546febf9ee13329')
          print(json.dumps(proof, sort_keys=True))
          PY
