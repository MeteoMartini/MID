name: MID dependency and maintenance audit
run-name: Abhängigkeiten und Release-Vertrag prüfen

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: mid-dependency-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Lockfile, Abhängigkeiten und Regressionen prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Repository laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: mid-stable
      - name: Node.js mit npm-Cache einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhängigkeiten reproduzierbar installieren
        shell: bash
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps
      - name: Vollständigen Auditbericht erzeugen
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high --json > npm-audit-full.json || true
      - name: Auditbericht auch bei Befund als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-dependency-audit-${{ github.run_id }}
          path: npm-audit-full.json
          if-no-files-found: error
          retention-days: 30
      - name: Sicherheitsprüfung als hartes Release-Gate ausführen
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:all
      - name: Python für die vollständigen RUC-Regressionen einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/ruc/requirements-pages.txt

      - name: Vorhandene RUC-Testabhängigkeiten installieren
        shell: bash
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check -r tools/ruc/requirements-pages.txt

      - name: Release- und Wartungsregressionen ausführen
        shell: bash
        run: |
          set -euo pipefail
          npm run test:maintenance-08260
          npm run test:regressions
