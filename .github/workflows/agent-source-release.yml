name: MID Agent Source Release
run-name: Geprüften Agent-PR automatisch veröffentlichen

on:
  workflow_run:
    workflows:
      - MID ChatGPT/Codex Source-PR Gate
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: mid-agent-source-release
  # Preserve waiting release requests; never cancel an active release.
  queue: max
  cancel-in-progress: false

jobs:
  merge_package_dispatch:
    name: PR mergen, Release-ZIP erzeugen und Installer starten
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: MID Release Bot Token erzeugen
        id: release_app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.MID_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MID_RELEASE_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: write
          permission-pull-requests: write

      - name: Geprüften PR robust identifizieren
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_BOT_SLUG: ${{ steps.release_app_token.outputs.app-slug }}
        run: |
          set -euo pipefail
          case "$RUN_HEAD_BRANCH" in
            chatgpt/*|codex/*) ;;
            *)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Workflow-Run gehört nicht zu einem autorisierten Agent-Branch: ${RUN_HEAD_BRANCH}"
              exit 0
              ;;
          esac

          owner="${GITHUB_REPOSITORY%%/*}"
          prs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=all \
            -f base=main \
            -f head="${owner}:${RUN_HEAD_BRANCH}" \
            -f per_page=100)"

          matches="$(jq --arg repo "$GITHUB_REPOSITORY" --arg sha "$RUN_HEAD_SHA" '[.[] | select(.head.repo.full_name == $repo and .head.sha == $sha and .draft == false and (.state == "open" or .merged_at != null))]' <<<"$prs")"
          count="$(jq 'length' <<<"$matches")"
          if [ "$count" != "1" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Kein exakt passender offener oder bereits geschützter gemergter Agent-PR für ${RUN_HEAD_BRANCH}@${RUN_HEAD_SHA} gefunden; Auto-Release wird sauber übersprungen."
            exit 0
          fi

          pr_number="$(jq -r '.[0].number' <<<"$matches")"
          head_sha="$(jq -r '.[0].head.sha' <<<"$matches")"
          if [ "$(jq -r '.[0].merged_at != null' <<<"$matches")" = "true" ]; then
            merge_sha="$(jq -r '.[0].merge_commit_sha // empty' <<<"$matches")"
            if [[ ! "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Previously merged PR has no valid merge SHA; no ZIP recovery."
              exit 1
            fi
            current_main="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
            if [ "$current_main" != "$merge_sha" ]; then
              # Never replay an independent event. Only a bounded rerun whose
              # previous attempt completed ZIP packaging but failed dispatch.
              if [[ ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[23]$ ]]; then
                echo "eligible=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Stale merged PR/source event skipped without re-dispatch."
                exit 0
              fi
              previous_attempt="$((GITHUB_RUN_ATTEMPT - 1))"
              previous_jobs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${previous_attempt}/jobs?per_page=100")"
              # MID_INSTALL_RECOVERY_PREVIOUS_JOB
              if ! jq -e --arg name "PR mergen, Release-ZIP erzeugen und Installer starten" '
                (.total_count == 1)
                and ((.jobs | length) == 1)
                and (.jobs[0].name == $name)
                and (.jobs[0].conclusion == "failure")
                and ([.jobs[0].steps[] | select(.name == "Release-ZIP aus dem aktuellen main-Quellstand erzeugen und committen" and .conclusion == "success")] | length == 1)
                and ([.jobs[0].steps[] | select(.name == "Bewährten MID-Installer explizit starten" and .conclusion == "failure")] | length == 1)
              ' <<<"$previous_jobs" >/dev/null; then
                echo "eligible=false" >> "$GITHUB_OUTPUT"
                echo "::notice::No verified previous Installer-dispatch failure; no replay."
                exit 0
              fi
              live_package="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits/${current_main}")"
              # MID_INSTALL_RECOVERY_ZIP_PROVENANCE
              if ! jq -e --arg sha "$current_main" --arg merge "$merge_sha" --arg bot "${RELEASE_BOT_SLUG}[bot]" --arg title "Prepare MID agent release from PR #${pr_number}" '
                (.sha == $sha)
                and ((.parents | length) == 1)
                and (.parents[0].sha == $merge)
                and (.author.login == $bot)
                and (.committer.login == $bot)
                and (.commit.message == $title)
                and ((.files | length) == 1)
                and (.files[0].filename == "MID-professional-replacement.zip")
                and ((.files[0].status == "added") or (.files[0].status == "modified"))
              ' <<<"$live_package" >/dev/null; then
                echo "::error::Foreign or incomplete ZIP commit cannot authorize recovery."
                exit 1
              fi
              installer_runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/install-mid.yml/runs?event=workflow_dispatch&head_sha=${current_main}&per_page=100")"
              # MID_INSTALL_RECOVERY_NO_DUPLICATE
              if ! jq -e '(.total_count == 0) and ((.workflow_runs | length) == 0)' <<<"$installer_runs" >/dev/null; then
                echo "::error::Installer already exists or inventory incomplete; no duplicate dispatch."
                exit 1
              fi
              echo "package_recovered=true" >> "$GITHUB_OUTPUT"
              echo "package_sha=${current_main}" >> "$GITHUB_OUTPUT"
              echo "::notice::Installer-only retry authorized for the exact GitHub ZIP commit."
            fi
            echo "already_merged=true" >> "$GITHUB_OUTPUT"
            echo "merge_sha=${merge_sha}" >> "$GITHUB_OUTPUT"
          else
            echo "already_merged=false" >> "$GITHUB_OUTPUT"
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

      # Read-only guard comes from released Stable, never an unreviewed PR head.
      - name: Aktuellen Stable-Reviewguard laden
        if: steps.pr.outputs.eligible == 'true' && steps.pr.outputs.already_merged != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: mid-stable
          persist-credentials: false

      - name: Node.js 22 für Review-Readback
        if: steps.pr.outputs.eligible == 'true' && steps.pr.outputs.already_merged != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0

      - name: Geprüften Agent-PR automatisch zusammenführen
        if: steps.pr.outputs.eligible == 'true' && steps.pr.outputs.already_merged != 'true'
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          EXPECTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # Server-side conversation protection closes the final readback-to-merge race.
          node tools/ci/mid-review-premerge-guard.mjs
          response="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" -f merge_method=squash -f sha="${EXPECTED_HEAD_SHA}" -f commit_title="MID Agent-Release PR #${PR_NUMBER}")"
          if [ "$(jq -r '.merged' <<<"$response")" != "true" ]; then
            echo "::error::GitHub hat den geprüften Agent-PR nicht zusammengeführt."
            jq . <<<"$response"
            exit 1
          fi
          echo "merge_sha=$(jq -r '.sha' <<<"$response")" >> "$GITHUB_OUTPUT"

      - name: Zusammengeführten main-Stand laden
        if: steps.pr.outputs.eligible == 'true' && steps.pr.outputs.package_recovered != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.merge.outputs.merge_sha || steps.pr.outputs.merge_sha }}
          # Immutable, authorized squash merge SHA, not a floating main HEAD.
          fetch-depth: 1
          persist-credentials: false

      - name: Release-ZIP aus dem aktuellen main-Quellstand erzeugen und committen
        if: steps.pr.outputs.eligible == 'true' && steps.pr.outputs.package_recovered != 'true'
        id: package
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          RELEASE_BOT_SLUG: ${{ steps.release_app_token.outputs.app-slug }}
          EXPECTED_MERGE_SHA: ${{ steps.merge.outputs.merge_sha || steps.pr.outputs.merge_sha }}
        run: |
          set -euo pipefail
          bot_user_id="$(gh api "/users/${RELEASE_BOT_SLUG}[bot]" --jq .id)"
          git config user.name "${RELEASE_BOT_SLUG}[bot]"
          git config user.email "${bot_user_id}+${RELEASE_BOT_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
          make_zip() {
            rm -f MID-professional-replacement.zip
            python3 <<'PY'
          import subprocess
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, is_zipfile
          out = Path('MID-professional-replacement.zip')
          excluded_roots = {'.github', '.git', 'node_modules', 'dist'}
          excluded_files = {'MID-professional-replacement.zip'}
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with ZipFile(out, 'w', ZIP_DEFLATED, compresslevel=9) as zf:
              for raw in tracked:
                  if not raw:
                      continue
                  path = Path(raw)
                  if path.parts and path.parts[0] in excluded_roots:
                      continue
                  if path.name in excluded_files:
                      continue
                  if path.is_symlink():
                      raise SystemExit(f'Symlink im Release-Quellstand unzulässig: {path}')
                  if path.is_file():
                      zf.write(path, path.as_posix())
          if not is_zipfile(out):
              raise SystemExit('Release-Paket ist kein gültiges ZIP')
          with ZipFile(out) as zf:
              corrupt = zf.testzip()
              if corrupt is not None:
                  raise SystemExit(f'Beschädigter ZIP-Eintrag: {corrupt}')
              names = set(zf.namelist())
              for required in ('package.json', 'package-lock.json', 'MID_BASELINE.json', 'MID_SOURCE_OF_TRUTH.md'):
                  if required not in names:
                      raise SystemExit(f'Release-Paket fehlt: {required}')
              for prefix in ('src/', 'worker/', 'public/', 'ios/'):
                  if not any(name.startswith(prefix) for name in names):
                      raise SystemExit(f'Release-Paket fehlt: {prefix}')
          print(f'Release-ZIP: {out.stat().st_size} Byte')
          PY
          }
          if [[ ! "$EXPECTED_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub did not return a valid authorized merge SHA."
            exit 1
          fi
          pushed=false
          for attempt in 1 2 3; do
            git fetch --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
            actual_main_sha="$(git rev-parse refs/remotes/origin/main)"
            if [ "$actual_main_sha" != "$EXPECTED_MERGE_SHA" ]; then
              echo "::error::main changed after approved merge; never package an unrelated source commit."
              exit 1
            fi
            git reset --hard "$EXPECTED_MERGE_SHA"
            make_zip
            git add -f MID-professional-replacement.zip
            git commit -m "Prepare MID agent release from PR #${{ steps.pr.outputs.number }}"
            package_sha="$(git rev-parse HEAD)"
            if git push origin HEAD:main; then
              pushed=true
              echo "package_sha=${package_sha}" >> "$GITHUB_OUTPUT"
              break
            fi
            remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [ "$remote_main" = "$package_sha" ]; then
              echo "::notice::Exactly this ZIP commit reached GitHub despite lost push acknowledgement."
              pushed=true
              echo "package_sha=${package_sha}" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$remote_main" != "$EXPECTED_MERGE_SHA" ]; then
              echo "::error::Remote main drifted; ZIP retry cannot rebuild from a foreign SHA."
              exit 1
            fi
            echo "::warning::Retrying transport only for unchanged approved merge (${attempt}/3)."
            sleep $((attempt * 2))
          done
          if [ "$pushed" != true ]; then
            echo "::error::Release-Paket konnte nach drei race-sicheren Versuchen nicht nach main übertragen werden."
            exit 1
          fi

      - name: Bewährten MID-Installer explizit starten
        if: steps.pr.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          EXPECTED_PACKAGE_SHA: ${{ steps.package.outputs.package_sha || steps.pr.outputs.package_sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ ! "$EXPECTED_PACKAGE_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$current_main" != "$EXPECTED_PACKAGE_SHA" ]; then
            echo "::error::Installer dispatch refused because main no longer equals the approved ZIP SHA."
            exit 1
          fi
          gh workflow run install-mid.yml --ref main -f expected_package_sha="$EXPECTED_PACKAGE_SHA"
          {
            echo "### Automatischer MID-Release gestartet"
            echo
            echo "- PR: #${{ steps.pr.outputs.number }}"
            echo "- Merge: ${{ steps.merge.outputs.merge_sha || steps.pr.outputs.merge_sha }}"
            echo "- Release-Paket: ${{ steps.package.outputs.package_sha }}"
            echo "- Installer: install-mid.yml via workflow_dispatch"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Übersprungenen Run dokumentieren
        if: steps.pr.outputs.eligible != 'true'
        shell: bash
        run: |
          {
            echo "### Auto-Release übersprungen"
            echo
            echo "Für den abgeschlossenen Source-Gate-Lauf existiert kein exakt passender offener Agent-PR mehr."
            echo "Es wurde weder gemergt noch paketiert oder deployt."
          } >> "$GITHUB_STEP_SUMMARY"
