name: Temporary Work Package I Handoff

on:
  push:
    branches:
      - chatgpt/mid-0.9.85.90-i
    paths:
      - scripts/apply-work-package-i.mjs
      - scripts/test-work-package-i.mjs
      - scripts/test-settings-menu.mjs
      - .github/workflows/tmp-apply-work-package-i.yml

permissions:
  contents: write

concurrency:
  group: mid-work-package-i-handoff
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[I-HANDOFF-DONE]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/mid-0.9.85.90-i
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Repair bootstrap and apply guarded production transform
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-work-package-i.mjs')
          s=p.read_text()
          start=s.index("write('scripts/test-work-package-i.mjs',`")
          end=s.index("const pkg=", start)
          s=s[:start]+s[end:]
          s=s.replace('<LayoutGrid size={18}/>','<SlidersHorizontal size={18}/>')
          p.write_text(s)
          PY
          set +e
          node scripts/apply-work-package-i.mjs > validation-error.log 2>&1
          status=$?
          set -e
          cat validation-error.log
          if [ "$status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add validation-error.log
            git commit -m 'chore: capture I handoff transform failure'
            git push origin HEAD:chatgpt/mid-0.9.85.90-i
            exit "$status"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Validate transformed source
        run: |
          set +e
          : > validation-error.log
          npm run test:work-package-i >> validation-error.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then npm run build >> validation-error.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then npm run test:settings >> validation-error.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then npm run test:ui-regressions >> validation-error.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then npm run test:navigation-favorites >> validation-error.log 2>&1; status=$?; fi
          set -e
          cat validation-error.log
          if [ "$status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add validation-error.log
            git commit -m 'chore: capture I handoff validation failure'
            git push origin HEAD:chatgpt/mid-0.9.85.90-i
            exit "$status"
          fi
          rm -f validation-error.log
      - name: Remove temporary handoff machinery
        run: |
          rm -f scripts/apply-work-package-i.mjs
          rm -f .github/workflows/tmp-apply-work-package-i.yml
          rm -f handoff-error.log validation-error.log
      - name: Commit verified source handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: MID v0.9.85.90 work package I [I-HANDOFF-DONE]'
          git push origin HEAD:chatgpt/mid-0.9.85.90-i
