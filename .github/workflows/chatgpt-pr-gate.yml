name: MID ChatGPT/Codex Source-PR Gate
run-name: MID-Agent-Quellstand prüfen

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: mid-agent-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source_core:
    name: Source-Kern vollständig prüfen
    if: >-
      (startsWith(github.head_ref, 'chatgpt/') || startsWith(github.head_ref, 'codex/')) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # RUC admission (20m) and core build/regressions (15m) run sequentially.
    # Keep both step limits unchanged and leave room for setup/iOS/packaging.
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: PR-Mergezustand laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Zwei Ebenen erlauben den Vergleich des SHA-genauen Merge-Snapshots mit dessen Basis.
          fetch-depth: 2

      - name: MID-Quellstruktur prüfen
        shell: bash
        run: |
          set -euo pipefail
          for required in package.json package-lock.json MID_BASELINE.json MID_SOURCE_OF_TRUTH.md src worker public ios; do
            if [ ! -e "$required" ]; then
              echo "::error::Im Agent-Quellstand fehlt: ${required}"
              exit 1
            fi
          done
          if [ -f MID-professional-replacement.zip ]; then
            echo "::error::Agent-PRs dürfen künftig kein Release-ZIP mehr transportieren. Das Paket wird nach grünem Gate serverseitig erzeugt."
            exit 1
          fi

      - name: Node.js 22 mit npm-Cache einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Lockfile und npm-Registry prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 2
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 3000
          npm config set fetch-retry-maxtimeout 15000
          npm config set fetch-timeout 60000
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const invalid = [];
          for (const [name, entry] of Object.entries(lock.packages ?? {})) {
            const resolved = entry && typeof entry === 'object' ? entry.resolved : undefined;
            if (typeof resolved !== 'string') continue;
            if (/internal\.api\.openai\.org|applied-caas-gateway|localhost|127\.0\.0\.1/i.test(resolved)) invalid.push(`${name || '(root)'}: ${resolved}`);
          }
          if (invalid.length) {
            console.error('Nicht öffentlich erreichbare Paket-URLs im Lockfile:\n' + invalid.join('\n'));
            process.exit(1);
          }
          NODE

      - name: Abhängigkeiten reproduzierbar installieren
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps --loglevel=notice; then
              installed=true
              break
            fi
            echo "::warning::npm ci fehlgeschlagen (Versuch ${attempt}/3); temporärer Fehler wird automatisch erneut versucht."
            rm -rf node_modules
            npm cache verify || true
            sleep $((attempt * 3))
          done
          if [ "$installed" != true ]; then
            echo "::error::npm ci konnte nach drei Versuchen nicht erfolgreich abgeschlossen werden."
            exit 1
          fi

      - name: Produktionsabhängigkeiten prüfen
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          npm run audit:dependencies
          npm run audit:all

      - name: Python für echte RUC-GRIB-Regressionen einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/ruc/requirements-pages.txt

      - name: RUC-Download und komprimierte GRIB-Dateien offline prüfen
        shell: bash
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check -r tools/ruc/requirements-pages.txt
          python tools/ruc/test_fetch_resilience.py
          python tools/ruc/test_ruc_native_sidecar.py
          python -m unittest discover -s tools/ruc -p test_ruc_horizon_probe.py

      - name: Änderungen am nativen RUC-Kartenpfad erkennen
        id: ruc_native_changes
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^1 HEAD -- tools/ruc/)"
          if [ -n "$changed" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Drei native RUC-Läufe und Kartenaufnahme bis +27 h prüfen
        if: steps.ruc_native_changes.outputs.enabled == 'true'
        # Real three-run .308 probe reached the third complete source inventory
        # at 15min; retain all checks and allow bounded contour/codec completion.
        timeout-minutes: 20
        run: |
          python tools/ruc/ruc_horizon_probe.py --output ruc-horizon-evidence --runs 3 --candidate-count 6 --admission
          node scripts/verify-ruc-composites.mjs ruc-horizon-evidence

      - name: Numerische RUC-Prüfnachweise sichern
        if: always() && steps.ruc_native_changes.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mid-ruc-horizon-${{ github.run_id }}-${{ github.run_attempt }}
          path: ruc-horizon-evidence/
          if-no-files-found: error
          retention-days: 2

      - name: Produktionsbuild und Regressionen prüfen
        shell: bash
        timeout-minutes: 15
        env:
          VITE_METAR_PROXY_URL: ${{ vars.VITE_METAR_PROXY_URL }}
          VITE_ALERT_PROXY_URL: ${{ vars.VITE_ALERT_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_RADAR_PROXY_URL: ${{ vars.VITE_RADAR_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_WORKER_SAME_ORIGIN_PATH: ${{ vars.VITE_WORKER_SAME_ORIGIN_PATH }}
          VITE_WORKER_FALLBACK_URLS: ${{ vars.VITE_WORKER_FALLBACK_URLS }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          set -euo pipefail
          npm run build
          node --check worker/metar-proxy.js
          MID_REGRESSION_SHARD=core npm run test:regressions

      - name: Geprüften Web-Build in die iOS-Hülle übernehmen und prüfen
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          ./node_modules/.bin/cap copy ios
          node scripts/test-cross-platform-ios-shell-09670.mjs
          node scripts/test-runtime-lifecycle-offline-resume-09701.mjs
          package_version="$(node -p "require('./package.json').version")"
          ios_web_version="$(node -p "require('./ios/App/App/public/version.json').version")"
          if [ "$ios_web_version" != "$package_version" ]; then
            echo "::error::Capacitor-iOS-Web-Bundle ${ios_web_version} != Release ${package_version}."
            exit 1
          fi

      - name: Server-seitige Release-Paketierung vorprüfen
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import subprocess
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, is_zipfile

          out = Path('/tmp/MID-professional-replacement.zip')
          excluded_roots = {'.github', '.git', 'node_modules', 'dist'}
          excluded_files = {'MID-professional-replacement.zip'}
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with ZipFile(out, 'w', ZIP_DEFLATED, compresslevel=9) as zf:
              for raw in tracked:
                  if not raw:
                      continue
                  path = Path(raw)
                  if path.parts and path.parts[0] in excluded_roots:
                      continue
                  if path.name in excluded_files:
                      continue
                  if path.is_symlink():
                      raise SystemExit(f'Symlink im Release-Quellstand unzulässig: {path}')
                  if path.is_file():
                      zf.write(path, path.as_posix())
          if not is_zipfile(out):
              raise SystemExit('Serverseitige Release-Paketierung ergab kein gültiges ZIP')
          with ZipFile(out) as zf:
              names = set(zf.namelist())
              for required in ('package.json', 'package-lock.json', 'MID_BASELINE.json', 'MID_SOURCE_OF_TRUTH.md'):
                  if required not in names:
                      raise SystemExit(f'Release-Paketierung fehlt: {required}')
              for required_prefix in ('src/', 'worker/', 'public/', 'ios/'):
                  if not any(name.startswith(required_prefix) for name in names):
                      raise SystemExit(f'Release-Paketierung fehlt: {required_prefix}')
              corrupt = zf.testzip()
              if corrupt is not None:
                  raise SystemExit(f'Beschädigter ZIP-Eintrag: {corrupt}')
          print(f'Release-Paketierung vorgeprüft: {out.stat().st_size} Byte')
          PY
  heavy_regressions:
    name: Heavy-Regression · ${{ matrix.shard }} · ${{ matrix.map_group }}
    if: >-
      (startsWith(github.head_ref, 'chatgpt/') || startsWith(github.head_ref, 'codex/')) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: heavy-browser-state
            map_group: ''
          - shard: heavy-native-map
            map_group: ''
          - shard: heavy-mountain-visual
            map_group: ''
          - shard: heavy-unified-map
            map_group: '1/3'
          - shard: heavy-unified-map
            map_group: '2/3'
          - shard: heavy-unified-map
            map_group: '3/3'

    steps:
      - name: PR-Mergezustand laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Node.js 22 mit npm-Cache einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten reproduzierbar installieren
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          installed=false
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps --loglevel=notice; then
              installed=true
              break
            fi
            echo "::warning::npm ci für ${{ matrix.shard }} fehlgeschlagen (Versuch ${attempt}/3)."
            rm -rf node_modules
            npm cache verify || true
            sleep $((attempt * 3))
          done
          [ "$installed" = true ] || { echo "::error::npm ci konnte nicht erfolgreich abgeschlossen werden."; exit 1; }

      - name: SHA-identischen Produktionsbuild für Heavy-Regression erzeugen
        shell: bash
        timeout-minutes: 6
        env:
          VITE_METAR_PROXY_URL: ${{ vars.VITE_METAR_PROXY_URL }}
          VITE_ALERT_PROXY_URL: ${{ vars.VITE_ALERT_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_RADAR_PROXY_URL: ${{ vars.VITE_RADAR_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_WORKER_SAME_ORIGIN_PATH: ${{ vars.VITE_WORKER_SAME_ORIGIN_PATH }}
          VITE_WORKER_FALLBACK_URLS: ${{ vars.VITE_WORKER_FALLBACK_URLS }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: npm run build

      - name: Verpflichtende Browserlaufzeiten separat vorbereiten
        if: matrix.shard == 'heavy-browser-state'
        timeout-minutes: 10
        run: node scripts/prepare-browser-runtimes.mjs

      - name: Isolierten Heavy-Regression-Shard vollständig ausführen
        shell: bash
        timeout-minutes: 13
        env:
          MID_REGRESSION_SHARD: ${{ matrix.shard }}
          MID_MAP_QA_SHARD: ${{ matrix.map_group }}
          MID_REGRESSION_JOBS: '1'
          VITE_METAR_PROXY_URL: ${{ vars.VITE_METAR_PROXY_URL }}
          VITE_ALERT_PROXY_URL: ${{ vars.VITE_ALERT_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_RADAR_PROXY_URL: ${{ vars.VITE_RADAR_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_WORKER_SAME_ORIGIN_PATH: ${{ vars.VITE_WORKER_SAME_ORIGIN_PATH }}
          VITE_WORKER_FALLBACK_URLS: ${{ vars.VITE_WORKER_FALLBACK_URLS }}
        run: npm run test:regressions

  ruc27_qualification:
    name: RUC +27h Kern, EPS und Gesamtpaket
    # Read-only data qualification; this migration branch must also pass it
    # in the final Source gate before the existing release bot may proceed.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'chatgpt/v0.9.85.336-ruc27-qualification'
    runs-on: ubuntu-latest
    # 26 Oct verified: full native EPS build ~18 min, independent map/codec
    # exceeded 25 min; extend EXECUTION ONLY, retain every validation gate.
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - name: SHA-identischen PR-Mergezustand laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Bestehende native Testumgebung installieren
        run: python -m pip install -r tools/ruc/requirements-pages.txt
      - name: Integrität und vollständigen +27h-Kern einschließlich EPS prüfen
        shell: bash
        timeout-minutes: 38
        run: |
          set -euo pipefail
          mkdir -p ruc27-evidence
          printf '%s\n' "$GITHUB_SHA" > ruc27-evidence/tested-merge-sha.txt
          python -m unittest discover -s tools/ruc -p test_meteo_integrity.py
          python tools/ruc/fetch_and_build_ruc.py --hours 27 --candidate-count 4 --stage "$RUNNER_TEMP/ruc27-stage" --output "$RUNNER_TEMP/ruc27-output" 2>&1 | tee ruc27-evidence/build.log
          cp "$RUNNER_TEMP/ruc27-output/latest.json" ruc27-evidence/latest.json
          # Manifest is evidence only, never a published data pointer.
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'ruc27-output'
          meta=json.loads((root/'latest.json').read_text())
          assert len(meta['deterministic']['times']) == 28
          assert len(meta['eps']['times']) == 28
          assert len(meta['epsSummary']['times']) == 28
          assert meta['eps']['memberCount'] == 20
          print('Complete 28-term core/EPS snapshot built; codec, prefix, budget and fusion admission remain separate gates.')
          PY
      - name: Node für den bestehenden unabhängigen Codec-Nachweis einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
      - name: Vollständiges Kartenpaket, Rohrollback und Codec unabhängig prüfen
        shell: bash
        # Native model maps + full Python/JS/Worker replay need more than 25 min.
        # No altered 900 MB budget, source identity, checksum or acceptance rule.
        timeout-minutes: 40
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/ruc -p test_compare_core_prefix.py
          python -m unittest discover -s tools/ruc -p test_codec_staging.py
          python -m unittest discover -s tools/ruc -p test_legacy_core_rollback.py
          python tools/ruc/prepare_ruc_pages.py --codec-staging --source "$RUNNER_TEMP/ruc27-output" --output "$RUNNER_TEMP/ruc27-pages" 2>&1 | tee ruc27-evidence/pages-build.log
          python tools/ruc/prepare_legacy_core_rollback.py "$RUNNER_TEMP/ruc27-output" "$RUNNER_TEMP/ruc14-projected" "$RUNNER_TEMP/ruc14-rollback" > ruc27-evidence/rollback-proof.json
          python - <<'PYBUILD'
          import json, os, re, subprocess, sys
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']); source=root/'ruc27-output'
          meta=json.loads((source/'latest.json').read_text());run=meta['run']
          stage=root/'ruc27-stage'/re.sub(r'[^0-9A-Za-z_-]','',run)
          with open('ruc27-evidence/independent14-build.log','w') as log:
              subprocess.run([sys.executable,'tools/ruc/build_ruc_bundle.py','--staging',str(stage),'--output',str(root/'ruc14-independent'),'--run',run,'--hours','14'],stdout=log,stderr=subprocess.STDOUT,check=True)
          golden=json.loads((root/'ruc14-independent/latest.json').read_text())
          projected=json.loads((root/'ruc14-projected/latest.json').read_text())
          for key in ('run','grid','pointCount','sourceGribContract'):
              assert golden.get(key)==projected.get(key), key
          for name,info in golden['objects'].items():
              assert projected['objects'][name]==info, 'Independent14h mismatch: '+name
          Path('ruc27-evidence/legacy-equivalence.json').write_text(json.dumps({'run':run,'independentObjectsCompared':len(golden['objects']),'allRawObjectsByteIdentical':True,'published':False},indent=2))
          PYBUILD
          python tools/ruc/prepare_lossless_snapshot.py "$RUNNER_TEMP/ruc27-pages/ruc" "$RUNNER_TEMP/ruc27-codec" > ruc27-evidence/codec-build.json
          node tools/ruc/verify_lossless_migration.mjs "$RUNNER_TEMP/ruc27-pages/ruc" "$RUNNER_TEMP/ruc27-codec" > ruc27-evidence/codec-proof.json
          python tools/ruc/activate_lossless_snapshot.py "$RUNNER_TEMP/ruc27-pages/ruc" "$RUNNER_TEMP/ruc27-codec" ruc27-evidence/codec-proof.json "$RUNNER_TEMP/ruc27-active" > ruc27-evidence/activation-proof.json
          python - <<'PYMAP'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'tools/ruc')
          from admit_ruc_map_candidate import admit_optional
          root=Path(os.environ['RUNNER_TEMP'])
          report=admit_optional(root/'ruc27-active',root/'ruc27-output',root/'ruc27-map-candidate')
          assert report['admitted'] is True
          assert report['sourceRawUnchanged'] is True and report['codecProofUnchanged'] is True
          assert report['finalPhysicalBytes']<900000000
          Path('ruc27-evidence/maps-proof.json').write_text(json.dumps(report,indent=2))
          PYMAP
          python tools/ruc/build_ruc_synoptic_fields.py --snapshot "$RUNNER_TEMP/ruc27-active" --source "$RUNNER_TEMP/ruc27-output" --staging "$RUNNER_TEMP/ruc27-stage" --candidate "$RUNNER_TEMP/ruc27-synoptic" --report ruc27-evidence/synoptic-proof.json
      - name: Ausschließlich Diagnose und Manifest sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mid-ruc27-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: ruc27-evidence/
          if-no-files-found: error
          retention-days: 7

  visual_extreme:
    name: Extremwetterpolygone · echte Browserpixel
    # This branch-scoped draft preflight is not a release or a replacement for core/heavy.
    if: >-
      (startsWith(github.head_ref, 'chatgpt/') || startsWith(github.head_ref, 'codex/')) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.head_ref, 'extreme-polygons-fallback')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: SHA-identischen PR-Mergezustand laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node.js 22 mit npm-Cache einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhängigkeiten reproduzierbar installieren
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm ci --no-audit --no-fund --legacy-peer-deps --loglevel=notice
      - name: Synthetische Gefahrengeometrie in echtem WebGL und Canvas visuell prüfen
        shell: bash
        timeout-minutes: 16
        env:
          MID_EXTREME_QA_DIR: artifacts/extreme-browser-qa
        run: |
          set -euo pipefail
          node scripts/verify-extreme-outlook-pixels-browser-0985309.mjs
      - name: SHA-gebundene Browserbilder und Prüfnachweis sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mid-extreme-webgl-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/extreme-browser-qa/
          if-no-files-found: warn
          retention-days: 7

  validate_source:
    name: Agent-Quellstand vollständig prüfen
    needs:
      - source_core
      - heavy_regressions
      - visual_extreme
      - ruc27_qualification
    if: >-
      always() &&
      (startsWith(github.head_ref, 'chatgpt/') || startsWith(github.head_ref, 'codex/')) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Vollständige Shard-Gate-Ergebnisse fail-closed zusammenführen
        shell: bash
        env:
          CORE_RESULT: ${{ needs.source_core.result }}
          HEAVY_RESULT: ${{ needs.heavy_regressions.result }}
          VISUAL_RESULT: ${{ needs.visual_extreme.result }}
          RUC27_RESULT: ${{ needs.ruc27_qualification.result }}
          RUC27_REQUIRED: ${{ github.head_ref == 'chatgpt/v0.9.85.336-ruc27-qualification' }}
          EXTREME_BRANCH: ${{ contains(github.head_ref, 'extreme-polygons-fallback') }}
        run: |
          set -euo pipefail
          if [ "$CORE_RESULT" != success ] || [ "$HEAVY_RESULT" != success ]; then
            echo "::error::MID-Source-Gate unvollständig: core=${CORE_RESULT}, heavy=${HEAVY_RESULT}."
            exit 1
          fi
          if [ "$EXTREME_BRANCH" = true ] && [ "$VISUAL_RESULT" != success ]; then
            echo "::error::Echte Extremwetter-WebGL-Pixelabnahme nicht grün: visual=${VISUAL_RESULT}."
            exit 1
          fi
          if [ "$RUC27_REQUIRED" = true ] && [ "$RUC27_RESULT" != success ]; then
            echo "::error::Vollständiges RUC-27h-Datenpaket nicht abgenommen: ruc27=${RUC27_RESULT}."
            exit 1
          fi
          echo "MID-Source-Gate vollständig grün: Core und alle isolierten Heavy-Shards bestanden."
