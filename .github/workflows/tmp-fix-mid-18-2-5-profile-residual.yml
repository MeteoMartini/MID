name: MID 18.2.5 3h-Rest bereinigen
on:
  push:
    branches:
      - chatgpt/mid-18-2-5-ui-fixes-098585
permissions:
  contents: write
concurrency:
  group: mid-18-2-5-profile-residual
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/mid-18-2-5-ui-fixes-098585
          fetch-depth: 0
      - name: Verwaiste 3-h-Aggregation entfernen
        run: node scripts/fix-mid-18-2-5-profile-residual-098585.mjs
      - name: Änderung committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ForecastCockpit.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "MID v0.9.85.85: remove residual 3h profile helper"
          git push origin HEAD:chatgpt/mid-18-2-5-ui-fixes-098585
