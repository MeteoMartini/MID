name: MID Stable Pages byte comparison (read-only)
on:
  push:
    branches: [chatgpt/v0.9.85.516-pages-provenance-diagnostics]
    paths: ['.github/workflows/mid-pages-byte-comparison.yml']
permissions:
  contents: read
  actions: read
  deployments: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authenticate the original Pages archive and compare live response bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = MeteoMartini/MID
          cd "$RUNNER_TEMP"
          repo=repos/MeteoMartini/MID
          stable=331fffff081303e1c597badddfa4ae41c4b4e0f0
          main=ab96ac712fd4f3ba9be5af2cb546febf9ee13329
          digest=7cf9265850a9921c4300ec94b92c6dc350e498de9860fc5e5544799ab0b3692f
          refs() {
            test "$(gh api "$repo/git/ref/heads/mid-stable" --jq .object.sha)" = "$stable"
            test "$(gh api "$repo/git/ref/heads/main" --jq .object.sha)" = "$main"
          }
          refs
          gh api "$repo/deployments/8001180786" | jq -e --arg sha "$stable"             '.id == 8001180786 and .sha == $sha and .environment == "github-pages"' >/dev/null
          gh api "$repo/actions/jobs/137753957608" | jq -e --arg sha "$stable"             '.run_id == 45184577063 and .head_sha == $sha and .conclusion == "success" and
              ([.steps[] | select(.name == "MID + RUC kostenfrei auf GitHub Pages veröffentlichen" and .conclusion == "success")] | length == 1)' >/dev/null
          gh api "$repo/actions/artifacts/14826697649" | jq -e --arg digest "sha256:$digest"             '.workflow_run.id == 45184577063 and .expired == false and .digest == $digest' >/dev/null
          gh api "$repo/actions/artifacts/14826697649/zip" > mid-pages-original.zip
          printf '%s  %s\n' "$digest" mid-pages-original.zip | sha256sum --check
          python3 -B - <<'PY'
          import hashlib, json, secrets, tarfile, urllib.error, urllib.request, zipfile
          required = {'mid-build-identity.json', 'version.json', 'index.html', 'ruc/latest.json'}
          optional = {'ruc/fast/paged-shadow.json', 'ruc/fast/publisher-proof.v2.json'}
          wanted = required | optional
          originals = {}
          bound = 8_000_000
          with zipfile.ZipFile('mid-pages-original.zip') as z:
              assert z.namelist() == ['artifact.tar'], 'unexpected Pages archive layout'
              with z.open('artifact.tar') as stream, tarfile.open(fileobj=stream, mode='r|*') as tar:
                  for member in tar:
                      path = member.name.removeprefix('./')
                      if path in wanted:
                          assert member.isfile() and member.size <= bound and path not in originals, path
                          originals[path] = tar.extractfile(member).read()
          assert required <= originals.keys(), 'missing required archive members'
          results = {}
          for path in sorted(wanted):
              url = 'https://www.midwx.app/' + path + '?mid_recovery=' + secrets.token_hex(8)
              req = urllib.request.Request(url, headers={'Cache-Control':'no-cache','Accept-Encoding':'identity'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      assert response.geturl() == url, path
                      body = response.read(bound + 1)
                      assert len(body) <= bound, path
              except urllib.error.HTTPError as e:
                  if e.code != 404: raise
                  body = None
              expected = originals.get(path)
              results[path] = {
                  'match': expected == body,
                  'archive_sha256': hashlib.sha256(expected).hexdigest() if expected is not None else None,
                  'live_sha256': hashlib.sha256(body).hexdigest() if body is not None else None,
              }
          print(json.dumps(results, sort_keys=True))
          assert all(row['match'] for row in results.values()), 'public Pages bytes differ'
          PY
          refs
