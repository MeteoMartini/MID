name: MID Agent Ref Broker
run-name: Geschützten Agent-Ref sicher schreiben

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: read

concurrency:
  group: mid-agent-ref-broker
  cancel-in-progress: false

jobs:
  broker_agent_ref:
    name: Agent-Ref validieren und schreiben
    if: >-
      github.event.issue.number == 176 &&
      github.event.comment.user.login == 'MeteoMartini' &&
      startsWith(github.event.comment.body, '/mid-agent-ref ')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Broker-Auftrag strikt parsen
        id: request
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          read -r command branch target_sha base_sha extra <<< "$COMMENT_BODY"
          if [ "$command" != "/mid-agent-ref" ] || [ -n "${extra:-}" ]; then
            echo "::error::Ungültiges Broker-Format."
            exit 1
          fi
          if ! [[ "$branch" =~ ^(chatgpt|codex)/[A-Za-z0-9][A-Za-z0-9._/-]{0,120}$ ]]; then
            echo "::error::Nur eng formatierte chatgpt/*- oder codex/*-Branches sind zulässig."
            exit 1
          fi
          if [[ "$branch" == *".."* || "$branch" == *"//"* || "$branch" == */ ]]; then
            echo "::error::Unsicherer Branchname abgelehnt."
            exit 1
          fi
          if ! [[ "$target_sha" =~ ^[0-9a-f]{40}$ && "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Target- und Basis-SHA müssen vollständige SHA-1-Werte sein."
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: MID Release Bot Token erzeugen
        id: release_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.MID_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MID_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Basis, Commit-Linie und Fast-Forward prüfen
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          BRANCH: ${{ steps.request.outputs.branch }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          BASE_SHA: ${{ steps.request.outputs.base_sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          stable_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/mid-stable" --jq '.object.sha')"
          if [ "$main_sha" != "$stable_sha" ] || [ "$BASE_SHA" != "$stable_sha" ]; then
            echo "::error::Broker arbeitet nur auf eindeutig synchroner main/mid-stable-Basis."
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/git/commits/${TARGET_SHA}" >/dev/null
          encoded_branch="${BRANCH//\//%2F}"
          base_compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${TARGET_SHA}")"
          base_status="$(jq -r '.status' <<< "$base_compare")"
          case "$base_status" in
            ahead|identical) ;;
            *)
              echo "::error::Target-Commit stammt nicht linear von der aktuellen Stable-Basis ab."
              exit 1
              ;;
          esac

          if current_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded_branch}" 2>/dev/null)"; then
            current_sha="$(jq -r '.object.sha' <<< "$current_json")"
            ff_compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current_sha}...${TARGET_SHA}")"
            ff_status="$(jq -r '.status' <<< "$ff_compare")"
            case "$ff_status" in
              ahead|identical) ;;
              *)
                echo "::error::Agent-Ref darf ausschließlich fast-forward aktualisiert werden."
                exit 1
                ;;
            esac
            echo "mode=update" >> "$GITHUB_OUTPUT"
            echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"
          else
            if [ "$base_status" != "ahead" ]; then
              echo "::error::Ein neuer Agent-Branch muss mindestens einen Commit vor Stable liegen."
              exit 1
            fi
            echo "mode=create" >> "$GITHUB_OUTPUT"
          fi

      - name: Geschützten Agent-Ref schreiben
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          BRANCH: ${{ steps.request.outputs.branch }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          MODE: ${{ steps.validate.outputs.mode }}
        run: |
          set -euo pipefail
          encoded_branch="${BRANCH//\//%2F}"
          if [ "$MODE" = "create" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="$TARGET_SHA" >/dev/null
          else
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_branch}" -f sha="$TARGET_SHA" -F force=false >/dev/null
          fi
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded_branch}" --jq '.object.sha')"
          if [ "$remote_sha" != "$TARGET_SHA" ]; then
            echo "::error::Remote-Ref stimmt nach Broker-Schreibvorgang nicht mit dem angeforderten SHA überein."
            exit 1
          fi
          {
            echo "### MID Agent Ref Broker"
            echo
            echo "- Branch: \`${BRANCH}\`"
            echo "- Head: \`${TARGET_SHA}\`"
            echo "- Modus: \`${MODE}\`"
            echo "- Basis: aktuelle, identische \`main\`/\`mid-stable\`"
            echo "- Keine Änderung an main oder mid-stable"
            echo "- Keine PR-, Release- oder Deployment-Aktion"
          } >> "$GITHUB_STEP_SUMMARY"
