name: MID KNMI GRIB inspect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mid-knmi-grib-inspect
  cancel-in-progress: true

jobs:
  inspect-knmi-grib:
    name: Inspect one KNMI HARMONIE EPS GRIB safely
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KNMI_DATASET: harmonie_arome_cy43_p4a
      KNMI_DATASET_VERSION: "1.0"
      KNMI_API_KEY: ${{ secrets.KNMI_OPEN_DATA_API_KEY }}

      # Safety limits:
      MAX_TAR_ENTRIES: "240"
      MAX_MEMBER_BYTES: "33554432"   # 32 MiB hard cap
      RANGE_CHUNK_BYTES: "1048576"   # 1 MiB chunks

    steps:
      - name: Install ecCodes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libeccodes-tools
          grib_ls -V

      - name: Locate and download exactly one TAR member by HTTP Range
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KNMI_API_KEY:-}" ]; then
            echo "::error::KNMI_OPEN_DATA_API_KEY fehlt oder ist leer."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request
          from pathlib import Path

          api_key = os.environ["KNMI_API_KEY"]
          dataset = os.environ["KNMI_DATASET"]
          version = os.environ["KNMI_DATASET_VERSION"]
          max_entries = int(os.environ["MAX_TAR_ENTRIES"])
          max_member_bytes = int(os.environ["MAX_MEMBER_BYTES"])
          chunk_bytes = int(os.environ["RANGE_CHUNK_BYTES"])

          base = "https://api.dataplatform.knmi.nl/open-data/v1"
          out_path = Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "knmi-sample.grib"

          transferred_header_bytes = 0
          transferred_payload_bytes = 0
          archive_size = None

          def api_json(url):
              request = urllib.request.Request(
                  url,
                  headers={"Authorization": api_key},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          # 1) Latest P4a archive.
          query = urllib.parse.urlencode({
              "maxKeys": 1,
              "orderBy": "created",
              "sorting": "desc",
          })
          list_url = f"{base}/datasets/{dataset}/versions/{version}/files?{query}"

          try:
              payload = api_json(list_url)
          except Exception as exc:
              print(f"::error::KNMI-Dateiliste fehlgeschlagen: {exc}")
              sys.exit(1)

          files = payload.get("files") or []
          if not files:
              print("::error::Keine KNMI-P4a-Datei gefunden.")
              sys.exit(1)

          latest = files[0]
          archive_name = latest.get("filename")
          if not archive_name:
              print("::error::Neueste KNMI-Datei besitzt keinen Dateinamen.")
              sys.exit(1)

          encoded = urllib.parse.quote(archive_name, safe="")
          url_endpoint = (
              f"{base}/datasets/{dataset}/versions/{version}/files/"
              f"{encoded}/url"
          )

          try:
              url_payload = api_json(url_endpoint)
          except Exception as exc:
              print(f"::error::Temporäre Download-URL fehlgeschlagen: {exc}")
              sys.exit(1)

          download_url = url_payload.get("temporaryDownloadUrl")
          if not isinstance(download_url, str) or not download_url.startswith("https://"):
              print("::error::Keine gültige temporäre Download-URL erhalten.")
              sys.exit(1)

          print("KNMI access: OK")
          print(f"Dataset: {dataset}/{version}")
          print(f"Archive: {archive_name}")
          if latest.get("size") is not None:
              print(f"KNMI metadata size: {latest['size']} bytes")
          if latest.get("created"):
              print(f"Created: {latest['created']}")

          def ranged_get(start, length, purpose):
              nonlocal_vars = None
              end = start + length - 1
              request = urllib.request.Request(
                  download_url,
                  headers={
                      "Range": f"bytes={start}-{end}",
                      "Accept-Encoding": "identity",
                      "User-Agent": "MID-KNMI-GRIB-inspect/1.0",
                  },
              )

              try:
                  response = urllib.request.urlopen(request, timeout=45)
              except Exception as exc:
                  print(f"::error::HTTP-Range {start}-{end} fehlgeschlagen: {exc}")
                  sys.exit(1)

              try:
                  status = getattr(response, "status", None)
                  content_range = response.headers.get("Content-Range", "")
                  if status != 206:
                      print(
                          "::error::Server beantwortete einen Range-Request nicht "
                          f"mit HTTP 206 (Status {status}). Abbruch aus Sicherheitsgründen."
                      )
                      sys.exit(1)

                  match = re.match(r"bytes\s+(\d+)-(\d+)/(\d+|\*)", content_range)
                  if not match:
                      print(f"::error::Ungültiger Content-Range: {content_range!r}")
                      sys.exit(1)

                  expected_start = int(match.group(1))
                  expected_end = int(match.group(2))
                  if expected_start != start or expected_end != end:
                      print(
                          "::error::Server lieferte einen anderen Bytebereich als angefordert: "
                          f"{content_range}"
                      )
                      sys.exit(1)

                  global archive_size
                  if match.group(3) != "*":
                      archive_size = int(match.group(3))

                  data = response.read(length + 1)
                  if len(data) != length:
                      print(
                          f"::error::{purpose}: {len(data)} statt {length} Byte erhalten."
                      )
                      sys.exit(1)

                  return data
              finally:
                  response.close()

          def parse_octal(raw):
              text = raw.rstrip(b"\0 ").lstrip(b" ")
              if not text:
                  return 0
              try:
                  return int(text, 8)
              except ValueError:
                  return None

          def decode_text(raw):
              return raw.split(b"\0", 1)[0].decode("utf-8", "replace").strip()

          # 2) Walk TAR headers only until the first regular HARMONIE meteo member.
          offset = 0
          selected = None

          for index in range(max_entries):
              header = ranged_get(offset, 512, "TAR header")
              transferred_header_bytes += 512

              if header == b"\0" * 512:
                  break

              name = decode_text(header[0:100])
              prefix = decode_text(header[345:500])
              if prefix:
                  name = f"{prefix}/{name}"

              size = parse_octal(header[124:136])
              typeflag = header[156:157].decode("ascii", "replace") or "0"

              if size is None:
                  print(
                      f"::error::TAR-Dateigröße in Header #{index + 1} "
                      f"bei Offset {offset} nicht lesbar."
                  )
                  sys.exit(1)

              # Select only actual regular HARMONIE meteorological files.
              if (
                  typeflag in ("0", "\x00")
                  and "harm43_v1_eur_uwcw_meteo_" in name
                  and name.endswith("_GB")
              ):
                  selected = {
                      "name": name,
                      "size": size,
                      "header_offset": offset,
                      "payload_offset": offset + 512,
                  }
                  break

              padded = ((size + 511) // 512) * 512
              offset += 512 + padded

          if not selected:
              print(
                  f"::error::In den ersten {max_entries} TAR-Einträgen wurde "
                  "keine reguläre HARMONIE-Meteo-Datei gefunden."
              )
              sys.exit(1)

          member_size = selected["size"]
          payload_offset = selected["payload_offset"]

          print("")
          print("Selected TAR member:")
          print(f"Name: {selected['name']}")
          print(f"Size: {member_size} bytes")
          print(f"Header offset: {selected['header_offset']}")
          print(f"Payload offset: {payload_offset}")

          if member_size <= 0:
              print("::error::Ausgewähltes TAR-Mitglied ist leer.")
              sys.exit(1)

          if member_size > max_member_bytes:
              print(
                  "::error::Ausgewähltes TAR-Mitglied überschreitet das Sicherheitslimit: "
                  f"{member_size} > {max_member_bytes} Byte."
              )
              sys.exit(1)

          # 3) Download exactly this TAR member payload, never the complete archive.
          with out_path.open("wb") as fh:
              pos = 0
              while pos < member_size:
                  length = min(chunk_bytes, member_size - pos)
                  data = ranged_get(
                      payload_offset + pos,
                      length,
                      "GRIB member payload",
                  )
                  fh.write(data)
                  transferred_payload_bytes += len(data)
                  pos += len(data)

          actual_size = out_path.stat().st_size
          if actual_size != member_size:
              print(
                  f"::error::Lokale GRIB-Datei hat {actual_size} statt "
                  f"{member_size} Byte."
              )
              sys.exit(1)

          # Minimal format signature check before ecCodes.
          with out_path.open("rb") as fh:
              signature = fh.read(4)

          if signature != b"GRIB":
              print(
                  "::error::Ausgewähltes TAR-Mitglied beginnt nicht mit GRIB-Signatur "
                  f"(gefunden: {signature!r})."
              )
              sys.exit(1)

          print("")
          print("Range download: OK")
          if archive_size is not None:
              print(f"Archive size from Content-Range: {archive_size} bytes")
          print(f"TAR header bytes transferred: {transferred_header_bytes} bytes")
          print(f"GRIB payload bytes transferred: {transferred_payload_bytes} bytes")
          print(f"Local sample: {out_path}")
          print("GRIB signature: OK")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as env:
                  env.write(f"KNMI_SAMPLE_GRIB={out_path}\n")
                  env.write(f"KNMI_SAMPLE_MEMBER={selected['name']}\n")
                  env.write(f"KNMI_SAMPLE_BYTES={member_size}\n")
          PY

      - name: Inspect GRIB with ecCodes
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "${KNMI_SAMPLE_GRIB:-}" ]; then
            echo "::error::KNMI sample GRIB fehlt."
            exit 1
          fi

          echo "============================================================"
          echo "KNMI HARMONIE EPS sample"
          echo "Member: ${KNMI_SAMPLE_MEMBER}"
          echo "Bytes:  ${KNMI_SAMPLE_BYTES}"
          echo "============================================================"

          echo
          echo "### GRIB message count"
          grib_count "$KNMI_SAMPLE_GRIB"

          echo
          echo "### Core metadata / parameters"
          grib_ls \
            -p edition,centre,subCentre,dataDate,dataTime,stepRange,shortName,typeOfLevel,level,gridType,Ni,Nj \
            "$KNMI_SAMPLE_GRIB" \
            > "${RUNNER_TEMP}/grib-core.txt"

          cat "${RUNNER_TEMP}/grib-core.txt"

          echo
          echo "### Ensemble metadata"
          # Missing keys are acceptable during this exploratory inspection.
          set +e
          grib_ls \
            -p perturbationNumber,numberOfForecastsInEnsemble,typeOfEnsembleForecast \
            "$KNMI_SAMPLE_GRIB" \
            > "${RUNNER_TEMP}/grib-ensemble.txt" 2>&1
          ENSEMBLE_RC=$?
          set -e
          cat "${RUNNER_TEMP}/grib-ensemble.txt"
          echo "Ensemble metadata command exit code: ${ENSEMBLE_RC}"

          echo
          echo "### Unique shortName values"
          grib_get -p shortName "$KNMI_SAMPLE_GRIB" \
            | sort -u \
            | sed -n '1,200p'

          echo
          echo "### Unique level/type combinations"
          grib_get -p shortName,typeOfLevel,level "$KNMI_SAMPLE_GRIB" \
            | sort -u \
            | sed -n '1,240p'

          echo
          echo "### Grid sample"
          set +e
          grib_get \
            -p gridType,Ni,Nj,latitudeOfFirstGridPointInDegrees,longitudeOfFirstGridPointInDegrees,latitudeOfLastGridPointInDegrees,longitudeOfLastGridPointInDegrees \
            "$KNMI_SAMPLE_GRIB" \
            | head -n 8
          GRID_RC=$?
          set -e
          echo "Grid metadata command exit code: ${GRID_RC}"

          echo
          echo "### Safety summary"
          echo "Only one TAR member was downloaded."
          echo "The complete KNMI TAR archive was NOT downloaded."
          echo "Hard member-size cap: ${MAX_MEMBER_BYTES} bytes."
