name: MID KNMI EPS rolling offset smoke

on:
  workflow_dispatch:
    inputs:
      latitude:
        description: "Latitude des Testpunkts"
        required: true
        default: "52.10"
        type: string
      longitude:
        description: "Longitude des Testpunkts"
        required: true
        default: "5.18"
        type: string

permissions:
  contents: read

concurrency:
  group: mid-knmi-eps-rolling-offset-smoke
  cancel-in-progress: true

jobs:
  rolling-offset-smoke:
    name: Validate KNMI six-batch rolling values and precipitation offset
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KNMI_DATASET: harmonie_arome_cy43_p4a
      KNMI_DATASET_VERSION: "1.0"
      KNMI_API_KEY: ${{ secrets.KNMI_OPEN_DATA_API_KEY }}
      TARGET_LAT: ${{ inputs.latitude }}
      TARGET_LON: ${{ inputs.longitude }}
      MAX_TAR_ENTRIES: "96"
      MAX_GRIB_MESSAGES: "64"

    steps:
      - name: Validate rolling six-batch value alignment
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KNMI_API_KEY:-}" ]; then
            echo "::error::KNMI_OPEN_DATA_API_KEY fehlt oder ist leer."
            exit 1
          fi

          python3 - <<'PY'
          import datetime as dt
          import json
          import math
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request

          lat = float(os.environ["TARGET_LAT"])
          lon = float(os.environ["TARGET_LON"])
          if not (
              math.isfinite(lat) and math.isfinite(lon)
              and -90 <= lat <= 90 and -180 <= lon <= 180
          ):
              print("::error::Ungültiger Testpunkt.")
              sys.exit(1)

          api_key = os.environ["KNMI_API_KEY"]
          dataset = os.environ["KNMI_DATASET"]
          version = os.environ["KNMI_DATASET_VERSION"]
          max_tar_entries = int(os.environ["MAX_TAR_ENTRIES"])
          max_grib_messages = int(os.environ["MAX_GRIB_MESSAGES"])

          base = "https://api.dataplatform.knmi.nl/open-data/v1"
          archive_re = re.compile(r"^harm43_v1_P4a_(\d{10})\.tar$")

          request_count = 0
          transferred_bytes = 0

          # Core fields for the rolling ensemble:
          # name, parameter, level type, level, TRI
          CORE = [
              ("temperature_2m_k", 11, 105, 2, 0),
              ("wind_u_10m_ms", 33, 105, 10, 0),
              ("wind_v_10m_ms", 34, 105, 10, 0),
              ("gust_u_10m_ms", 162, 105, 10, 2),
              ("gust_v_10m_ms", 163, 105, 10, 2),
              ("rain_kgm2", 181, 105, 0, 4),
          ]

          def api_json(url):
              global request_count
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": api_key,
                      "User-Agent": "MID-KNMI-EPS-rolling-offset-smoke/1.0",
                  },
              )
              request_count += 1
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          listing_url = (
              f"{base}/datasets/{dataset}/versions/{version}/files?"
              + urllib.parse.urlencode({
                  "maxKeys": 12,
                  "orderBy": "created",
                  "sorting": "desc",
              })
          )
          listing = api_json(listing_url)

          archives = []
          seen = set()
          for item in listing.get("files") or []:
              filename = item.get("filename") or ""
              match = archive_re.match(filename)
              if not match:
                  continue
              stamp = match.group(1)
              if stamp in seen:
                  continue
              seen.add(stamp)
              run = dt.datetime.strptime(
                  stamp, "%Y%m%d%H"
              ).replace(tzinfo=dt.timezone.utc)
              archives.append({
                  "filename": filename,
                  "run": run,
                  "created": item.get("created"),
              })
              if len(archives) == 6:
                  break

          if len(archives) != 6:
              print(f"::error::Nur {len(archives)} geeignete Stundenarchive gefunden.")
              sys.exit(1)

          # newest -> oldest from API; switch to chronological order.
          archives.reverse()

          for older, newer in zip(archives, archives[1:]):
              if newer["run"] - older["run"] != dt.timedelta(hours=1):
                  print(
                      "::error::P4a-Stundenarchive sind nicht lückenlos: "
                      f"{older['run']} -> {newer['run']}"
                  )
                  sys.exit(1)

          newest_run = archives[-1]["run"]
          common_baseline = newest_run
          # One common hour is sufficient to qualify the cross-run accumulation
          # offset while keeping TAR-header requests safely bounded. Across the
          # six hourly batches this exercises baseline/target leads 0->1 ... 5->6.
          target_valid = newest_run + dt.timedelta(hours=1)

          all_members = set()

          for archive in archives:
              batch = (archive["run"].hour % 6) + 1
              start_member = (batch - 1) * 5 + 1
              end_member = batch * 5
              members = list(range(start_member, end_member + 1))
              archive["batch"] = batch
              archive["members"] = members
              archive["representative_member"] = end_member
              archive["baseline_lead"] = int(
                  (common_baseline - archive["run"]).total_seconds() / 3600
              )
              archive["target_lead"] = int(
                  (target_valid - archive["run"]).total_seconds() / 3600
              )
              all_members.update(members)

          if all_members != set(range(1, 31)):
              print("::error::Batchfolge deckt Member 1..30 nicht vollständig ab.")
              sys.exit(1)

          def get_temp_url(archive_name):
              encoded = urllib.parse.quote(archive_name, safe="")
              payload = api_json(
                  f"{base}/datasets/{dataset}/versions/{version}/files/"
                  f"{encoded}/url"
              )
              url = payload.get("temporaryDownloadUrl")
              if not isinstance(url, str) or not url.startswith("https://"):
                  print(f"::error::Keine Download-URL für {archive_name}.")
                  sys.exit(1)
              return url

          def range_get(url, start, length, purpose):
              global request_count, transferred_bytes
              end = start + length - 1
              req = urllib.request.Request(
                  url,
                  headers={
                      "Range": f"bytes={start}-{end}",
                      "Accept-Encoding": "identity",
                      "User-Agent": "MID-KNMI-EPS-rolling-offset-smoke/1.0",
                  },
              )
              request_count += 1
              try:
                  r = urllib.request.urlopen(req, timeout=30)
              except Exception as exc:
                  print(
                      f"::error::{purpose}: Range {start}-{end} fehlgeschlagen: {exc}"
                  )
                  sys.exit(1)
              try:
                  if getattr(r, "status", None) != 206:
                      print(
                          f"::error::{purpose}: HTTP {getattr(r,'status',None)} statt 206."
                      )
                      sys.exit(1)
                  cr = r.headers.get("Content-Range", "")
                  match = re.match(r"bytes\s+(\d+)-(\d+)/(\d+|\*)", cr)
                  if (
                      not match
                      or int(match.group(1)) != start
                      or int(match.group(2)) != end
                  ):
                      print(f"::error::{purpose}: falscher Content-Range {cr!r}.")
                      sys.exit(1)
                  data = r.read(length + 1)
                  if len(data) != length:
                      print(
                          f"::error::{purpose}: {len(data)} statt {length} Byte."
                      )
                      sys.exit(1)
                  transferred_bytes += len(data)
                  return data
              finally:
                  r.close()

          def tar_octal(raw):
              text = raw.rstrip(b"\0 ").lstrip(b" ")
              if not text:
                  return 0
              try:
                  return int(text, 8)
              except ValueError:
                  return None

          def tar_text(raw):
              return raw.split(b"\0", 1)[0].decode(
                  "utf-8", "replace"
              ).strip()

          def signed_mag(raw):
              value = int.from_bytes(raw, "big")
              mask = 1 << (len(raw) * 8 - 1)
              mag = value & (mask - 1)
              return -mag if value & mask else mag

          def ibm32(raw):
              word = int.from_bytes(raw, "big")
              if word == 0:
                  return 0.0
              sign = -1.0 if word & 0x80000000 else 1.0
              exponent = (word >> 24) & 0x7F
              fraction = word & 0x00FFFFFF
              return sign * (fraction / (1 << 24)) * (
                  16.0 ** (exponent - 64)
              )

          def norm_lon(value):
              return ((value + 180.0) % 360.0) - 180.0

          def expected_name(member, run, lead):
              return (
                  f"harm43_v1_eur_uwcw_meteo_{member:03d}_"
                  f"{run.strftime('%Y%m%d%H%M')}_{lead:03d}00_GB"
              )

          def locate_required_members(url, wanted_names):
              found = {}
              offset = 0

              for _ in range(max_tar_entries):
                  h = range_get(url, offset, 512, "TAR header")
                  if h == b"\0" * 512:
                      break

                  name = tar_text(h[0:100])
                  prefix = tar_text(h[345:500])
                  if prefix:
                      name = f"{prefix}/{name}"

                  size = tar_octal(h[124:136])
                  if size is None:
                      print("::error::TAR-Größe nicht lesbar.")
                      sys.exit(1)

                  typeflag = h[156:157].decode(
                      "ascii", "replace"
                  ) or "0"

                  bare_name = name.rsplit("/", 1)[-1]
                  if (
                      typeflag in ("0", "\x00")
                      and bare_name in wanted_names
                  ):
                      found[bare_name] = {
                          "name": bare_name,
                          "size": size,
                          "payload": offset + 512,
                      }
                      if len(found) == len(wanted_names):
                          return found

                  offset += 512 + ((size + 511) // 512) * 512

              missing = sorted(set(wanted_names) - set(found))
              print(
                  "::error::Benötigte TAR-Mitglieder nicht gefunden: "
                  + ", ".join(missing)
              )
              sys.exit(1)

          def index_grib(url, inner):
              messages = {}
              rel = 0

              for number in range(1, max_grib_messages + 1):
                  if rel == inner["size"]:
                      break
                  if rel + 64 > inner["size"]:
                      print("::error::Unvollständiges GRIB-Ende.")
                      sys.exit(1)

                  h = range_get(
                      url,
                      inner["payload"] + rel,
                      64,
                      f"GRIB header {inner['name']} #{number}",
                  )
                  if h[:4] != b"GRIB" or h[7] != 1:
                      print(
                          f"::error::{inner['name']}: ungültige GRIB1-Nachricht."
                      )
                      sys.exit(1)

                  length = int.from_bytes(h[4:7], "big")
                  if length < 64 or rel + length > inner["size"]:
                      print(
                          f"::error::{inner['name']}: unplausible GRIB-Länge."
                      )
                      sys.exit(1)

                  pds_length = int.from_bytes(h[8:11], "big")
                  key = (
                      h[16],
                      h[17],
                      int.from_bytes(h[18:20], "big"),
                      h[28],
                  )

                  gds_length = None
                  if h[15] & 0x80:
                      gds_pos = 8 + pds_length
                      if gds_pos + 3 > len(h):
                          print(
                              "::error::GDS-Länge liegt außerhalb des Sparse-Headers."
                          )
                          sys.exit(1)
                      gds_length = int.from_bytes(
                          h[gds_pos:gds_pos + 3], "big"
                      )

                  messages[key] = {
                      "number": number,
                      "archive_offset": inner["payload"] + rel,
                      "length": length,
                      "pds_length": pds_length,
                      "flags": h[15],
                      "decimal_scale": signed_mag(h[34:36]),
                      "gds_length": gds_length,
                  }
                  rel += length

              if rel != inner["size"]:
                  print(
                      f"::error::{inner['name']}: Sparse-Index deckt Datei nicht exakt ab."
                  )
                  sys.exit(1)

              return messages

          grid = None

          def derive_grid_from_message(url, message):
              nonlocal_dummy = None
              if not (message["flags"] & 0x80):
                  print("::error::Referenzfeld besitzt keine GDS.")
                  sys.exit(1)

              gds_start = (
                  message["archive_offset"] + 8 + message["pds_length"]
              )
              gds_length = message["gds_length"]
              if not gds_length or not (42 <= gds_length <= 4096):
                  print("::error::GDS-Länge unplausibel.")
                  sys.exit(1)

              gds = range_get(url, gds_start, gds_length, "reference GDS")
              if gds[5] != 10:
                  print("::error::Kein GRIB1 rotated lat/lon Grid 10.")
                  sys.exit(1)

              ni = int.from_bytes(gds[6:8], "big")
              nj = int.from_bytes(gds[8:10], "big")
              lat1 = signed_mag(gds[10:13]) / 1000.0
              lon1 = signed_mag(gds[13:16]) / 1000.0
              di = int.from_bytes(gds[23:25], "big") / 1000.0
              dj = int.from_bytes(gds[25:27], "big") / 1000.0
              scan = gds[27]
              south_lat = signed_mag(gds[32:35]) / 1000.0
              south_lon = signed_mag(gds[35:38]) / 1000.0
              rotation = ibm32(gds[38:42])

              if abs(rotation) > 1e-7 or scan & 0x1F:
                  print("::error::Unerwartete HARMONIE-Gittergeometrie.")
                  sys.exit(1)

              i_neg = bool(scan & 0x80)
              j_pos = bool(scan & 0x40)
              j_consecutive = bool(scan & 0x20)

              pole_lat = -south_lat
              pole_lon = norm_lon(south_lon + 180.0)

              glat = math.radians(lat)
              dlon = math.radians(norm_lon(lon - pole_lon))
              plat = math.radians(pole_lat)

              sin_rlat = (
                  math.sin(glat) * math.sin(plat)
                  + math.cos(glat) * math.cos(plat) * math.cos(dlon)
              )
              rlat = math.degrees(
                  math.asin(max(-1.0, min(1.0, sin_rlat)))
              )
              rlon = norm_lon(math.degrees(math.atan2(
                  -math.cos(glat) * math.sin(dlon),
                  -math.cos(glat) * math.sin(plat) * math.cos(dlon)
                  + math.sin(glat) * math.cos(plat),
              )))

              delta_i = (
                  norm_lon(lon1 - rlon)
                  if i_neg else norm_lon(rlon - lon1)
              )
              delta_j = (
                  rlat - lat1 if j_pos else lat1 - rlat
              )
              i = int(math.floor(delta_i / di + 0.5))
              j = int(math.floor(delta_j / dj + 0.5))

              if not (0 <= i < ni and 0 <= j < nj):
                  print("::error::Testpunkt außerhalb des P4a-Gitters.")
                  sys.exit(1)

              index = i * nj + j if j_consecutive else j * ni + i

              def rotated_to_geo(r_lat_deg, r_lon_deg):
                  rr_lat = math.radians(r_lat_deg)
                  rr_lon = math.radians(r_lon_deg)
                  pp_lat = math.radians(pole_lat)
                  pp_lon = math.radians(pole_lon)
                  s = (
                      math.sin(pp_lat) * math.sin(rr_lat)
                      + math.cos(pp_lat) * math.cos(rr_lat) * math.cos(rr_lon)
                  )
                  g_lat = math.asin(max(-1.0, min(1.0, s)))
                  g_lon = pp_lon - math.atan2(
                      math.cos(rr_lat) * math.sin(rr_lon),
                      math.cos(pp_lat) * math.sin(rr_lat)
                      - math.sin(pp_lat) * math.cos(rr_lat) * math.cos(rr_lon),
                  )
                  return math.degrees(g_lat), norm_lon(math.degrees(g_lon))

              def bearing(a, b):
                  a_lat, a_lon = map(math.radians, a)
                  b_lat, b_lon = map(math.radians, b)
                  dl = b_lon - a_lon
                  y = math.sin(dl) * math.cos(b_lat)
                  x = (
                      math.cos(a_lat) * math.sin(b_lat)
                      - math.sin(a_lat) * math.cos(b_lat) * math.cos(dl)
                  )
                  return (
                      math.degrees(math.atan2(y, x)) + 360.0
                  ) % 360.0

              grid_rlon = lon1 + (-i if i_neg else i) * di
              grid_rlat = lat1 + (j if j_pos else -j) * dj
              grid_geo = rotated_to_geo(grid_rlat, grid_rlon)
              next_j_geo = rotated_to_geo(
                  grid_rlat + (dj if j_pos else -dj),
                  grid_rlon,
              )

              return {
                  "Ni": ni,
                  "Nj": nj,
                  "i": i,
                  "j": j,
                  "index": index,
                  "grid_lat": grid_geo[0],
                  "grid_lon": grid_geo[1],
                  "grid_north_bearing": bearing(grid_geo, next_j_geo),
              }

          def read_simple_point(url, message, grid_index, label):
              if message["flags"] & 0x40:
                  print(
                      f"::error::{label}: unerwartete Bitmap im Ensemble-Kernfeld."
                  )
                  sys.exit(1)

              if message["gds_length"] is None:
                  next_section = (
                      message["archive_offset"]
                      + 8 + message["pds_length"]
                  )
              else:
                  next_section = (
                      message["archive_offset"]
                      + 8 + message["pds_length"]
                      + message["gds_length"]
                  )

              bds = range_get(
                  url, next_section, 11, f"BDS {label}"
              )
              if bds[3] & 0xF0:
                  print(
                      f"::error::{label}: kein unterstütztes GRIB1 Simple Packing."
                  )
                  sys.exit(1)

              binary_scale = signed_mag(bds[4:6])
              reference = ibm32(bds[6:10])
              bits = bds[10]
              decimal_scale = message["decimal_scale"]

              if bits == 0:
                  return reference * (10.0 ** (-decimal_scale)), 0

              if not (1 <= bits <= 56):
                  print(f"::error::{label}: bitsPerValue={bits} unplausibel.")
                  sys.exit(1)

              bit_start = grid_index * bits
              byte_start = bit_start // 8
              bit_offset = bit_start % 8
              byte_count = (bit_offset + bits + 7) // 8
              packed_start = next_section + 11

              raw = range_get(
                  url,
                  packed_start + byte_start,
                  byte_count,
                  f"packed point {label}",
              )
              word = int.from_bytes(raw, "big")
              shift = len(raw) * 8 - (bit_offset + bits)
              coded = (word >> shift) & ((1 << bits) - 1)
              value = (
                  reference + coded * (2.0 ** binary_scale)
              ) * (10.0 ** (-decimal_scale))
              return value, byte_count

          def read_fields(url, inner, wanted_specs):
              nonlocal_grid = None
              messages = index_grib(url, inner)

              result = {}
              point_bytes = 0

              global grid
              if grid is None:
                  temp_key = (11, 105, 2, 0)
                  if temp_key not in messages:
                      print("::error::Temperaturfeld für Gitterableitung fehlt.")
                      sys.exit(1)
                  grid = derive_grid_from_message(url, messages[temp_key])

              for name, p, lt, lev, tri in wanted_specs:
                  key = (p, lt, lev, tri)
                  message = messages.get(key)
                  if not message:
                      print(
                          f"::error::{inner['name']}: Feld {name} fehlt."
                      )
                      sys.exit(1)

                  value, used = read_simple_point(
                      url,
                      message,
                      grid["index"],
                      f"{inner['name']}:{name}",
                  )
                  result[name] = value
                  point_bytes += used

              return result, point_bytes

          results = []
          total_packed_value_bytes = 0

          for archive in archives:
              url = get_temp_url(archive["filename"])
              representative = archive["representative_member"]

              target_name = expected_name(
                  representative,
                  archive["run"],
                  archive["target_lead"],
              )
              baseline_name = expected_name(
                  representative,
                  archive["run"],
                  archive["baseline_lead"],
              )

              wanted = {target_name, baseline_name}
              located = locate_required_members(url, wanted)

              target_values, target_bytes = read_fields(
                  url,
                  located[target_name],
                  CORE,
              )
              total_packed_value_bytes += target_bytes

              if archive["baseline_lead"] == archive["target_lead"]:
                  baseline_rain = target_values["rain_kgm2"]
              else:
                  baseline_values, baseline_bytes = read_fields(
                      url,
                      located[baseline_name],
                      [("rain_kgm2", 181, 105, 0, 4)],
                  )
                  baseline_rain = baseline_values["rain_kgm2"]
                  total_packed_value_bytes += baseline_bytes

              adjusted_rain = (
                  target_values["rain_kgm2"] - baseline_rain
              )

              # Packing can yield tiny numerical noise around zero.
              if adjusted_rain < -0.02:
                  print(
                      "::error::Signifikant negativer offset-korrigierter "
                      f"Niederschlag für Member {representative}: "
                      f"{adjusted_rain:.6f} mm"
                  )
                  sys.exit(1)
              adjusted_rain = max(0.0, adjusted_rain)

              u = target_values["wind_u_10m_ms"]
              v = target_values["wind_v_10m_ms"]
              gust_u = target_values["gust_u_10m_ms"]
              gust_v = target_values["gust_v_10m_ms"]

              wind_speed = math.hypot(u, v)
              gust_speed = math.hypot(gust_u, gust_v)

              to_grid = math.degrees(math.atan2(u, v))
              wind_from_true = (
                  grid["grid_north_bearing"] + to_grid + 180.0
              ) % 360.0

              row = {
                  "run_utc": archive["run"].isoformat(),
                  "batch": archive["batch"],
                  "members": archive["members"],
                  "representative_member": representative,
                  "baseline_lead_h": archive["baseline_lead"],
                  "target_lead_h": archive["target_lead"],
                  "common_baseline_utc": common_baseline.isoformat(),
                  "target_valid_utc": target_valid.isoformat(),
                  "temperature_2m_c": round(
                      target_values["temperature_2m_k"] - 273.15, 3
                  ),
                  "wind_speed_10m_ms": round(wind_speed, 3),
                  "wind_speed_10m_kt": round(
                      wind_speed * 1.9438444924406, 2
                  ),
                  "wind_direction_10m_true_deg": round(
                      wind_from_true, 1
                  ),
                  "wind_gusts_10m_ms": round(gust_speed, 3),
                  "wind_gusts_10m_kt": round(
                      gust_speed * 1.9438444924406, 2
                  ),
                  "rain_raw_target_mm": round(
                      target_values["rain_kgm2"], 6
                  ),
                  "rain_raw_baseline_mm": round(
                      baseline_rain, 6
                  ),
                  "precipitation_common_window_mm": round(
                      adjusted_rain, 6
                  ),
              }
              results.append(row)

          # Produce a deterministic 30-member source plan. All five members
          # of one batch share run/baseline/target leads; only member number
          # changes. This is the production expansion applied after this smoke.
          member_plan = []
          for archive in archives:
              for member in archive["members"]:
                  member_plan.append({
                      "member": member,
                      "run_utc": archive["run"].isoformat(),
                      "batch": archive["batch"],
                      "baseline_lead_h": archive["baseline_lead"],
                      "target_lead_h": archive["target_lead"],
                  })
          member_plan.sort(key=lambda item: item["member"])

          if [item["member"] for item in member_plan] != list(range(1, 31)):
              print("::error::30-Member-Plan ist nicht exakt 1..30.")
              sys.exit(1)

          output = {
              "schema": "mid.knmi.eps-rolling-offset-smoke.v1",
              "dataset": f"{dataset}/{version}",
              "requested_point": {
                  "latitude": lat,
                  "longitude": lon,
              },
              "grid": grid,
              "common_baseline_utc": common_baseline.isoformat(),
              "target_valid_utc": target_valid.isoformat(),
              "common_window_hours": 1,
              "member_count": 30,
              "member_plan": member_plan,
              "representative_batch_values": results,
              "production_contract_preview": {
                  "hourly": {
                      "time": [target_valid.isoformat()],
                      "temperature_2m_memberXX": (
                          "one value for each member01..member30"
                      ),
                      "precipitation_memberXX": (
                          "target cumulative minus cumulative at common baseline"
                      ),
                      "wind_speed_10m_memberXX": (
                          "sqrt(Ugrid^2 + Vgrid^2)"
                      ),
                      "wind_gusts_10m_memberXX": (
                          "sqrt(gustUgrid^2 + gustVgrid^2)"
                      ),
                  }
              },
              "transfer": {
                  "requests": request_count,
                  "bytes": transferred_bytes,
                  "packed_value_bytes": total_packed_value_bytes,
                  "full_grib_fields_downloaded": False,
                  "full_tar_archives_downloaded": False,
              },
          }

          print("KNMI rolling EPS offset logic: OK")
          print(
              f"Common baseline: {common_baseline.isoformat()} | "
              f"target valid: {target_valid.isoformat()} | "
              "window: 1 h"
          )
          print("Member source plan: 1..30 complete")
          print("")
          print("Representative value path for each of six hourly batches:")
          for row in results:
              members = row["members"]
              print(
                  f"- run {row['run_utc']} | "
                  f"members {members[0]:02d}-{members[-1]:02d} | "
                  f"rep {row['representative_member']:02d} | "
                  f"lead {row['baseline_lead_h']:02d}->{row['target_lead_h']:02d} h | "
                  f"T={row['temperature_2m_c']:.2f} °C | "
                  f"wind={row['wind_speed_10m_kt']:.2f} kt | "
                  f"gust={row['wind_gusts_10m_kt']:.2f} kt | "
                  f"rain common={row['precipitation_common_window_mm']:.3f} mm"
              )

          print("")
          print(
              f"Packed value bytes used: {total_packed_value_bytes}; "
              f"total transferred incl. sparse headers: {transferred_bytes} bytes; "
              f"HTTP/API requests: {request_count}"
          )
          print("Full GRIB fields downloaded: NO")
          print("Full TAR archives downloaded: NO")
          print("")
          print("JSON:")
          print(json.dumps(output, indent=2, ensure_ascii=False, sort_keys=True))
