name: MID DWD RUC preprocessing
on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
concurrency:
  group: mid-dwd-ruc-preprocess
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  preprocess:
    # Cost gate: remains dormant until the user explicitly enables the variable
    # after R2/free-tier cost review. No paid service is activated by this release.
    if: ${{ vars.MID_RUC_PIPELINE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/ruc/requirements.txt
      - name: Install decoding tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          python -m pip install --disable-pip-version-check -r tools/ruc/requirements.txt
      - name: Discover, download and build latest complete RUC/RUC-EPS run
        env:
          MID_RUC_FORECAST_HOURS: '14'
        run: python tools/ruc/fetch_and_build_ruc.py --output .ruc-out
      - name: Verify generated wire contract
        run: python tools/ruc/test_ruc_pack.py
      - name: Verify atomic R2 publisher without network writes
        run: python tools/ruc/test_publish_ruc_r2.py
      - name: Publish verified immutable RUC/RUC-EPS run to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MID_RUC_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MID_RUC_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MID_RUC_R2_BUCKET: ${{ vars.MID_RUC_R2_BUCKET }}
          MID_RUC_RETAIN_RUNS: '4'
        run: tools/ruc/publish_ruc_r2.sh
      - name: Verify deployed Worker sees the published RUC run
        if: ${{ vars.MID_RUC_WORKER_HEALTH_URL != '' }}
        env:
          MID_RUC_WORKER_HEALTH_URL: ${{ vars.MID_RUC_WORKER_HEALTH_URL }}
        run: python tools/ruc/check_ruc_health.py --url "$MID_RUC_WORKER_HEALTH_URL" --meta .ruc-out/latest.json
