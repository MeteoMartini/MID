name: MID DWD RUC preprocessing
on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: Exakte ursprüngliche Producer-Run-ID eines vollständig geprüften Snapshots; keine Neuberechnung
        required: false
        default: ''
        type: string
      force:
        description: Vollständige RUC-Verarbeitung unabhängig vom Freshness-Guard erzwingen
        required: false
        default: false
        type: boolean
      trigger_source:
        description: Auslöser des Dispatches (manual, github-watchdog, cloudflare-watchdog)
        required: false
        default: manual
        type: string
  schedule:
    # GitHub schedule events are best-effort. Keep the existing :41 slot and a
    # staggered :11 recovery slot; the freshness guard below makes duplicates cheap.
    - cron: '11 * * * *'
    - cron: '41 * * * *'
concurrency:
  group: mid-dwd-ruc-preprocess
  # Never cancel a nearly completed delayed RUC preparation. A queued duplicate
  # self-skips after the first run publishes the current DWD cycle.
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  calculate:
    # The expensive DWD download/decode deliberately runs without the Pages
    # lock. Only the short publish job below serializes against MID releases.
    if: ${{ vars.MID_RUC_PIPELINE_ENABLED == 'true' && !inputs.reuse_run_id }}
    outputs:
      should_run: ${{ steps.freshness.outputs.should_run }}
      stable_sha: ${{ steps.stable_revision.outputs.sha }}
      core_artifact_id: ${{ steps.core_upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Letzten geprüften MID-Stable-Stand laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: mid-stable
          fetch-depth: 1
      - name: Verwendeten MID-Stable-Stand festhalten
        id: stable_revision
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          test "${#sha}" -eq 40
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "RUC-Basis: ${sha}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/ruc/requirements*.txt
      # Check every Python source before the expensive DWD download/decode.
      # ast.parse does not import modules or require eccodes/numpy.
      - name: RUC-Python-Syntax vor dem DWD-Download prüfen
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          sources = sorted(Path('tools/ruc').glob('*.py'))
          if not sources:
              raise SystemExit('Keine RUC-Python-Quellen gefunden')
          for source in sources:
              ast.parse(source.read_text(encoding='utf-8'), filename=str(source))
          print(f'RUC-Syntax geprüft: {len(sources)} Python-Dateien')
          PY
      - name: RUC-Auslöser protokollieren
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "RUC trigger source: ${{ inputs.trigger_source || 'manual' }}"
          else
            echo "RUC trigger source: schedule"
          fi
      - name: Geprüfte Stable-Fähigkeit für den neuen Datenübergabevertrag prüfen
        id: capability
        shell: bash
        run: |
          if [ -f tools/ruc/prepared_snapshot.py ]; then
            echo 'supported=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Der neue RUC-Datenübergabevertrag ist noch nicht nach Stable promotet; letzter geprüfter Snapshot bleibt erhalten.'
          fi
      - name: RUC-Schedulerlücke und Aktualität vorab prüfen
        id: freshness
        if: steps.capability.outputs.supported == 'true'
        env:
          MID_RUC_PAGES_BASE_URL: ${{ vars.MID_RUC_PAGES_BASE_URL || 'https://midwx.app/ruc/' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" != "false" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manueller Lauf erzwingt vollständige Verarbeitung" >> "$GITHUB_OUTPUT"
            echo "RUC schedule guard: forced manual dispatch -> process"
          else
            python tools/ruc/check_ruc_schedule_guard.py --pages-base "$MID_RUC_PAGES_BASE_URL" --github-output "$GITHUB_OUTPUT"
          fi
      - name: Freie DWD-Decodierwerkzeuge installieren
        if: ${{ steps.freshness.outputs.should_run == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          requirements='tools/ruc/requirements-pages.txt'
          if [ ! -f "$requirements" ]; then
            echo '::notice::Lean Pages requirements not present on this older stable source; using compatible full RUC requirements once.'
            requirements='tools/ruc/requirements.txt'
          fi
          python -m pip install --disable-pip-version-check -r "$requirements"
      - name: RUC-Downloadfehler und frühe Vollständigkeitsprüfung offline testen
        if: ${{ steps.freshness.outputs.should_run == 'true' }}
        run: python tools/ruc/timed_command.py download-tests -- python tools/ruc/test_fetch_resilience.py
      - name: Neuesten vollständigen RUC/RUC-EPS-Lauf laden und dekodieren
        if: ${{ steps.freshness.outputs.should_run == 'true' }}
        env:
          MID_RUC_FORECAST_HOURS: '27'
          MID_RUC_EPS_DECODE_WORKERS: '2'
        run: python tools/ruc/timed_command.py --timeout 2400 core-download-decode -- python tools/ruc/fetch_and_build_ruc.py --output .ruc-out
      - name: Vollständige RUC-Kernbytes vor dem Jobwechsel SHA-gebunden prüfen
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          python tools/ruc/timed_command.py preserve-map-grib-cache -- python tools/ruc/prepared_snapshot.py stage-core-cache --snapshot .ruc-out --grib-source .ruc-stage
          python tools/ruc/timed_command.py core-checkpoint -- python tools/ruc/prepared_snapshot.py seal-core --snapshot .ruc-out
      - name: Unveränderlichen RUC-Kern für getrennte Aufbereitung sichern
        id: core_upload
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mid-ruc-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./.ruc-out
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
      - name: Bereits aktuellen RUC-Lauf ohne Neubau bestätigen
        if: steps.freshness.outputs.should_run != 'true'
        run: echo "RUC ohne Neubau; Freshness-Ergebnis oder noch nicht promoteter Übergabevertrag" >> "$GITHUB_STEP_SUMMARY"
      - name: Berechnungslaufzeiten auch bei Fehlern sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mid-ruc-calculation-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ruc-timings.jsonl
          if-no-files-found: ignore
          retention-days: 2

  prepare:
    needs: calculate
    if: ${{ always() && vars.MID_RUC_PIPELINE_ENABLED == 'true' && ((needs.calculate.result == 'success' && needs.calculate.outputs.should_run == 'true') || inputs.reuse_run_id != '') }}
    outputs:
      should_run: ${{ steps.ready.outputs.ready }}
      stable_sha: ${{ steps.stable_revision.outputs.sha }}
      producer_run_id: ${{ inputs.reuse_run_id || github.run_id }}
      producer_event_sha: ${{ steps.reuse.outputs.producer_event_sha || github.sha }}
      producer_run_attempt: ${{ steps.reuse.outputs.producer_run_attempt || github.run_attempt }}
      data_artifact_id: ${{ steps.reuse.outputs.data_artifact_id || steps.data_upload.outputs.artifact-id }}
      rollback_artifact_id: ${{ steps.reuse.outputs.rollback_artifact_id || steps.rollback_upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Producer-Stable oder aktuellen Stable für explizite Wiederverwendung laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.calculate.outputs.stable_sha || 'mid-stable' }}
          fetch-depth: 1
      - name: Aufbereitungsquelle festhalten
        id: stable_revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/ruc/requirements*.txt
      - name: Exakten geprüften Producer und unveränderliche Artefaktpaare ermitteln
        id: reuse
        if: inputs.reuse_run_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUC_REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          MID_RUC_FORCE_REBUILD: ${{ inputs.force }}
        run: python tools/ruc/prepared_snapshot.py resolve --run-id "$RUC_REUSE_RUN_ID"
      - name: Bereits geprüften Snapshot ohne fachliche Neuberechnung laden
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.reuse.outputs.data_artifact_id }}
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error
          path: ./.ruc-pages/ruc
      - name: Producer-Linie, Vertrag, Frische und alle Snapshotbytes erneut zulassen
        if: inputs.reuse_run_id != ''
        env:
          RUC_REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          RUC_PRODUCER_EVENT_SHA: ${{ steps.reuse.outputs.producer_event_sha }}
          RUC_PRODUCER_ATTEMPT: ${{ steps.reuse.outputs.producer_run_attempt }}
        run: |
          git fetch --no-tags --filter=blob:none --deepen=128 origin mid-stable
          python tools/ruc/timed_command.py readmission -- python tools/ruc/prepared_snapshot.py admit --snapshot .ruc-pages/ruc --run-id "$RUC_REUSE_RUN_ID" --event-sha "$RUC_PRODUCER_EVENT_SHA" --attempt "$RUC_PRODUCER_ATTEMPT"
      - name: Exakten Kern-Checkpoint dieser Berechnung laden
        if: inputs.reuse_run_id == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.calculate.outputs.core_artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          path: ./.ruc-out
      - name: Kernbytes und Berechnungsquelle nach dem Jobwechsel erneut prüfen
        if: inputs.reuse_run_id == ''
        run: |
          python tools/ruc/timed_command.py check-core-handoff -- python tools/ruc/prepared_snapshot.py admit-core --snapshot .ruc-out --run-id "$GITHUB_RUN_ID"
          test ! -e .ruc-stage
          mv .ruc-out/prepared-map-grib .ruc-stage
      - name: Etablierte native Aufbereitungsabhängigkeiten installieren
        if: inputs.reuse_run_id == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools
          python -m pip install --disable-pip-version-check -r tools/ruc/requirements-pages.txt
      - name: RUC-Wire- und Pages-Free-Profil prüfen
        env:
          PYTHONFAULTHANDLER: '1'
          MID_RUC_TIMINGS_FILE: .ruc-timings.jsonl
        if: ${{ inputs.reuse_run_id == '' }}
        run: |
          python tools/ruc/timed_command.py wire-tests -- python tools/ruc/test_ruc_pack.py
          python tools/ruc/timed_command.py native-isolation-tests -- python tools/ruc/test_ruc_native_sidecar.py
          python tools/ruc/timed_command.py pages-tests -- python tools/ruc/test_prepare_ruc_pages.py
          # The preparer preserves the verified index after DWD build_synoptic
          # and directly before the legacy raw-budget projection.
          # This raw staging profile is never uploaded/published as a fallback.
          python tools/ruc/timed_command.py sidecars-and-pages -- python tools/ruc/prepare_ruc_pages.py --codec-staging --source .ruc-out --output .ruc-pages
          # Keep the established raw decoder recovery independent of the codec.
          # Byte-project the same run's first 15 terms; rapid/extreme axes stay unchanged.
          python tools/ruc/timed_command.py legacy-rollback -- python tools/ruc/prepare_legacy_core_rollback.py .ruc-out .ruc14-reference .ruc14-rollback > .ruc-legacy-rollback-proof.json
      - name: Node.js 22 für vollständigen RUC-Python/JS-Abgleich laden
        if: ${{ inputs.reuse_run_id == '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
      - name: SHA-gebundenen RUC-Rohsnapshot als rollbackfähiges Artefakt sichern
        if: ${{ inputs.reuse_run_id == '' }}
        id: rollback_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mid-ruc-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./.ruc14-rollback/ruc
          if-no-files-found: error
          retention-days: 2
          compression-level: 6
      - name: Vollständig verlustfreie RUC-Daten byte- und meteorologisch unabhängig prüfen
        if: ${{ inputs.reuse_run_id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/ruc/test_activate_lossless_snapshot.py
          python tools/ruc/timed_command.py codec-build -- python tools/ruc/prepare_lossless_snapshot.py .ruc-pages/ruc .ruc-codec-candidate
          python tools/ruc/timed_command.py full-js-byte-proof -- node tools/ruc/verify_lossless_migration.mjs .ruc-pages/ruc .ruc-codec-candidate > .ruc-codec-proof.json
          python tools/ruc/timed_command.py activate-verified-codec -- python tools/ruc/activate_lossless_snapshot.py .ruc-pages/ruc .ruc-codec-candidate .ruc-codec-proof.json .ruc-compressed/ruc > .ruc-activation-proof.json
          python - <<'PY'
          import json
          proof=json.load(open('.ruc-activation-proof.json'))
          assert proof['schema']=='mid.ruc.activation-proof.v1'
          assert proof['sourceRollbackIntact'] is True
          assert proof['physicalBytes']<proof['budgetBytes']==900000000
          print('RUC: lossless full replacement prepared, verified '+str(proof['fullDecodedParts'])+' parts, '+str(proof['physicalBytes'])+' bytes.')
          PY
          # Optional real DWD ICON-D2 CW/WW +13/+14/+16/+17h, only when source
          # time, model, native grid and SHA were independently verified.
          # Keep previously archived raw recovery exactly unchanged.
          if [ -f .ruc-out/synoptic-fields-full-index.json ] && [ -d .ruc-out/synoptic-fields ]; then
            python tools/ruc/augment_compressed_synoptic.py .ruc-compressed/ruc .ruc-out/synoptic-fields-full-index.json .ruc-out/synoptic-fields > .ruc-extra-synoptic-proof.json
            python - <<'PY'
          import json
          report=json.load(open('.ruc-extra-synoptic-proof.json'))
          assert report['schema']=='mid.ruc.optional-synoptic.v1'
          if report.get('admittedHours'):
              assert report['sourceRawUnchanged'] is True
              assert set(report['admittedHours']).issubset({13,14,16,17})
              assert report['finalPhysicalBytes']<900000000
              print('RUC Zusatzkarten: geprüfte ICON-D2 CW/WW-Termina '+str(report['admittedHours'])+' im komprimierten Paket')
          else:
              print('RUC Zusatzkarten: keine belegten zusätzlichen ICON-D2-Termine, altes Quellenangebot bleibt erhalten')
          PY
          else
            echo '::notice::Keine vollständige synoptische Quelle vorhanden; RUC und Raw-Rollback bleiben unverändert'
          fi
          # Optional native RUC map horizon, strictly separate from core/EPS.
          # Never change the immutable raw rollback or the codec proof.
          python - <<'PYMAP'
          import json,shutil,subprocess,sys,time
          from pathlib import Path
          sys.path.insert(0,'tools/ruc')
          from admit_ruc_map_candidate import admit_optional
          map_started=time.monotonic()
          source=Path('.ruc-out')
          try:
              from datetime import datetime,timedelta
              core=json.loads((source/'latest.json').read_text())
              if len(core['deterministic']['times'])==28:
                  run=datetime.fromisoformat(core['run'].replace('Z','+00:00'))
                  expected=[run+timedelta(hours=i) for i in range(28)]
                  for name in ('deterministic','epsSummary','eps'):
                      if [datetime.fromisoformat(t.replace('Z','+00:00')) for t in core[name]['times']]!=expected:
                          raise ValueError('invalid native 27h map/core axis: '+name)
                  print('RUC maps reuse the already validated native 27h core; no duplicate download')
              else:
                  subprocess.run([sys.executable,'tools/ruc/prepare_ruc_map_source.py','--core',str(source),'--staging','.ruc-stage','--output','.ruc-map-source'],check=True,timeout=180)
                  source=Path('.ruc-map-source')
          except (subprocess.SubprocessError,OSError) as error:
              shutil.rmtree('.ruc-map-source',ignore_errors=True)
              print('::notice::RUC +27h map-only source unavailable; verified core horizon retained: '+str(error))
          # Existing snapshot corruption is fatal. Optional map failure must
          # not block the independently verified RUC core/point forecast (#350).
          proof=admit_optional(Path('.ruc-compressed/ruc'),source,Path('.ruc-map-candidate'))
          proof['mapPreparationSeconds']=round(time.monotonic()-map_started,2)
          if proof['admitted']:
              assert proof['sourceRawUnchanged'] is True and proof['codecProofUnchanged'] is True
              assert proof['finalPhysicalBytes']<900000000
          else:
              assert proof['coreRetained'] is True
              print('::notice::Optional RUC maps skipped; verified core retained: '+proof['reason'])
          Path('.ruc-map-admission-proof.json').write_text(json.dumps(proof)+'\n')
          print('RUC_MAP_ADMISSION '+json.dumps(proof))
          PYMAP
          # Same native run, nine checked pressure/surface components, full hourly axis.
          # Isolated timeout: preserve the independently verified core on optional failure.
          ruc_composite_source=.ruc-out
          if [ -d .ruc-map-source ]; then ruc_composite_source=.ruc-map-source; fi
          ruc_composite_status=0
          timeout 300 python tools/ruc/build_ruc_synoptic_fields.py --snapshot .ruc-compressed/ruc --source "$ruc_composite_source" --staging .ruc-stage --candidate .ruc-synoptic --report .ruc-synoptic-proof.json || ruc_composite_status=$?
          if [ "$ruc_composite_status" -eq 3 ]; then
            echo '::error::RUC Snapshot-Integrität verletzt'; exit 1
          elif [ "$ruc_composite_status" -ne 0 ]; then
            echo '::notice::RUC Synoptik/Wetter nicht vollständig; geprüfter Kern bleibt erhalten'
          else
            cat .ruc-synoptic-proof.json
          fi
          mv .ruc-pages/ruc .ruc-raw
          mv .ruc-compressed/ruc .ruc-pages/ruc
      - name: Geprüften Snapshot für spätere kompatible Releasewechsel versiegeln
        if: inputs.reuse_run_id == ''
        run: python tools/ruc/timed_command.py seal-prepared-snapshot -- python tools/ruc/prepared_snapshot.py seal --snapshot .ruc-pages/ruc
      - name: Vorbereiteten RUC-Snapshot als unveränderliches Übergabeartefakt sichern
        id: data_upload
        if: ${{ inputs.reuse_run_id == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mid-ruc-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./.ruc-pages/ruc
          if-no-files-found: error
          retention-days: 2
          # RUC-Binärdaten sind bereits kompakt; kein zusätzlicher CPU-intensiver
          # Kompressionslauf vor dem kurzen Publish-Lock.
          compression-level: 0
      - name: Erfolgreiche Aufbereitung oder Wiederzulassung bestätigen
        id: ready
        run: echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Aufbereitungslaufzeiten auch bei Fehlern sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mid-ruc-preparation-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ruc-timings.jsonl
          if-no-files-found: ignore
          retention-days: 2

  publish:
    name: MID + RUC kostenfrei auf GitHub Pages veröffentlichen
    needs: prepare
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: mid-pages
      queue: max
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Aktuellen MID-Stable-Stand erst im Publish-Lock laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: mid-stable
          fetch-depth: 1
      - name: RUC-Basis und laufendes Release gegen aktuellen MID-Stable-Stand prüfen
        id: stable_guard
        env:
          EXPECTED_STABLE_SHA: ${{ needs.prepare.outputs.stable_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "consumer_sha=${actual_sha}" >> "$GITHUB_OUTPUT"
          echo "Producer source: ${EXPECTED_STABLE_SHA}; current Stable shell: ${actual_sha}"
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          stable_version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          main_version="$(git show refs/remotes/origin/main:package.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          if [ -z "${stable_version}" ] || [ -z "${main_version}" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MID-Releaseversion konnte für den RUC-Publish nicht eindeutig bestimmt werden; Publish wird fail-closed übersprungen."
            exit 0
          fi
          if [ "${main_version}" != "${stable_version}" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Ein neuer MID-Release ist noch nicht nach mid-stable promotet (${stable_version} → ${main_version}). Der RUC-Publish darf die bereits laufende neue App-Shell nicht mit dem älteren Stable-Stand überschreiben."
            {
              echo "### RUC-Publish wegen laufendem MID-Release übersprungen"
              echo
              echo "mid-stable: ${stable_version}"
              echo
              echo "main: ${main_version}"
              echo
              echo "Der nächste RUC-Lauf baut nach Stable-Promotion automatisch auf der neuen App-Version auf."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "Aktuelle Stable-App-Shell: ${actual_sha} · MID v${stable_version}; Snapshot-Zulassung folgt separat"
      - name: Exakte Producer-Artefakt-ID prüfen
        if: steps.stable_guard.outputs.allowed == 'true'
        env:
          RUC_DATA_ARTIFACT_ID: ${{ needs.prepare.outputs.data_artifact_id }}
          RUC_ROLLBACK_ARTIFACT_ID: ${{ needs.prepare.outputs.rollback_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUC_DATA_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Missing or invalid prepared snapshot artifact ID"; exit 1; }
          [[ "$RUC_ROLLBACK_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Missing immutable raw rollback artifact ID"; exit 1; }
      - name: Vorbereiteten RUC-Snapshot laden
        if: steps.stable_guard.outputs.allowed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.data_artifact_id }}
          run-id: ${{ needs.prepare.outputs.producer_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          merge-multiple: true
          path: ./.ruc-pages/ruc
      - name: Aktuellen JS-Decoder für Snapshot-Zulassung laden
        if: steps.stable_guard.outputs.allowed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
      - name: Vollständige Snapshot-Wiederzulassung mit aktuellem Stable-Datenvertrag
        if: steps.stable_guard.outputs.allowed == 'true'
        env:
          RUC_PRODUCER_RUN_ID: ${{ needs.prepare.outputs.producer_run_id }}
          RUC_PRODUCER_EVENT_SHA: ${{ needs.prepare.outputs.producer_event_sha }}
          RUC_PRODUCER_ATTEMPT: ${{ needs.prepare.outputs.producer_run_attempt }}
          MID_RUC_PAGES_BASE_URL: ${{ vars.MID_RUC_PAGES_BASE_URL || 'https://midwx.app/ruc/' }}
        run: |
          git fetch --no-tags --filter=blob:none --deepen=128 origin mid-stable
          python tools/ruc/timed_command.py publish-readmission -- python tools/ruc/prepared_snapshot.py admit --snapshot .ruc-pages/ruc --run-id "$RUC_PRODUCER_RUN_ID" --event-sha "$RUC_PRODUCER_EVENT_SHA" --attempt "$RUC_PRODUCER_ATTEMPT" --pages-base "$MID_RUC_PAGES_BASE_URL"
          python tools/ruc/timed_command.py publish-js-decoder -- node tools/ruc/verify_prepared_snapshot.mjs .ruc-pages/ruc
      - name: MID-Seite mit aktuellem Stable-Stand und RUC-Snapshot zusammensetzen
        if: steps.stable_guard.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f .ruc-pages/ruc/latest.json
          rm -rf .ruc-site
          cp -a dist .ruc-site
          cp -a .ruc-pages/ruc .ruc-site/ruc
          # GitHub Pages currently allows a published site up to 1 GB. Keep a
          # safety margin so normal MID assets never push the deployment over it.
          bytes="$(du -sb .ruc-site | awk '{print $1}')"
          echo "Pages site bytes: ${bytes}"
          if [ "$bytes" -ge 950000000 ]; then
            echo "::error::MID + RUC Pages site exceeds the 950 MB safety ceiling."
            exit 1
          fi
          test ! -e .ruc-site/ruc/eps-members.bin
          find .ruc-site/ruc -type f -name 'eps-members.bin' -print -quit | grep -q . && { echo '::error::Native EPS member cube must not be published by the free Pages profile.'; exit 1; } || true
      - name: MID-Stable und Releasefenster unmittelbar vor dem Pages-Publish erneut prüfen
        id: publish_guard
        if: steps.stable_guard.outputs.allowed == 'true'
        env:
          EXPECTED_STABLE_SHA: ${{ steps.stable_guard.outputs.consumer_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            +refs/heads/mid-stable:refs/remotes/origin/mid-stable \
            +refs/heads/main:refs/remotes/origin/main
          actual_sha="$(git rev-parse refs/remotes/origin/mid-stable)"
          stable_version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          main_version="$(git show refs/remotes/origin/main:package.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          if [ "${actual_sha}" != "${EXPECTED_STABLE_SHA}" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MID-Stable änderte sich während der RUC-Publish-Vorbereitung (${EXPECTED_STABLE_SHA} → ${actual_sha}). Kein veraltetes RUC-Artefakt wird veröffentlicht."
            exit 0
          fi
          if [ -z "${stable_version}" ] || [ -z "${main_version}" ] || [ "${main_version}" != "${stable_version}" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MID-Releasefenster wurde unmittelbar vor dem RUC-Publish erkannt (stable=${stable_version:-?}, main=${main_version:-?}). Kein älterer App-Shell-Stand wird auf Pages veröffentlicht."
            exit 0
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "MID-Stable unmittelbar vor Publish unverändert: ${actual_sha} · MID v${stable_version}"
      - name: Produktives RUC-Healthgate vor komprimiertem Pages-Publish verpflichtend prüfen
        if: steps.stable_guard.outputs.allowed == 'true' && steps.publish_guard.outputs.allowed == 'true'
        env:
          MID_RUC_WORKER_HEALTH_URL: ${{ vars.MID_RUC_WORKER_HEALTH_URL || vars.MID_WORKER_HEALTH_URL || vars.VITE_METAR_PROXY_URL }}
        run: |
          test -n "$MID_RUC_WORKER_HEALTH_URL" || { echo "::error::Ohne produktiven Worker-Health-Endpunkt keine RUC-Vollkompression."; exit 1; }
      - name: GitHub-Pages-Artefakt hochladen
        if: steps.stable_guard.outputs.allowed == 'true' && steps.publish_guard.outputs.allowed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: mid-ruc-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./.ruc-site
      - name: MID + RUC kostenfrei auf GitHub Pages veröffentlichen
        if: steps.stable_guard.outputs.allowed == 'true' && steps.publish_guard.outputs.allowed == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: mid-ruc-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Produktiven Worker gegen den veröffentlichten RUC-Lauf prüfen
        id: worker_health
        if: ${{ steps.stable_guard.outputs.allowed == 'true' && steps.publish_guard.outputs.allowed == 'true' }}
        env:
          MID_RUC_PAGES_BASE_URL: ${{ vars.MID_RUC_PAGES_BASE_URL }}
          MID_RUC_WORKER_HEALTH_URL: ${{ vars.MID_RUC_WORKER_HEALTH_URL || vars.MID_WORKER_HEALTH_URL || vars.VITE_METAR_PROXY_URL }}
        run: python tools/ruc/check_ruc_health.py --url "$MID_RUC_WORKER_HEALTH_URL" --meta ./.ruc-pages/ruc/latest.json --pages-base "${MID_RUC_PAGES_BASE_URL:-https://midwx.app/ruc/}"

      - name: RUC-Rohsnapshot bei Codec-Ausfall wiederherstellen
        if: ${{ failure() && steps.deployment.outcome == 'success' && steps.worker_health.outcome == 'failure' }}
        id: rollback_raw
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.rollback_artifact_id }}
          run-id: ${{ needs.prepare.outputs.producer_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          merge-multiple: true
          path: ./.ruc-rollback/ruc
      - name: Vorherige unveränderte RUC-Rohbytes für sichere Rücknahme bereitstellen
        if: ${{ failure() && steps.rollback_raw.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f .ruc-rollback/ruc/latest.json
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('.ruc-rollback/ruc')
          m=json.loads((root/'latest.json').read_text())
          assert m.get('schema')=='mid.dwd.ruc.grid.v2' and m.get('storageProfile')=='pages-free-v1'
          objects=m['pages']['objects']
          assert sum(int(o['bytes']) for o in objects)==m['pages']['publishedBytes']
          for o in objects:
              key=o['key']
              assert key.startswith('runs/') and all(x not in ('','..','.') for x in key.split('/'))
              p=root/key
              assert p.is_file() and p.stat().st_size==o['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==o['sha256']
          assert m['pages']['publishedBytes']+len((root/'latest.json').read_bytes())<900000000
          print('RUC rollback immutable original verified: '+str(len(objects))+' objects')
          PY
          cp -a .ruc-site .ruc-rollback-site
          rm -rf .ruc-rollback-site/ruc
          cp -a .ruc-rollback/ruc .ruc-rollback-site/ruc
          bytes="$(du -sb .ruc-rollback-site | awk '{print $1}')"
          test "$bytes" -lt 950000000
      - name: Rollback-Rohdaten als GitHub-Pages-Artefakt hochladen
        if: ${{ failure() && steps.rollback_raw.outcome == 'success' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: mid-ruc-pages-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./.ruc-rollback-site
      - name: Nach fehlgeschlagenem Codec-Healthcheck RUC-Rohsnapshot zurückveröffentlichen
        if: ${{ failure() && steps.rollback_raw.outcome == 'success' }}
        id: rollback_pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: mid-ruc-pages-rollback-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Rollback-Worker/Pages mit derselben Run-ID nachweisen
        if: ${{ failure() && steps.rollback_pages.outcome == 'success' }}
        env:
          MID_RUC_PAGES_BASE_URL: ${{ vars.MID_RUC_PAGES_BASE_URL }}
          MID_RUC_WORKER_HEALTH_URL: ${{ vars.MID_RUC_WORKER_HEALTH_URL || vars.MID_WORKER_HEALTH_URL || vars.VITE_METAR_PROXY_URL }}
        run: python tools/ruc/check_ruc_health.py --url "$MID_RUC_WORKER_HEALTH_URL" --meta ./.ruc-rollback/ruc/latest.json --pages-base "${MID_RUC_PAGES_BASE_URL:-https://midwx.app/ruc/}"
      - name: RUC-Ergebnis eindeutig zusammenfassen
        if: always()
        env:
          PREPARED: ${{ needs.prepare.outputs.should_run }}
          STABLE_ALLOWED: ${{ steps.stable_guard.outputs.allowed }}
          PUBLISH_ALLOWED: ${{ steps.publish_guard.outputs.allowed }}
          DEPLOYED: ${{ steps.deployment.outcome }}
          WORKER_HEALTH: ${{ steps.worker_health.outcome }}
          ROLLBACK_DEPLOYED: ${{ steps.rollback_pages.outcome }}
        run: |
          if [ "$DEPLOYED" = success ] && [ "$WORKER_HEALTH" = success ]; then result='vollständig komprimiert veröffentlicht und Worker/Pages geprüft';
          elif [ "$ROLLBACK_DEPLOYED" = success ]; then result='Codec-Publish fehlgeschlagen; RUC-Rohsnapshot nachveröffentlicht';
          elif [ "$STABLE_ALLOWED" = false ] || [ "$PUBLISH_ALLOWED" = false ]; then result='aufbereitet, wegen Releasewechsel übersprungen';
          elif [ "$DEPLOYED" = success ]; then result='Codec veröffentlicht, Worker-Übernahme NICHT bestätigt; sofortige Fehlerprüfung erforderlich';
          else result='nicht veröffentlicht; vorherige Schritte prüfen'; fi
          echo "RUC-Ergebnis: $result · Worker-Übernahme: ${WORKER_HEALTH:-nicht geprüft}" >> "$GITHUB_STEP_SUMMARY"

  diagnostics:
    if: always()
    needs: [calculate, prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Sämtliche GitHub-Schrittzeiten und unveränderte Abbruchkonklusionen sichern
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ruc/report_workflow_timings.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mid-ruc-workflow-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ruc-workflow-timings.json
          if-no-files-found: error
          retention-days: 2
