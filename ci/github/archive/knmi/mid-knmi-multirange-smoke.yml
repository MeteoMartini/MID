name: MID KNMI multirange smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mid-knmi-multirange-smoke
  cancel-in-progress: true

jobs:
  multirange-smoke:
    name: Validate KNMI HTTP multi-range support
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KNMI_DATASET: harmonie_arome_cy43_p4a
      KNMI_DATASET_VERSION: "1.0"
      KNMI_API_KEY: ${{ secrets.KNMI_OPEN_DATA_API_KEY }}
      MAX_TAR_ENTRIES: "16"

    steps:
      - name: Test 2, 32, 128 and 256 disjoint ranges
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KNMI_API_KEY:-}" ]; then
            echo "::error::KNMI_OPEN_DATA_API_KEY fehlt oder ist leer."
            exit 1
          fi

          python3 - <<'PY'
          import email.parser
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request

          api_key = os.environ["KNMI_API_KEY"]
          dataset = os.environ["KNMI_DATASET"]
          version = os.environ["KNMI_DATASET_VERSION"]
          max_tar_entries = int(os.environ["MAX_TAR_ENTRIES"])
          base = "https://api.dataplatform.knmi.nl/open-data/v1"

          request_count = 0
          bytes_received = 0

          def api_json(url):
              global request_count
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": api_key,
                      "User-Agent": "MID-KNMI-multirange-smoke/1.0",
                  },
              )
              request_count += 1
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          query = urllib.parse.urlencode({
              "maxKeys": 1,
              "orderBy": "created",
              "sorting": "desc",
          })
          listing = api_json(
              f"{base}/datasets/{dataset}/versions/{version}/files?{query}"
          )
          files = listing.get("files") or []
          if not files:
              print("::error::Keine P4a-Datei gefunden.")
              sys.exit(1)

          archive = files[0].get("filename")
          if not archive:
              print("::error::Archivname fehlt.")
              sys.exit(1)

          encoded = urllib.parse.quote(archive, safe="")
          url_payload = api_json(
              f"{base}/datasets/{dataset}/versions/{version}/files/"
              f"{encoded}/url"
          )
          download_url = url_payload.get("temporaryDownloadUrl")
          if not isinstance(download_url, str) or not download_url.startswith("https://"):
              print("::error::Keine gültige temporäre Download-URL.")
              sys.exit(1)

          def single_range(start, length, purpose):
              global request_count, bytes_received
              end = start + length - 1
              req = urllib.request.Request(
                  download_url,
                  headers={
                      "Range": f"bytes={start}-{end}",
                      "Accept-Encoding": "identity",
                      "User-Agent": "MID-KNMI-multirange-smoke/1.0",
                  },
              )
              request_count += 1
              with urllib.request.urlopen(req, timeout=30) as r:
                  if getattr(r, "status", None) != 206:
                      print(f"::error::{purpose}: HTTP {getattr(r,'status',None)} statt 206.")
                      sys.exit(1)
                  data = r.read(length + 1)
                  if len(data) != length:
                      print(f"::error::{purpose}: {len(data)} statt {length} Byte.")
                      sys.exit(1)
                  bytes_received += len(data)
                  return data

          def tar_octal(raw):
              text = raw.rstrip(b"\0 ").lstrip(b" ")
              return int(text, 8) if text else 0

          def tar_text(raw):
              return raw.split(b"\0", 1)[0].decode("utf-8", "replace").strip()

          # Locate the first real GRIB TAR member using only a few headers.
          offset = 0
          member = None
          for _ in range(max_tar_entries):
              h = single_range(offset, 512, "TAR header")
              if h == b"\0" * 512:
                  break
              name = tar_text(h[0:100])
              prefix = tar_text(h[345:500])
              if prefix:
                  name = f"{prefix}/{name}"
              size = tar_octal(h[124:136])
              typeflag = h[156:157].decode("ascii", "replace") or "0"
              if (
                  typeflag in ("0", "\x00")
                  and "harm43_v1_eur_uwcw_meteo_" in name
                  and name.endswith("_GB")
              ):
                  member = {
                      "name": name,
                      "size": size,
                      "payload": offset + 512,
                  }
                  break
              offset += 512 + ((size + 511) // 512) * 512

          if not member:
              print("::error::Kein reguläres HARMONIE-GRIB-TAR-Mitglied gefunden.")
              sys.exit(1)

          if member["size"] < 300000:
              print("::error::TAR-Mitglied unerwartet klein.")
              sys.exit(1)

          # Multi-range parser. urllib exposes the raw multipart body, so parse
          # it through the stdlib MIME parser using the response Content-Type.
          def test_multi_range(count):
              global request_count, bytes_received

              # Keep every requested byte disjoint. The points stay inside the
              # first GRIB TAR member and are spaced far enough to avoid merging.
              first = member["payload"] + 128
              stride = 997
              ranges = []
              for i in range(count):
                  start = first + i * stride
                  if start >= member["payload"] + member["size"]:
                      print("::error::Testbereich überschreitet TAR-Mitglied.")
                      sys.exit(1)
                  ranges.append((start, start))

              range_value = "bytes=" + ",".join(
                  f"{start}-{end}" for start, end in ranges
              )
              req = urllib.request.Request(
                  download_url,
                  headers={
                      "Range": range_value,
                      "Accept-Encoding": "identity",
                      "User-Agent": "MID-KNMI-multirange-smoke/1.0",
                  },
              )
              request_count += 1

              try:
                  r = urllib.request.urlopen(req, timeout=45)
              except Exception as exc:
                  return {
                      "count": count,
                      "ok": False,
                      "error": f"request failed: {exc}",
                  }

              try:
                  status = getattr(r, "status", None)
                  content_type = r.headers.get("Content-Type", "")
                  content_range = r.headers.get("Content-Range", "")
                  body = r.read(8_000_000)
                  bytes_received += len(body)

                  result = {
                      "count": count,
                      "status": status,
                      "content_type": content_type,
                      "content_range": content_range,
                      "response_bytes": len(body),
                      "ok": False,
                  }

                  if status != 206:
                      result["error"] = f"HTTP {status} statt 206"
                      return result

                  if not content_type.lower().startswith("multipart/byteranges"):
                      result["error"] = (
                          "Server lieferte keinen multipart/byteranges-Response"
                      )
                      return result

                  # Build a synthetic MIME message so Python parses the boundary.
                  synthetic = (
                      f"Content-Type: {content_type}\r\n"
                      "MIME-Version: 1.0\r\n\r\n"
                  ).encode("ascii") + body
                  msg = email.parser.BytesParser().parsebytes(synthetic)
                  parts = list(msg.iter_parts()) if hasattr(msg, "iter_parts") else []
                  if not parts:
                      # Compat path for Message.walk().
                      parts = [p for p in msg.walk() if p is not msg and not p.is_multipart()]

                  if len(parts) != count:
                      result["error"] = (
                          f"Multipart enthält {len(parts)} statt {count} Teile"
                      )
                      result["parts"] = len(parts)
                      return result

                  returned = []
                  for part in parts:
                      cr = part.get("Content-Range", "")
                      match = re.match(r"bytes\s+(\d+)-(\d+)/(\d+|\*)", cr)
                      payload = part.get_payload(decode=True)
                      if not match or payload is None:
                          result["error"] = "Multipart-Teil ohne gültigen Content-Range"
                          return result
                      start = int(match.group(1))
                      end = int(match.group(2))
                      if end != start or len(payload) != 1:
                          result["error"] = "Multipart-Test erwartete 1-Byte-Teile"
                          return result
                      returned.append((start, end))

                  expected = sorted(ranges)
                  if sorted(returned) != expected:
                      result["error"] = "Zurückgegebene Ranges stimmen nicht exakt überein"
                      return result

                  result["parts"] = len(parts)
                  result["ok"] = True
                  return result
              finally:
                  r.close()

          results = []
          for count in (2, 32, 128, 256):
              row = test_multi_range(count)
              results.append(row)
              print(
                  f"Multi-range {count}: "
                  + ("OK" if row.get("ok") else f"NO · {row.get('error')}")
              )
              # If even two ranges are unsupported, larger tests are pointless.
              if count == 2 and not row.get("ok"):
                  break

          supported = bool(results and results[0].get("ok"))
          max_verified = max(
              (row["count"] for row in results if row.get("ok")),
              default=0,
          )

          output = {
              "schema": "mid.knmi.multirange-smoke.v1",
              "archive": archive,
              "tar_member": member["name"],
              "multipart_byteranges_supported": supported,
              "max_verified_disjoint_ranges": max_verified,
              "results": results,
              "requests": request_count,
              "bytes_received": bytes_received,
          }

          print("")
          print("Result:")
          print(f"- multipart/byteranges supported: {supported}")
          print(f"- max verified ranges in one request: {max_verified}")
          print(f"- requests used: {request_count}")
          print(f"- bytes received: {bytes_received}")
          print("")
          print("JSON:")
          print(json.dumps(output, indent=2, ensure_ascii=False, sort_keys=True))

          # This is a capability smoke. Unsupported multi-range is a valid
          # architecture result, not a broken workflow.
          PY
