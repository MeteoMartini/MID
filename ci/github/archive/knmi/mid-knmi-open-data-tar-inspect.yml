name: MID KNMI Open Data TAR inspect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mid-knmi-open-data-tar-inspect
  cancel-in-progress: true

jobs:
  inspect-knmi-p4a-tar:
    name: Inspect KNMI P4a TAR headers safely
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KNMI_DATASET: harmonie_arome_cy43_p4a
      KNMI_DATASET_VERSION: "1.0"
      KNMI_API_KEY: ${{ secrets.KNMI_OPEN_DATA_API_KEY }}

    steps:
      - name: Inspect latest TAR without downloading archive payload
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KNMI_API_KEY:-}" ]; then
            echo "::error::KNMI_OPEN_DATA_API_KEY fehlt oder ist leer."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request

          api_key = os.environ["KNMI_API_KEY"]
          dataset = os.environ["KNMI_DATASET"]
          version = os.environ["KNMI_DATASET_VERSION"]
          base = "https://api.dataplatform.knmi.nl/open-data/v1"

          # 1) Nur die neueste KNMI-Datei ermitteln.
          query = urllib.parse.urlencode({
              "maxKeys": 1,
              "orderBy": "created",
              "sorting": "desc",
          })
          list_url = f"{base}/datasets/{dataset}/versions/{version}/files?{query}"
          req = urllib.request.Request(
              list_url,
              headers={"Authorization": api_key},
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
          except Exception as exc:
              print(f"::error::KNMI-Dateiliste fehlgeschlagen: {exc}")
              sys.exit(1)

          files = payload.get("files") or []
          if not files:
              print("::error::Keine P4a-Dateien gefunden.")
              sys.exit(1)

          latest = files[0]
          filename = latest.get("filename")
          if not filename:
              print("::error::Neueste KNMI-Datei hat keinen Dateinamen.")
              sys.exit(1)

          # 2) Temporäre Download-URL anfordern, Wert nie ausgeben.
          encoded = urllib.parse.quote(filename, safe="")
          endpoint = (
              f"{base}/datasets/{dataset}/versions/{version}/files/"
              f"{encoded}/url"
          )
          req = urllib.request.Request(
              endpoint,
              headers={"Authorization": api_key},
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  url_payload = json.load(response)
          except Exception as exc:
              print(f"::error::Download-URL-Abfrage fehlgeschlagen: {exc}")
              sys.exit(1)

          download_url = url_payload.get("temporaryDownloadUrl")
          if not isinstance(download_url, str) or not download_url.startswith("https://"):
              print("::error::Keine gültige temporäre Download-URL erhalten.")
              sys.exit(1)

          print("KNMI access: OK")
          print(f"Dataset: {dataset}/{version}")
          print(f"Archive: {filename}")
          if latest.get("size") is not None:
              print(f"KNMI metadata size: {latest['size']} bytes")
          if latest.get("created"):
              print(f"Created: {latest['created']}")

          total_size = None
          transferred = 0

          def get_range(start, length=512):
              global total_size, transferred
              end = start + length - 1
              request = urllib.request.Request(
                  download_url,
                  headers={
                      "Range": f"bytes={start}-{end}",
                      "Accept-Encoding": "identity",
                      "User-Agent": "MID-KNMI-TAR-inspect/1.0",
                  },
              )
              try:
                  response = urllib.request.urlopen(request, timeout=30)
              except Exception as exc:
                  print(f"::error::HTTP-Range {start}-{end} fehlgeschlagen: {exc}")
                  sys.exit(1)

              try:
                  status = getattr(response, "status", None)
                  content_range = response.headers.get("Content-Range", "")
                  if status != 206:
                      print(
                          "::error::Server hat den Range-Request nicht mit HTTP 206 "
                          f"beantwortet (Status {status}). Abbruch, damit niemals das "
                          "vollständige Archiv geladen wird."
                      )
                      sys.exit(1)

                  match = re.match(r"bytes\s+\d+-\d+/(\d+|\*)", content_range)
                  if not match:
                      print(f"::error::Ungültiger Content-Range-Header: {content_range!r}")
                      sys.exit(1)

                  if match.group(1) != "*":
                      total_size = int(match.group(1))

                  data = response.read(length + 1)
                  if len(data) != length:
                      print(
                          f"::error::Range lieferte {len(data)} statt {length} Byte."
                      )
                      sys.exit(1)

                  transferred += len(data)
                  return data
              finally:
                  response.close()

          def parse_octal(raw):
              text = raw.rstrip(b"\0 ").lstrip(b" ")
              if not text:
                  return 0
              try:
                  return int(text, 8)
              except ValueError:
                  return None

          def decode_text(raw):
              return raw.split(b"\0", 1)[0].decode("utf-8", "replace").strip()

          # 3) Nur TAR-Header lesen. Payload wird komplett übersprungen.
          offset = 0
          max_entries = 24
          entries = []

          for index in range(max_entries):
              header = get_range(offset, 512)

              if header == b"\0" * 512:
                  print(f"TAR-Ende bei Offset {offset}.")
                  break

              name = decode_text(header[0:100])
              prefix = decode_text(header[345:500])
              if prefix:
                  name = f"{prefix}/{name}"

              size = parse_octal(header[124:136])
              typeflag = header[156:157].decode("ascii", "replace") or "0"

              if size is None:
                  print(
                      f"::error::TAR-Größe in Header #{index + 1} "
                      f"bei Offset {offset} ist nicht lesbar."
                  )
                  sys.exit(1)

              entries.append((index + 1, offset, typeflag, size, name))
              padded = ((size + 511) // 512) * 512
              offset += 512 + padded

              if total_size is not None and offset >= total_size:
                  break

          if not entries:
              print("::error::Keine TAR-Einträge erkannt.")
              sys.exit(1)

          print("")
          print("TAR header inspection: OK")
          if total_size is not None:
              print(f"Archive size from Content-Range: {total_size} bytes")
          print(f"Header bytes actually transferred: {transferred} bytes")
          print("")
          print("First TAR entries:")
          for number, start, typeflag, size, name in entries:
              print(
                  f"{number:02d}  offset={start:<14d} "
                  f"type={typeflag!r} size={size:<12d}  {name}"
              )

          print("")
          print(
              "SAFETY: No TAR payload/GRIB field was downloaded; "
              "only 512-byte TAR headers were requested."
          )
          PY
