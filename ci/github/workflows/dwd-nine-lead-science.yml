name: MID DWD Nine-Lead Original Science (draft only)
run-name: MID DWD 9-Lead A/B (original GRIB, read-only)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/ruc/build_model_map_fields.py'
      - 'tools/ruc/dwd_stage_batch_reuse.py'
      - 'tools/ruc/test_dwd_stage_batch_reuse.py'
      - 'tools/ruc/dwd_real_regular_nine_lead_ab_science_qa.py'
      - '.github/workflows/dwd-nine-lead-science.yml'

permissions:
  contents: read

concurrency:
  group: mid-dwd-nine-lead-science-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  science-only:
    # No secrets, tokens, production reads or deployment rights.
    # Entire workflow removed again after this one pinned original-data proof.
    if: github.event.pull_request.draft && github.event.pull_request.head.ref == 'chatgpt/v0.9.85.418-dwd-map-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Verifizierten PR-Commit auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Eingrenzung, Python-Syntax und Offline-Regressionsfälle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ruc/build_model_map_fields.py tools/ruc/dwd_stage_batch_reuse.py tools/ruc/dwd_real_regular_nine_lead_ab_science_qa.py
          python3 -m unittest discover -s tools/ruc -p 'test_dwd_stage_batch_reuse.py' -v

      - name: Reproduzierbare wissenschaftliche GRIB-Abhängigkeiten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/mid-original-batch-science"
          "${RUNNER_TEMP}/mid-original-batch-science/bin/python" -m pip install --no-cache-dir --disable-pip-version-check --only-binary=:all: \
            'eccodes==2.50.0' 'numpy==2.3.5' 'requests==2.32.5' 'scipy==1.16.3' 'contourpy==1.3.3'

      - name: Alle neun Originalzeiten / 72 Frames / Input-SHAs / Bytevolumen / 3 Laufzeitpaare
        shell: bash
        timeout-minutes: 23
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/mid-original-batch-science/bin/python" tools/ruc/dwd_real_regular_nine_lead_ab_science_qa.py
