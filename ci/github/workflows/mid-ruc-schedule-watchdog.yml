name: MID RUC schedule watchdog
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Install MID release and deploy
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mid-ruc-schedule-watchdog.yml'
      - '.github/workflows/mid-ruc-preprocess.yml'
  schedule:
    # Same-provider recovery checks 12 minutes after each primary slot. This
    # catches isolated GitHub schedule drops without six same-provider probes/h;
    # the external Cloudflare watchdog remains the independent scheduler layer.
    - cron: '23,53 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: mid-ruc-schedule-watchdog
  cancel-in-progress: false

jobs:
  verify-and-recover:
    if: >-
      vars.MID_RUC_PIPELINE_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Geprüften Stable-Code für öffentlichen RUC-Datenabgleich laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: mid-stable
          fetch-depth: 1
          persist-credentials: false
      - name: Tatsächlich veröffentlichten RUC-Lauf mit DWD vergleichen
        id: data_freshness
        env:
          MID_RUC_PAGES_BASE_URL: ${{ vars.MID_RUC_PAGES_BASE_URL || 'https://midwx.app/ruc/' }}
        run: python3 tools/ruc/check_ruc_schedule_guard.py --pages-base "$MID_RUC_PAGES_BASE_URL" --github-output "$GITHUB_OUTPUT"
      - name: Letzten primären RUC-Slot prüfen und bei Schedulerlücke nachholen
        env:
          GH_TOKEN: ${{ github.token }}
          RUC_WORKFLOW: mid-ruc-preprocess.yml
          DATA_CATCHUP: ${{ steps.data_freshness.outputs.should_run }}
        shell: bash
        run: |
          set -euo pipefail

          now_epoch="$(date -u +%s)"
          minute="$(date -u +%M)"
          hour_start="$((now_epoch - 10#${minute} * 60 - 10#$(date -u +%S)))"
          if [ "$((10#${minute}))" -ge 41 ]; then
            expected_epoch="$((hour_start + 41 * 60))"
            expected_slot=':41'
          elif [ "$((10#${minute}))" -ge 11 ]; then
            expected_epoch="$((hour_start + 11 * 60))"
            expected_slot=':11'
          else
            expected_epoch="$((hour_start - 19 * 60))"
            expected_slot=':41'
          fi
          # A few minutes of clock/API tolerance are harmless; the RUC freshness
          # guard prevents a recovery dispatch from rebuilding an already current run.
          expected_floor="$((expected_epoch - 180))"

          latest_schedule_json="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${RUC_WORKFLOW}/runs?event=schedule&per_page=1")"
          latest_schedule_at="$(printf '%s' "$latest_schedule_json" | jq -r '.workflow_runs[0].created_at // empty')"
          latest_schedule_status="$(printf '%s' "$latest_schedule_json" | jq -r '.workflow_runs[0].status // empty')"
          latest_schedule_conclusion="$(printf '%s' "$latest_schedule_json" | jq -r '.workflow_runs[0].conclusion // empty')"
          latest_schedule_url="$(printf '%s' "$latest_schedule_json" | jq -r '.workflow_runs[0].html_url // empty')"
          latest_schedule_epoch=0
          if [ -n "$latest_schedule_at" ]; then
            latest_schedule_epoch="$(date -u -d "$latest_schedule_at" +%s 2>/dev/null || echo 0)"
          fi

          healthy_schedule=false
          if [ "$latest_schedule_epoch" -ge "$expected_floor" ]; then
            case "$latest_schedule_conclusion" in
              failure|cancelled|timed_out|action_required|startup_failure)
                healthy_schedule=false
                ;;
              *)
                healthy_schedule=true
                ;;
            esac
          fi

          # A workflow-file push intentionally exercises the guarded dispatch once.
          # force=false keeps this a no-op when the published RUC snapshot is already current,
          # while proving that the recovery path itself can really start a workflow run.
          recovery_self_test=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            recovery_self_test=true
            echo "RUC watchdog deployment self-test: guarded recovery dispatch will be exercised once."
          fi

          # A successful prepare/publish workflow may be a release-guarded no-op.
          # Only an independently current public pointer can suppress catch-up.
          if [ "$DATA_CATCHUP" != false ]; then
            healthy_schedule=false
            echo 'RUC publication needs catch-up; scheduler success alone is insufficient.'
          fi

          if [ "$healthy_schedule" = true ] && [ "$recovery_self_test" != true ]; then
            echo "RUC primary ${expected_slot} schedule event verified: ${latest_schedule_status}/${latest_schedule_conclusion:-pending} ${latest_schedule_url}"
            exit 0
          fi

          # Do not stack repair runs. A running RUC workflow or any dispatch started
          # in the last 18 minutes is sufficient; its own freshness guard decides
          # whether a rebuild is actually necessary.
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          stable_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/mid-stable" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[a-f0-9]{40}$ && "$stable_sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          if [ "$main_sha" != "$stable_sha" ]; then
            echo "RUC recovery deferred: MID release not yet promoted to stable."
            exit 0
          fi

          recent_json="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${RUC_WORKFLOW}/runs?per_page=30")"
          active_rows="$(printf '%s' "$recent_json" | jq -r 'if (.workflow_runs | type) != "array" then error("invalid RUC run list") else .workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested") | if (.id | type) != "number" or .id <= 0 then error("invalid active RUC run id") else [.id, .status, (.run_started_at // .created_at), .html_url] | @tsv end end')"
          active_url=''
          while IFS=$'\t' read -r run_id run_status run_created run_url; do
            [ -n "$run_id" ] || continue
            run_epoch="$(date -u -d "$run_created" +%s 2>/dev/null || echo 0)"
            if [[ "$run_status" =~ ^(queued|pending|requested)$ ]] && [ "$run_epoch" -gt 0 ] && [ "$run_epoch" -lt "$((now_epoch - 42 * 60))" ]; then
              jobs_json="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=1")"
              if printf '%s' "$jobs_json" | jq -e '(.total_count | type) == "number" and .total_count == 0 and (.jobs | type) == "array" and (.jobs | length) == 0' >/dev/null; then
                echo "RUC watchdog: stale unstarted scheduler record ignored (${run_id}); no jobs were cancelled."
                continue
              fi
            fi
            active_url="${run_url:-https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}}"
            break
          done <<< "$active_rows"
          if [ -n "$active_url" ]; then
            echo "RUC recovery suppressed: active preprocessing run already exists ${active_url}"
            exit 0
          fi

          latest_dispatch_at="$(printf '%s' "$recent_json" | jq -r '[.workflow_runs[] | select(.event == "workflow_dispatch")] | max_by(.run_started_at // .created_at) | (.run_started_at // .created_at // empty)')"
          latest_dispatch_epoch=0
          if [ -n "$latest_dispatch_at" ]; then
            latest_dispatch_epoch="$(date -u -d "$latest_dispatch_at" +%s 2>/dev/null || echo 0)"
          fi
          if [ "$latest_dispatch_epoch" -ge "$((now_epoch - 18 * 60))" ]; then
            echo "RUC recovery suppressed: workflow_dispatch cooldown (<18 min) is active."
            exit 0
          fi

          if [ "$recovery_self_test" = true ]; then
            echo "RUC primary ${expected_slot} schedule event is ${latest_schedule_status:-missing}/${latest_schedule_conclusion:-unknown}; exercising guarded recovery dispatch."
          else
            echo "::warning::RUC primary ${expected_slot} schedule event missing or failed; starting guarded recovery dispatch."
          fi
          dispatch_started_epoch="$(date -u +%s)"
          gh workflow run "$RUC_WORKFLOW" -R "$GITHUB_REPOSITORY" --ref main -f force=false -f trigger_source=github-watchdog

          for attempt in $(seq 1 18); do
            sleep 5
            latest_dispatch_json="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${RUC_WORKFLOW}/runs?event=workflow_dispatch&per_page=1")"
            latest_dispatch_at="$(printf '%s' "$latest_dispatch_json" | jq -r '.workflow_runs[0].created_at // empty')"
            latest_dispatch_epoch=0
            if [ -n "$latest_dispatch_at" ]; then
              latest_dispatch_epoch="$(date -u -d "$latest_dispatch_at" +%s 2>/dev/null || echo 0)"
            fi
            if [ "$latest_dispatch_epoch" -ge "$((dispatch_started_epoch - 5))" ]; then
              latest_dispatch_status="$(printf '%s' "$latest_dispatch_json" | jq -r '.workflow_runs[0].status // empty')"
              latest_dispatch_conclusion="$(printf '%s' "$latest_dispatch_json" | jq -r '.workflow_runs[0].conclusion // empty')"
              latest_dispatch_url="$(printf '%s' "$latest_dispatch_json" | jq -r '.workflow_runs[0].html_url // empty')"
              echo "RUC recovery dispatch verified: ${latest_dispatch_status}/${latest_dispatch_conclusion:-pending} ${latest_dispatch_url}"
              exit 0
            fi
          done

          echo "::error::RUC recovery dispatch was requested but no new workflow_dispatch run became visible within 90 seconds."
          exit 1
