name: MID Unit Coverage
run-name: Vitest Unit-/Coverage-Pilot

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mid-unit-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-coverage:
    name: Vitest 5 + V8 Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Repository laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 22 einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: MID-Abhängigkeiten reproduzierbar installieren
        shell: bash
        run: npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps

      # Coverage executes the same unit suite and fails on assertion errors.
      - name: Unit-Tests einmal mit V8-Coverage ausführen
        shell: bash
        run: npm run test:coverage

      # Additive shadow QA; original coverage/CI-origin checks remain unchanged.
      - name: Open-Meteo RUC Spatial und DWD-Batch Shadow-Regressionen (offline)
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          node --test \
            tools/ruc/test_openmeteo_spatial_shadow.mjs \
            tools/ruc/test_openmeteo_spatial_byte_shadow.mjs \
            tools/ruc/test_dwd_batch_source_plan_shadow.mjs \
            tools/ruc/test_dwd_staged_source_sha_shadow.mjs

      # Temporary science QA, restricted to this Draft investigation; no release permission.
      - name: DWD ICON-D2 einmalige GRIB-Quellen je Batch prüfen (offline)
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/ruc -p 'test_dwd_stage_batch_reuse.py' -v

      - name: Open-Meteo RUC Spatial Live-Byte-Range Shadow (read-only)
        if: github.event_name == 'pull_request' && github.head_ref == 'chatgpt/v0.9.85.417-openmeteo-ruc-spatial-shadow'
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          node tools/ruc/openmeteo_spatial_byte_shadow.mjs

      # Science-only, branch-fenced and ephemeral: GPL reader not bundled with MID.
      - name: Open-Meteo OM-Feldformen unabhängig inspizieren (Draft-Science-QA)
        if: github.event_name == 'pull_request' && github.head_ref == 'chatgpt/v0.9.85.417-openmeteo-ruc-spatial-shadow'
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/mid-om-science-qa"
          "${RUNNER_TEMP}/mid-om-science-qa/bin/python" -m pip install --no-cache-dir --only-binary=:all: --disable-pip-version-check 'omfiles==1.2.0' 'numpy==2.3.5'
          "${RUNNER_TEMP}/mid-om-science-qa/bin/python" tools/ruc/openmeteo_om_shape_science_qa.py

      # Exactly one historical same-run full-array original-vs-processed QA; never a production dependency.
      - name: DWD RUC Original-GRIB vs OM 542040-Zellen T2M Science-A-B (nur Draft)
        if: github.event_name == 'pull_request' && github.head_ref == 'chatgpt/v0.9.85.417-openmeteo-ruc-spatial-shadow'
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/mid-om-science-qa/bin/python" -m pip install --no-cache-dir --only-binary=:all: --disable-pip-version-check 'eccodes==2.50.0'
          "${RUNNER_TEMP}/mid-om-science-qa/bin/python" tools/ruc/om_dwd_t2m_ab_science_qa.py
          "${RUNNER_TEMP}/mid-om-science-qa/bin/python" tools/ruc/om_dwd_standard_fields_ab_science_qa.py

      - name: CI/CD-Effizienz- und Herkunftsregressionen (read-only)
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-release-timing-0985376.mjs scripts/test-release-train-plan-0985376.mjs scripts/test-source-gate-evidence-0985376.mjs scripts/test-build-parity-0985377.mjs
          node scripts/test-installer-sharding-0985193.mjs
          node scripts/test-installer-verification-budget-0985190.mjs
          node scripts/test-core-regression-isolated-matrix-0985354.mjs
          node scripts/test-install-main-race-09572.mjs
          node scripts/test-github-actions-runtime.mjs
          node scripts/test-security-diagnostics-0985347.mjs
          node scripts/test-ruc-pages-free-storage-09700.mjs

      - name: Coverage-Bericht sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-vitest-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
