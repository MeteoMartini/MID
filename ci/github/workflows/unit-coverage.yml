name: MID Unit Coverage
run-name: Vitest Unit-/Coverage-Pilot

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mid-unit-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-coverage:
    name: Vitest 5 + V8 Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Repository laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 22 einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: MID-Abhängigkeiten reproduzierbar installieren
        shell: bash
        run: npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps

      # Coverage executes the same unit suite and fails on assertion errors.
      - name: Unit-Tests einmal mit V8-Coverage ausführen
        shell: bash
        run: npm run test:coverage

      - name: CI/CD-Effizienz- und Herkunftsregressionen (read-only)
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-release-timing-0985376.mjs scripts/test-release-train-plan-0985376.mjs scripts/test-source-gate-evidence-0985376.mjs
          node scripts/test-installer-sharding-0985193.mjs
          node scripts/test-installer-verification-budget-0985190.mjs
          node scripts/test-core-regression-isolated-matrix-0985354.mjs
          node scripts/test-install-main-race-09572.mjs

      - name: Coverage-Bericht sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-vitest-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  release-core-pilot:
    name: Draft installer Core 4-way pilot · ${{ matrix.shard }}
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 525 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'chatgpt/v0.9.85.376-release-efficiency'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [core-1/4, core-2/4, core-3/4, core-4/4]
    steps:
      - name: SHA-gebundenen Draft-Kandidaten lesen (keine Releaseberechtigung)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Node.js 22/npm-Cache installieren
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Reproduzierbare Dependencies installieren
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps
      - name: Python-Core-Datenabhängigkeiten installieren
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ruc/requirements-pages.txt
      - name: RUC-/GRIB-Core-Abhängigkeiten reproduzieren
        shell: bash
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check -r tools/ruc/requirements-pages.txt
      - name: Build und alle zugewiesenen Core-Regressionen ausführen
        shell: bash
        timeout-minutes: 17
        env:
          MID_REGRESSION_SHARD: ${{ matrix.shard }}
          MID_REGRESSION_JOBS: '2'
          VITE_METAR_PROXY_URL: ${{ vars.VITE_METAR_PROXY_URL }}
          VITE_ALERT_PROXY_URL: ${{ vars.VITE_ALERT_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_RADAR_PROXY_URL: ${{ vars.VITE_RADAR_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_WORKER_SAME_ORIGIN_PATH: ${{ vars.VITE_WORKER_SAME_ORIGIN_PATH || '/api/mid-worker' }}
          VITE_WORKER_FALLBACK_URLS: ${{ vars.VITE_WORKER_FALLBACK_URLS }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          set -euo pipefail
          npm run build
          npm run test:regressions
