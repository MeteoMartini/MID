name: MID RUC EPS advertised index guard QA (read-only)
on:
  push:
    branches:
      - chatgpt/v0.9.85.446-ruc-eps-advertised-guard-qa
permissions:
  contents: read
concurrency:
  group: ruc-eps-index-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: "${{ github.event.head_commit.message == 'test(ruc): P0 final QA gate' || github.event.head_commit.message == 'qa(ruc): assert historical partial EPS evidence and hard freshness cap' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact Stable/Main, source and workflow parity fail-closed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "b6526e7c5c24035bd1a75b87b77e7bb8e821c334"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/mid-stable" --jq .object.sha)" = "b6526e7c5c24035bd1a75b87b77e7bb8e821c334"
          git merge-base --is-ancestor "b6526e7c5c24035bd1a75b87b77e7bb8e821c334" HEAD
          cmp ci/github/workflows/mid-ruc-eps-advertised-index-qa.yml .github/workflows/mid-ruc-eps-advertised-index-qa.yml
          test "$(git hash-object tools/ruc/check_ruc_schedule_guard.py)" = "604515f696ba377d408098a57dbaf2c6324ca1bb"
          test "$(git hash-object tools/ruc/test_ruc_schedule_guard.py)" = "326cad72b591aab17b69c8e36c58c5474df80022"
          test "$(git hash-object tools/ruc/probe_ruc_eps_advertised_live.py)" = "6d2360a9652d0aac1cf22b591e227c02028f9a60"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
      - name: Unchanged Scheduler plus bounded EPS20 negative evidence and watchdog
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/ruc/check_ruc_schedule_guard.py tools/ruc/test_ruc_schedule_guard.py
          python tools/ruc/test_ruc_schedule_guard.py
          node scripts/test-ruc-schedule-catchup-09745.mjs
          node scripts/test-ruc-scheduler-watchdog-09751.mjs
          echo 'QA-only: no original GRIB/EPS source positive admission, no DWD full publication proof, no 168h SLO, no production writes.' >> "$GITHUB_STEP_SUMMARY"
      - name: Read-only live DWD EPS20 2-run 20-member index and wall-time admission
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/ruc/probe_ruc_eps_advertised_live.py
          python tools/ruc/probe_ruc_eps_advertised_live.py --runs 2026-11-07T20:00 2026-11-07T21:00
          echo 'Live DWD directory QA only: 2x20x28 hourly filename evidence; no GRIB headers/bitmap/values, first availability timestamp, publishing or 168h client SLO' >> "$GITHUB_STEP_SUMMARY"
