name: MID RUC P1-P5 censored evidence QA (PR read-only)
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'tools/ruc/ruc_p1p5_censor_audit.py'
      - 'tools/ruc/ruc_p1_original_native_values_probe.py'
      - 'tools/ruc/test_ruc_p1_original_native_values_probe.py'
      - 'tools/ruc/ruc_observer_artifact_bundle.py'
      - 'tools/ruc/test_ruc_observer_artifact_bundle.py'
      - 'tools/ruc/ruc_github_observer_collect.py'
      - 'tools/ruc/test_ruc_github_observer_collect.py'
      - 'ci/github/workflows/mid-ruc-observer-evidence-archive.yml'
      - '.github/workflows/mid-ruc-observer-evidence-archive.yml'
      - 'tools/ruc/test_ruc_p1p5_censor_audit.py'
      - 'tools/ruc/ruc_p3_timing_audit.py'
      - 'tools/ruc/ruc_data_driven_policy.py'
      - 'tools/ruc/test_ruc_data_driven_policy.py'
      - 'tools/ruc/ruc_observer_execution_status.py'
      - 'tools/ruc/test_ruc_observer_execution_status.py'
      - 'tools/ruc/test_ruc_observer_release_drift_workflow.py'
      - 'tools/ruc/ruc_fast_lane_producer.py'
      - 'tools/ruc/ruc_fast_pointer_staging.py'
      - 'tools/ruc/ruc_fast_run_selector.py'
      - 'tools/ruc/test_ruc_fast_lane_producer.py'
      - 'tools/ruc/test_ruc_fast_pointer_staging.py'
      - 'tools/ruc/test_ruc_fast_run_selector.py'
      - 'ci/github/workflows/mid-ruc-fast-lane-qualification.yml'
      - '.github/workflows/mid-ruc-fast-lane-qualification.yml'
      - 'ci/github/workflows/mid-ruc-availability-observer.yml'
      - '.github/workflows/mid-ruc-availability-observer.yml'
      - 'tools/ruc/test_ruc_p3_timing_audit.py'
      - 'package.json'
      - 'package-lock.json'
      - 'MID_BASELINE.json'
      - 'contracts/index.json'
      - 'RELEASE_NOTES.md'
      - 'MID_SOURCE_OF_TRUTH.md'
      - 'ci/github/workflows/mid-ruc-p1p5-evidence-qa.yml'
      - '.github/workflows/mid-ruc-p1p5-evidence-qa.yml'

permissions:
  contents: read

concurrency:
  group: mid-ruc-p1p5-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  censored-evidence-qa:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'chatgpt/v') || startsWith(github.head_ref, 'codex/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Exact untrusted PR source checkout, no credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm exact head and workflow mirror
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          cmp ci/github/workflows/mid-ruc-p1p5-evidence-qa.yml .github/workflows/mid-ruc-p1p5-evidence-qa.yml
      - name: Prepare Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Node.js for canonical version and workflow equivalence checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
      - name: Exercise 168-hour censoring and negative observations
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ruc/ruc_p1p5_censor_audit.py tools/ruc/test_ruc_p1p5_censor_audit.py tools/ruc/ruc_p3_timing_audit.py tools/ruc/test_ruc_p3_timing_audit.py
          python3 tools/ruc/test_ruc_p1p5_censor_audit.py -v
          python3 tools/ruc/test_ruc_observer_artifact_bundle.py -v
          python3 tools/ruc/test_ruc_github_observer_collect.py -v
          cmp ci/github/workflows/mid-ruc-observer-evidence-archive.yml .github/workflows/mid-ruc-observer-evidence-archive.yml
          python3 tools/ruc/test_ruc_p3_timing_audit.py -v
          python3 tools/ruc/test_ruc_observer_execution_status.py -v
          python3 tools/ruc/test_ruc_observer_release_drift_workflow.py -v
          python3 tools/ruc/test_ruc_data_driven_policy.py -v
          echo 'Directory samples and public pointer metadata only. No GRIB/EPS, DWD first publication, app-client, P95 SLO, or production trigger authorization.' >> "$GITHUB_STEP_SUMMARY"
      - name: Native Fast-Lane-P2 fachlich ohne DWD-Download testen
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r tools/ruc/requirements-pages.txt
          python3 -m py_compile tools/ruc/ruc_p1_original_native_values_probe.py tools/ruc/test_ruc_p1_original_native_values_probe.py
          python3 tools/ruc/test_ruc_p1_original_native_values_probe.py -v
          python3 tools/ruc/test_ruc_fast_run_selector.py -v
          python3 tools/ruc/test_ruc_fast_lane_producer.py -v
          python3 tools/ruc/test_ruc_fast_pointer_staging.py -v
          cmp ci/github/workflows/mid-ruc-fast-lane-qualification.yml .github/workflows/mid-ruc-fast-lane-qualification.yml
          cmp ci/github/workflows/mid-ruc-availability-observer.yml .github/workflows/mid-ruc-availability-observer.yml
          echo 'AP1c-a original GRIB probe offline tests only; no actual DWD downloads, 3-run EPS20 verification or 168h SLO.' >> "$GITHUB_STEP_SUMMARY"
          echo 'P2 is native offline QA only. No production pointer, release, actual DWD GRIB retrieval or app adoption.' >> "$GITHUB_STEP_SUMMARY"
      - name: AP1c-b bounded one-real-DWD-original smoke (NO full-run authorization)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.number == 684 &&
          github.event.pull_request.draft == true
        timeout-minutes: 3
        shell: bash
        env:
          PYTHONPATH: tools/ruc
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from scientific_grib_contract_probe import targets
          from ruc_p1_original_native_values_probe import safe_fetch, examine, MAX_FILE_BYTES

          # The live Pages manifest selects a real RUC run; it is NOT original-file evidence.
          request = urllib.request.Request(
              'https://midwx.app/ruc/latest.json',
              headers={'Cache-Control': 'no-cache', 'User-Agent': 'MID-P1c-readonly-smoke/1'},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 200:
                  raise ValueError('public Pages run selector not OK')
              manifest_raw = response.read(1_000_001)
          if len(manifest_raw) > 1_000_000:
              raise ValueError('public Pages run selector exceeds bound')
          manifest = json.loads(manifest_raw)
          run_text = manifest.get('run')
          if not isinstance(run_text, str) or not re.fullmatch(
              r'20\d{2}-\d{2}-\d{2}T\d{2}:00', run_text
          ):
              raise ValueError('untrusted or malformed public RUC run selector')
          if (manifest.get('pointCount') != 542040
              or manifest.get('eps', {}).get('memberCount') != 20
              or len(manifest.get('eps', {}).get('times', [])) != 28
              or len(manifest.get('deterministic', {}).get('times', [])) != 28):
              raise ValueError('run selector does not certify expected 27-hour layout')
          run = datetime.strptime(run_text, '%Y-%m-%dT%H:%M').replace(tzinfo=timezone.utc)
          age = datetime.now(timezone.utc) - run
          if not timedelta(0) <= age <= timedelta(hours=24):
              raise ValueError('public RUC selector stale or future')
          inventory = targets(run_text, hours=27, rapid_hours=6, members=20)
          if len(inventory) != 1000:
              raise ValueError('unexpected required original DWD inventory size')
          selected = [
              row for row in inventory
              if row['parameter'] == 'TOT_PREC' and row['member'] == 1
                 and row['url'].endswith('/s/PT006H00M.grib2')
          ]
          if len(selected) != 1:
              raise ValueError('original EPS01 +06h specimen not unique')
          row, data, before, after = safe_fetch(selected[0])
          if len(data) > MAX_FILE_BYTES:
              raise ValueError('DWD sample exceeds 40MB original download budget')
          record = examine(row, data, before, after, run)
          record.pop('_normalizedValues')
          if record['memberId'] != 1 or record['requestedLeadSeconds'] != 21600:
              raise ValueError('sample member/forecast lead mismatch')
          if not record['missingMaskConsistent'] or not record['originalValuesVerified']:
              raise ValueError('original DWD value/bitmap verification failed')
          report = {
              'schema': 'mid.ruc.ap1c.original-one-file-smoke.v1',
              'prHeadSha': '9853de70b720318b9e57ca1d60c7bd5dbb69db21',
              'selectorRunUtc': run_text,
              'expectedOriginalFileCount': 1000,
              'realOriginalFilesChecked': 1,
              'full27hOriginalScopeVerified': False,
              'all20EpsMembersVerified': False,
              'full168hObserved': False,
              'sourcePublicationLatencyP95Authorized': False,
              'clientAdoptionVerified': False,
              'productionSloAuthorized': False,
              'publicationAuthorized': False,
              'originalSample': record,
          }
          encoded = (json.dumps(report, sort_keys=True, indent=2, allow_nan=False) + '\n').encode()
          Path('ap1c-one-original-smoke.json').write_bytes(encoded)
          print('ONE_REAL_ORIGINAL_FILE', json.dumps({
              'run': run_text, 'memberId': 1, 'leadSeconds': 21600,
              'originalBytes': len(data), 'originalSha256': hashlib.sha256(data).hexdigest(),
              'reportSha256': hashlib.sha256(encoded).hexdigest(),
              'fullP1Verified': False,
          }, sort_keys=True))
          PY
          echo 'One genuine DWD +06h/EPS01 sample only, max 40 MB, no complete EPS20 run or P95/production authorization.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive SHA-grounded one-original smoke JSON (no raw GRIB)
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.number == 684 &&
          github.event.pull_request.draft == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-ap1c-one-original-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ap1c-one-original-smoke.json
          retention-days: 7
          if-no-files-found: ignore
      - name: RUC release mirrors and exact canonical workflow sync are clean
        shell: bash
        run: |
          set -euo pipefail
          npm run sync-version
          npm run sync:github-workflows
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          version=json.loads(Path('package.json').read_text())['version']
          parts=tuple(int(part) for part in version.split('.'))
          assert len(parts)==4 and parts >= (0,9,85,398), 'RUC evidence QA requires the originally released .398 contract or newer'
          assert json.loads(Path('MID_BASELINE.json').read_text())['releaseVersion'] == version
          assert json.loads(Path('contracts/index.json').read_text())['releaseVersion'] == version
          assert len(json.loads(Path('MID_BASELINE.json').read_text())['requiredRegressionTests']) >= 1059
          PY
