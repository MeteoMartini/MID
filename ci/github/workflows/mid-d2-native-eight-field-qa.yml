name: MID D2 native eight-kind physical/NoData contract (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/mid-ruc-preprocess.yml'
      - 'ci/github/workflows/mid-ruc-preprocess.yml'
      - '.github/workflows/mid-d2-original-release-approval.yml'
      - 'ci/github/workflows/mid-d2-original-release-approval.yml'
      - 'tools/ruc/augment_compressed_native_d2.py'
      - 'tools/ruc/select_protected_d2_approval.py'
      - 'tools/ruc/test_augment_compressed_native_d2.py'
      - 'tools/ruc/test_select_protected_d2_approval.py'
      - 'tools/ruc/approve_d2_originals_protected.py'
      - '.github/workflows/mid-d2-native-eight-field-qa.yml'
      - 'ci/github/workflows/mid-d2-native-eight-field-qa.yml'
  push:
    branches:
      - chatgpt/v0.9.85.412-d2-ruc-native-qa-from411
    paths:
      - '.github/workflows/mid-d2-native-eight-field-qa.yml'
      - 'tools/ruc/d2_native_full_fields.py'
      - 'tools/ruc/test_d2_native_full_fields.py'
      - 'tools/ruc/d2_native_eight_bundle.py'
      - 'tools/ruc/admit_d2_native_pages.py'
      - 'tools/ruc/test_admit_d2_native_pages.py'
      - 'tools/ruc/prepare_ruc_pages.py'
      - 'tools/ruc/stage_d2_native_full_domain.py'
      - 'tools/ruc/native_d2_contours.py'
      - 'tools/ruc/test_stage_d2_native_full_domain.py'
      - 'tools/ruc/d2_tot_prec_quantization_qa.py'
      - 'tools/ruc/test_d2_tot_prec_quantization_qa.py'
      - 'tools/ruc/test_d2_native_eight_bundle.py'
permissions:
  contents: read
concurrency:
  group: mid-d2-native-eight-field-qa
  cancel-in-progress: false
jobs:
  contract:
    name: D2 original eight-field dimensional/physics/mask regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Load exact source SHA without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install numeric requirement only
        run: python -m pip install --disable-pip-version-check -r tools/ruc/requirements-pages.txt
      - name: Fail closed on original native eight-kind and NoData regressions
        run: |
          python -m unittest discover -s tools/ruc -p test_d2_native_full_fields.py -v
          python -m unittest discover -s tools/ruc -p test_d2_native_eight_bundle.py -v
          python -m unittest discover -s tools/ruc -p test_d2_tot_prec_quantization_qa.py -v
          python -m unittest discover -s tools/ruc -p test_stage_d2_native_full_domain.py -v
          python -m unittest discover -s tools/ruc -p test_admit_d2_native_pages.py -v
          python tools/ruc/test_prepare_ruc_pages.py
      - name: Signed D2 + RUC Pages integration contract (offline only, no publish)
        run: |
          python -m unittest discover -s tools/ruc -p test_d2_release_attestation.py -v
          python -m unittest discover -s tools/ruc -p test_approve_d2_originals_protected.py -v
          python -m unittest discover -s tools/ruc -p test_d2_protected_signer_workflow.py -v
          python -m unittest discover -s tools/ruc -p test_select_protected_d2_approval.py -v
          python -m unittest discover -s tools/ruc -p test_augment_compressed_native_d2.py -v
