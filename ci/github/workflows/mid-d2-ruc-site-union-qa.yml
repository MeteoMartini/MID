name: MID D2 + 27h/EPS20 + Fast physical Pages site union (read-only)
on:
  push:
    branches:
      - chatgpt/v0.9.85.412-p0-p4-consolidated-preflight
    paths:
      - '.github/workflows/mid-d2-ruc-site-union-qa.yml'
      - 'ci/github/workflows/mid-d2-ruc-site-union-qa.yml'
      - 'tools/ruc/admit_d2_native_pages.py'
      - 'tools/ruc/prepare_ruc_pages.py'
      - 'tools/ruc/d2_release_attestation.py'
      - 'tools/ruc/approve_d2_originals_protected.py'
      - 'tools/ruc/ruc_fast_pages_overlay.py'
      - 'tools/ruc/ruc_fast_pages_chunker.py'
      - 'tools/ruc/ruc_fast_cas.mjs'
      - 'tools/ruc/ruc_fast_lane_producer.py'
      - 'tools/ruc/d2_native_full_fields.py'
      - 'tools/ruc/d2_native_eight_bundle.py'
      - 'tools/ruc/stage_d2_native_full_domain.py'
      - 'src/nativeD2FullDomain.ts'
      - 'src/nativeModelFields.ts'
      - 'tests/unit/native-d2-original-binary-readback.test.ts'
permissions:
  contents: read
  actions: read
concurrency:
  group: mid-d2-ruc-real-union-qa
  cancel-in-progress: false
jobs:
  prove:
    name: Immutable real original D2 and RUC Fast physical site; no publication
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - name: Load exact new combined source; no credentials stored
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check both trusted GitHub run heads, successful runs and detached artifact digests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = 9bf44c3354f98937fa058aac5d6dceb5895d29e5
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/mid-stable" --jq .object.sha)" = 9bf44c3354f98937fa058aac5d6dceb5895d29e5
          cmp ci/github/workflows/mid-d2-ruc-site-union-qa.yml .github/workflows/mid-d2-ruc-site-union-qa.yml
          # A successful historical artifact is not proof of a modified current producer.
          # Require GitHub's authenticated original-source blob SHA for every producer
          # whose bytes created the pinned original data. On drift, rebuild the
          # original-data pilot; never bless stale artifacts on the new source.
          for spec in \
            'a0d5cee0933861f3f6507a0102a9b1f312be55bf tools/ruc/ruc_fast_lane_producer.py' \
            'a0d5cee0933861f3f6507a0102a9b1f312be55bf tools/ruc/ruc_fast_pages_chunker.py' \
            'a0d5cee0933861f3f6507a0102a9b1f312be55bf tools/ruc/ruc_fast_pages_overlay.py' \
            'bb8a63ea8f5e7c45b3b6bc10804b92b99d8ac74c tools/ruc/d2_native_full_fields.py' \
            'bb8a63ea8f5e7c45b3b6bc10804b92b99d8ac74c tools/ruc/d2_native_eight_bundle.py' \
            'bb8a63ea8f5e7c45b3b6bc10804b92b99d8ac74c tools/ruc/stage_d2_native_full_domain.py'; do
            read -r original_sha source_path <<< "$spec"
            original_blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/$source_path?ref=$original_sha" --jq .sha)"
            current_blob="$(git hash-object "$source_path")"
            if [[ "$original_blob" != "$current_blob" ]]; then
              echo "::error file=$source_path::Original DWD producer changed; refresh the authentic original-data artifact before union admission."
              exit 1
            fi
          done
          echo 'All six original DWD producer blobs match the authenticated artifact-source commits.'
          for spec in \
            '41433049114 13135434899 bb8a63ea8f5e7c45b3b6bc10804b92b99d8ac74c mid-d2-native-shadow-41433049114-1 sha256:61f01c505a36b81f4e37b216a5cb8a9b6030d1e820f72af6ed14c90d5228b8ea' \
            '41501426005 13168948161 a0d5cee0933861f3f6507a0102a9b1f312be55bf mid-ruc-joint-site-inactive-41501426005-1 sha256:c5607db2d7685e92b49fce4801c536a6119260062e5835877e5ea8eb718b9b68'; do
            read -r run_id artifact_id source_sha name digest <<< "$spec"
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
            test "$(jq -r .head_sha <<< "$run")" = "$source_sha"
            test "$(jq -r .conclusion <<< "$run")" = success
            test "$(jq -r .status <<< "$run")" = completed
            test "$(jq -r .name <<< "$artifact")" = "$name"
            test "$(jq -r .digest <<< "$artifact")" = "$digest"
            test "$(jq -r .expired <<< "$artifact")" = false
            test "$(jq -r .workflow_run.head_sha <<< "$artifact")" = "$source_sha"
          done
          echo 'External SHA/digest metadata checked against GitHub Actions, not candidate files.'
      - name: Fetch exact immutable RUC 27h EPS20 and authentic native Fast joint artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: 41501426005
          artifact-ids: 13168948161
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: .joint-original
      - name: Fetch exact immutable full-native DWD ICON-D2 72-field candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: 41433049114
          artifact-ids: 13135434899
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: .d2-original
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Physically assemble independent original objects; verify every D2 SHA/time/mask and full RUC unchanged
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip,hashlib,json,os,shutil
          from pathlib import Path
          orig=Path('.joint-original');native=Path('.d2-original')
          def files(root):
              out=[p for p in root.rglob('*') if p.is_file()]
              if not out or any(p.is_symlink() for p in root.rglob('*')):
                  raise ValueError('empty/symlinked or untrusted original artifact')
              return out
          def digest(path):return hashlib.sha256(path.read_bytes()).hexdigest()
          full=files(orig);d2=files(native)
          latest=[p for p in full if p.name=='latest.json' and p.parent.name=='ruc']
          if len(latest)!=1:raise ValueError('exact original RUC latest pointer absent or ambiguous')
          ruc=latest[0];initial=digest(ruc);meta=json.loads(ruc.read_bytes())
          if (meta.get('schema')!='mid.dwd.ruc.grid.v2' or
              meta.get('storageProfile')!='pages-lossless-v1' or
              meta.get('pointCount')!=542040 or
              len(meta.get('deterministic',{}).get('times',[]))!=28 or
              meta.get('eps',{}).get('memberCount')!=20 or
              len(meta.get('eps',{}).get('times',[]))!=28):
              raise ValueError('real original complete +27h/20EPS signature missing')
          if not any('/ruc/fast/' in '/'+p.as_posix()+'/' for p in full):
              raise ValueError('joint Fast overlay missing')
          indexes=[p for p in d2 if p.name=='index.json']
          if len(indexes)!=1:raise ValueError('D2 index absent or ambiguous')
          idx=indexes[0];entry=json.loads(idx.read_bytes())
          kinds={'temperature','pressure','wind','gust','cloud','thetae','sigwx','precipitation'}
          leads={1,2,3,4,5,6,12,24,48}
          if (entry.get('schema')!='mid.icon-d2.native-fields.v2' or
              entry.get('productionApproved') is not False or
              entry.get('nativePoints')!=542040 or
              set(entry.get('products',{}))!=kinds):
              raise ValueError('independent original 72-field D2 staging contract broken')
          expected_names={'index.json'};seen=0;missing=0
          for kind,record in entry['products'].items():
              fr=record.get('frames')
              if not isinstance(fr,list) or {x['hour'] for x in fr}!=leads or len(fr)!=9:
                  raise ValueError('D2 native 9x8 coverage incomplete')
              for row in fr:
                  name=row['file']
                  if Path(name).name!=name or name in expected_names:
                      raise ValueError('unsafe or duplicate D2 immutable file')
                  expected_names.add(name)
                  data=idx.parent/name
                  raw=data.read_bytes()
                  if len(raw)!=row['bytes'] or hashlib.sha256(raw).hexdigest()!=row['sha256']:
                      raise ValueError('DWD original native transport digest drift')
                  field_bytes=gzip.decompress(raw)
                  if len(field_bytes)!=row['decodedBytes'] or len(field_bytes)>12_000_000:
                      raise ValueError('D2 field decoded budget drift')
                  field=json.loads(field_bytes)
                  if (field.get('productionApproved') is not False or
                      field.get('schema')!='mid.icon-d2.native-field.v2' or
                      field.get('kind')!=kind or
                      field.get('sourceInventorySha256')!=entry.get('sourceInventorySha256') or
                      field.get('run')!=entry.get('run')):
                      raise ValueError('original source provenance/pilot approval drift')
                  values=field.get('values')
                  if not isinstance(values,list) or not any(v is not None for v in values):
                      raise ValueError('D2 original field missing/empty')
                  uncertainty=field.get('negativePackingUncertainNoDataCells',0)
                  if kind=='precipitation':
                      count=sum(v is None for v in values);missing+=count
                      if type(uncertainty) is not int or uncertainty>count:
                          raise ValueError('original packing uncertainty not NoData')
                      if any(v is not None and v<0 for v in values):
                          raise ValueError('negative precipitation illegally truncated')
                  seen+=1
          if seen!=72 or {p.name for p in d2}!=expected_names:
              raise ValueError('72 unique native D2 objects were not recovered')
          # Materialize the actual union; no synthetic or separate-budget arithmetic.
          out=Path('.physical-union');shutil.copytree(orig,out,symlinks=False)
          namespace=out/'ruc'/'runs'/'unapproved_d2_original'/'model-fields-native'
          if namespace.exists():raise ValueError('existing Pages target collision')
          namespace.mkdir(parents=True)
          for f in d2:shutil.copy2(f,namespace/f.name)
          if digest(out/'ruc'/'latest.json')!=initial:
              raise ValueError('canonical original RUC root was modified')
          original_bytes=sum(p.stat().st_size for p in full)
          d2_bytes=sum(p.stat().st_size for p in d2)
          actual_bytes=sum(p.stat().st_size for p in files(out))
          if actual_bytes!=original_bytes+d2_bytes or actual_bytes>=900_000_000:
              raise ValueError('physical Pages union exceeds 900MB or altered bytes')
          print(json.dumps({'schema':'mid.ruc.d2-real-site-readonly.v1',
              'full27hEPS20Retained':True,'d2OriginalFramesVerified':seen,
              'originalRucBytes':original_bytes,'d2NativeBytes':d2_bytes,
              'actualPhysicalUnionBytes':actual_bytes,'remainingBudgetBytes':900_000_000-actual_bytes,
              'd2OriginalPrecipitationMissingCells':missing,
              'originalLatestSha256':initial,'productionApproved':False,
              'pagesPublished':False,'webIosWidgetExportValidated':False,
              'externalApprovalStillRequired':True},sort_keys=True))
          PY
          echo 'Original full RUC/20EPS and Fast + 72 native D2 fields fit one *inactive* physical Pages tree; no source-publish permission is granted.' >> "$GITHUB_STEP_SUMMARY"
      - name: Pinned Node 22 for authentic D2 binary client readback
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Reproducible web test dependencies
        run: npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps
      - name: Exact 72 source field bytes through browser TypeScript admission (never activate)
        env:
          MID_D2_ORIGINAL_SITE_PATH: .d2-original
        run: npx vitest run tests/unit/native-d2-original-binary-readback.test.ts


      - name: Archive real 27h 20EPS Fast and all 72 ICON-D2 originals together – inactive only
        # One user-retrievable original-data QA bundle, NOT production data.
        # All original SHA, physical-budget and browser decoder checks above
        # must pass before this archive can exist.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-d2-ruc-combined-original-inactive-${{ github.run_id }}-${{ github.run_attempt }}
          path: .physical-union/
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true
          retention-days: 1
