name: Install MID release and deploy
run-name: MID-Release aus ZIP installieren und veröffentlichen

on:
  push:
    branches:
      - main
    paths:
      - MID-professional-replacement.zip
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mid-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install_build:
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    name: MID installieren, prüfen und bauen
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Repository laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Release-ZIP sicher entpacken
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail

          archive="MID-professional-replacement.zip"
          target="/tmp/mid-new"

          if [ ! -f "$archive" ]; then
            echo "::error::${archive} wurde nicht im Repository-Hauptverzeichnis gefunden."
            exit 1
          fi

          rm -rf "$target"
          mkdir -p "$target"

          ARCHIVE="$archive" TARGET="$target" python3 - <<'PY'
          import os
          import stat
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path(os.environ['ARCHIVE'])
          target = Path(os.environ['TARGET']).resolve()

          with ZipFile(archive) as zip_file:
              for entry in zip_file.infolist():
                  relative = Path(entry.filename)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit(f'Unsicherer ZIP-Pfad: {entry.filename}')
                  mode = entry.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'Links sind im Release-ZIP nicht zulässig: {entry.filename}')
                  destination = (target / relative).resolve()
                  if target != destination and target not in destination.parents:
                      raise SystemExit(f'ZIP-Pfad verlässt das Zielverzeichnis: {entry.filename}')
              zip_file.extractall(target)
          PY

          for required in package.json package-lock.json MID_BASELINE.json MID_SOURCE_OF_TRUTH.md src worker public; do
            if [ ! -e "$target/$required" ]; then
              echo "::error::Im Hauptverzeichnis der ZIP fehlt: ${required}"
              exit 1
            fi
          done

          echo "Release-ZIP wurde sicher entpackt und strukturell geprüft."

      - name: Alte MID-Version vollständig ersetzen
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail

          # node_modules ist eine lokale Installationsausgabe und darf nie Teil des
          # Release-Spiegels oder des Repository-Inhalts sein. Alte versehentlich
          # versionierte Bestände werden vor dem inhaltlichen Vergleich entfernt.
          rm -rf node_modules

          rsync -a \
            --delete \
            --checksum \
            --itemize-changes \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules' \
            --exclude='MID-professional-replacement.zip' \
            /tmp/mid-new/ ./

          if ! diff -qr \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='MID-professional-replacement.zip' \
            /tmp/mid-new/ ./; then
            echo "::error::Das entpackte MID-Release wurde nicht vollständig in den Arbeitsbaum übernommen."
            exit 1
          fi

          rm -f MID-professional-replacement.zip
          echo "MID-Projektdateien wurden inhaltlich vollständig ersetzt."


      - name: Node.js 22 mit npm-Cache einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Lockfile und npm-Registry prüfen
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail

          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 2
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 3000
          npm config set fetch-retry-maxtimeout 15000
          npm config set fetch-timeout 60000

          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const invalid = [];
          for (const [name, entry] of Object.entries(lock.packages ?? {})) {
            const resolved = entry && typeof entry === 'object' ? entry.resolved : undefined;
            if (typeof resolved !== 'string') continue;
            if (/internal\.api\.openai\.org|applied-caas-gateway|localhost|127\.0\.0\.1/i.test(resolved)) {
              invalid.push(`${name || '(root)'}: ${resolved}`);
            }
          }
          if (invalid.length) {
            console.error('Nicht öffentlich erreichbare Paket-URLs im Lockfile:\n' + invalid.join('\n'));
            process.exit(1);
          }
          console.log('Lockfile enthält keine internen oder lokalen Paket-URLs.');
          NODE

          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Registry: $(npm config get registry)"

      - name: Abhängigkeiten reproduzierbar installieren
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          npm ci \
            --no-audit \
            --no-fund \
            --prefer-offline \
            --legacy-peer-deps \
            --loglevel=notice


      - name: Produktionsabhängigkeiten auf hohe Risiken prüfen
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          npm run audit:dependencies

      - name: Produktionsbuild und Regressionstests ausführen
        shell: bash
        timeout-minutes: 15
        env:
          VITE_METAR_PROXY_URL: ${{ vars.VITE_METAR_PROXY_URL }}
          VITE_ALERT_PROXY_URL: ${{ vars.VITE_ALERT_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_RADAR_PROXY_URL: ${{ vars.VITE_RADAR_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_WORKER_SAME_ORIGIN_PATH: ${{ vars.VITE_WORKER_SAME_ORIGIN_PATH }}
          VITE_WORKER_FALLBACK_URLS: ${{ vars.VITE_WORKER_FALLBACK_URLS }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          set -euo pipefail
          npm run verify

      - name: Neue MID-Version committen
        id: commit
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Ein laufender GitHub-Actions-App-Token darf keine Workflowdateien
          # selbst aktualisieren. .github bleibt deshalb grundsätzlich außerhalb
          # des automatischen Release-Commits. Kanonische Workflow-Patches liegen
          # unter ci/github und werden nur explizit synchronisiert.
          git reset -- .github >/dev/null 2>&1 || true
          git add -A -- . ':(exclude).github/**'

          if ! git diff --quiet -- .github; then
            echo "::notice::.github enthält lokale Änderungen, die bewusst nicht in den automatischen Release-Commit aufgenommen werden."
          fi

          if git diff --cached --quiet; then
            echo "::error::Das Release-ZIP führte zu keinen installierbaren Änderungen."
            exit 1
          fi

          version=$(node -p "require('./package.json').version")
          git commit -m "Install MID v${version}"
          git push origin HEAD:main

          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Produktionsbuild für Pages hochladen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    name: MID auf GitHub Pages veröffentlichen
    needs: install_build
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
      statuses: write
    concurrency:
      group: mid-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub-Pages-Deployment ausführen
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Erfolgreichen Release-Commit laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.install_build.outputs.commit_sha }}
          fetch-depth: 0

      - name: Letzten erfolgreichen Stand als stabile MID-Basis markieren
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/heads/mid-stable


      - name: Finalen Stable-SHA verifizieren und Qualitätsstatus setzen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          stable_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote --heads origin refs/heads/mid-stable | awk '{print $1}')"
          if [ "$remote_sha" != "$stable_sha" ]; then
            echo "::error::mid-stable zeigt auf ${remote_sha:-<leer>} statt auf den geprüften Release ${stable_sha}."
            exit 1
          fi
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${stable_sha}" \
            -f state='success' \
            -f context='MID / stable-release-quality' \
            -f description='Build, Dependency-Audit, Regressionen und Pages-Deployment bestanden' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
