name: Install MID release and deploy
run-name: MID-Release aus ZIP installieren und veröffentlichen

on:
  push:
    branches:
      - main
    paths:
      - MID-professional-replacement.zip
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Interne Release-Bot-Pushes werden vom Job ohnehin übersprungen und dürfen
  # einen ausdrücklich gestarteten Installerlauf nicht per Concurrency abbrechen.
  group: mid-install-${{ github.ref }}-${{ github.event_name == 'push' && github.actor == 'mid-release-bot-meteomartini[bot]' && 'internal-bot-push' || 'release' }}
  cancel-in-progress: true

jobs:
  prepare_release:
    name: Release-ZIP prüfen und immutable Snapshot vorbereiten
    if: github.event_name == 'workflow_dispatch' || (github.actor != 'github-actions[bot]' && github.actor != 'mid-release-bot-meteomartini[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      snapshot_sha: ${{ steps.snapshot.outputs.snapshot_sha }}
      snapshot_id: ${{ steps.snapshot_upload.outputs.artifact-id }}
    steps:
      - name: Repository laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Normalpfad: nur der eventgebundene Release-Snapshot; Historie wird bei einem echten main-Race gezielt nachgeladen.
          fetch-depth: 1
          persist-credentials: false

      - name: Release-ZIP sicher entpacken
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail

          archive="MID-professional-replacement.zip"
          target="/tmp/mid-new"

          if [ ! -f "$archive" ]; then
            echo "::error::${archive} wurde nicht im Repository-Hauptverzeichnis gefunden."
            exit 1
          fi

          rm -rf "$target"
          mkdir -p "$target"

          ARCHIVE="$archive" TARGET="$target" python3 - <<'PY'
          import hashlib
          import os
          import stat
          from pathlib import Path
          from zipfile import ZipFile, is_zipfile

          archive = Path(os.environ['ARCHIVE'])
          target = Path(os.environ['TARGET']).resolve()
          size = archive.stat().st_size
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          print(f'Release-ZIP: {size} Byte · SHA-256 {digest}')
          if size == 0:
              raise SystemExit('Release-ZIP ist leer (0 Byte)')
          if not is_zipfile(archive):
              raise SystemExit('Release-Datei ist kein gültiges ZIP')

          with ZipFile(archive) as zip_file:
              corrupt = zip_file.testzip()
              if corrupt is not None:
                  raise SystemExit(f'Release-ZIP enthält einen beschädigten Eintrag: {corrupt}')
              for entry in zip_file.infolist():
                  relative = Path(entry.filename)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit(f'Unsicherer ZIP-Pfad: {entry.filename}')
                  mode = entry.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'Links sind im Release-ZIP nicht zulässig: {entry.filename}')
                  destination = (target / relative).resolve()
                  if target != destination and target not in destination.parents:
                      raise SystemExit(f'ZIP-Pfad verlässt das Zielverzeichnis: {entry.filename}')
              zip_file.extractall(target)
          PY

          for required in package.json package-lock.json MID_BASELINE.json MID_SOURCE_OF_TRUTH.md src worker public; do
            if [ ! -e "$target/$required" ]; then
              echo "::error::Im Hauptverzeichnis der ZIP fehlt: ${required}"
              exit 1
            fi
          done

          echo "Release-ZIP wurde sicher entpackt und strukturell geprüft."

      - name: Alte MID-Version vollständig ersetzen
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail

          # node_modules ist eine lokale Installationsausgabe und darf nie Teil des
          # Release-Spiegels oder des Repository-Inhalts sein. Alte versehentlich
          # versionierte Bestände werden vor dem inhaltlichen Vergleich entfernt.
          rm -rf node_modules

          rsync -a \
            --delete \
            --checksum \
            --itemize-changes \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules' \
            --exclude='MID-professional-replacement.zip' \
            /tmp/mid-new/ ./

          if ! diff -qr \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='MID-professional-replacement.zip' \
            /tmp/mid-new/ ./; then
            echo "::error::Das entpackte MID-Release wurde nicht vollständig in den Arbeitsbaum übernommen."
            exit 1
          fi

          rm -f MID-professional-replacement.zip
          echo "MID-Projektdateien wurden inhaltlich vollständig ersetzt."


      - name: SHA-gebundenen Snapshot packen
        id: snapshot
        shell: bash
        run: node tools/ci/release-snapshot.mjs pack /tmp/mid-snapshot
      - name: Unveränderlichen Snapshot übertragen
        id: snapshot_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mid-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/mid-snapshot/
          if-no-files-found: error
          retention-days: 1

  verify_core:
    name: Release-Core, Build, Audit und iOS prüfen
    needs: prepare_release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      snapshot_sha: ${{ steps.snapshot.outputs.snapshot_sha }}
      snapshot_id: ${{ steps.snapshot_upload.outputs.artifact-id }}
    steps:
      - name: Eventgebundenen Quellstand laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Unveränderliche Produzenten-Artefakt-ID prüfen
        shell: bash
        env:
          MID_ARTIFACT_ID: ${{ needs.prepare_release.outputs.snapshot_id }}
        run: node -e "if(!/^[1-9][0-9]*$/.test(process.env.MID_ARTIFACT_ID||''))throw Error('Missing producer artifact ID')"
      - name: Snapshot dieses Laufs laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare_release.outputs.snapshot_id }}
          merge-multiple: true
          digest-mismatch: error
          path: /tmp/mid-snapshot
      - name: Event, Manifest, Archiv und alle Dateien verifizieren
        shell: bash
        env:
          MID_SNAPSHOT_SHA: ${{ needs.prepare_release.outputs.snapshot_sha }}
        run: node tools/ci/release-snapshot.mjs restore /tmp/mid-snapshot
      - name: Node.js 22 mit npm-Cache einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Lockfile und npm-Registry prüfen
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail

          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 2
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 3000
          npm config set fetch-retry-maxtimeout 15000
          npm config set fetch-timeout 60000

          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const invalid = [];
          for (const [name, entry] of Object.entries(lock.packages ?? {})) {
            const resolved = entry && typeof entry === 'object' ? entry.resolved : undefined;
            if (typeof resolved !== 'string') continue;
            if (/internal\.api\.openai\.org|applied-caas-gateway|localhost|127\.0\.0\.1/i.test(resolved)) {
              invalid.push(`${name || '(root)'}: ${resolved}`);
            }
          }
          if (invalid.length) {
            console.error('Nicht öffentlich erreichbare Paket-URLs im Lockfile:\n' + invalid.join('\n'));
            process.exit(1);
          }
          console.log('Lockfile enthält keine internen oder lokalen Paket-URLs.');
          NODE

          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Registry: $(npm config get registry)"

      - name: Abhängigkeiten reproduzierbar installieren
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2 3; do
            if npm ci \
              --no-audit \
              --no-fund \
              --prefer-offline \
              --legacy-peer-deps \
              --loglevel=notice; then
              installed=true
              break
            fi
            echo "::warning::npm ci fehlgeschlagen (Versuch ${attempt}/3). Bereinige node_modules und prüfe den Cache vor erneutem Versuch."
            rm -rf node_modules
            npm cache verify || true
            sleep $((attempt * 3))
          done
          if [ "$installed" != true ]; then
            echo "::error::npm ci konnte nach drei Versuchen nicht erfolgreich abgeschlossen werden."
            exit 1
          fi


      - name: Produktionsabhängigkeiten auf hohe Risiken prüfen
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          audited=false
          for attempt in 1 2 3; do
            if npm run audit:dependencies; then
              audited=true
              break
            fi
            echo "::warning::Dependency-Audit fehlgeschlagen (Versuch ${attempt}/3). Wiederhole nach kurzer Pause."
            sleep $((attempt * 3))
          done
          if [ "$audited" != true ]; then
            echo "::error::Dependency-Audit konnte nach drei Versuchen nicht erfolgreich abgeschlossen werden."
            exit 1
          fi

      - name: Produktionsbuild und Regressionstests ausführen
        shell: bash
        # Core plus vollständige isolierte Heavy-Matrix bilden zusammen das gesamte Inventar.
        timeout-minutes: 25
        env:
          MID_REGRESSION_SHARD: core
          VITE_METAR_PROXY_URL: ${{ vars.VITE_METAR_PROXY_URL }}
          VITE_ALERT_PROXY_URL: ${{ vars.VITE_ALERT_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_RADAR_PROXY_URL: ${{ vars.VITE_RADAR_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_WORKER_SAME_ORIGIN_PATH: ${{ vars.VITE_WORKER_SAME_ORIGIN_PATH || '/api/mid-worker' }}
          VITE_WORKER_FALLBACK_URLS: ${{ vars.VITE_WORKER_FALLBACK_URLS }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          set -euo pipefail
          npm run verify


      - name: Geprüften Web-Build in die Capacitor-iOS-Hülle übernehmen
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          ./node_modules/.bin/cap copy ios
          node scripts/test-cross-platform-ios-shell-09670.mjs
          node scripts/test-runtime-lifecycle-offline-resume-09701.mjs
          package_version="$(node -p "require('./package.json').version")"
          ios_web_version="$(node -p "require('./ios/App/App/public/version.json').version")"
          if [ "$ios_web_version" != "$package_version" ]; then
            echo "::error::Capacitor-iOS-Web-Bundle ${ios_web_version} != Release ${package_version}."
            exit 1
          fi

      - name: Laufzeitbericht ohne Freigabewirkung speichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mid-timings-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/mid-regression-timings.json
          if-no-files-found: warn
          retention-days: 7
      - name: SHA-gebundenen Snapshot packen
        id: snapshot
        shell: bash
        run: node tools/ci/release-snapshot.mjs pack /tmp/mid-snapshot
      - name: Unveränderlichen Snapshot übertragen
        id: snapshot_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mid-built-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/mid-snapshot/
          if-no-files-found: error
          retention-days: 1

  verify_heavy:
    name: Release-Heavy · ${{ matrix.shard }} · ${{ matrix.map_group }}
    needs: prepare_release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: heavy-native-map
            map_group: ''
          - shard: heavy-mountain-visual
            map_group: ''
          - shard: heavy-unified-map
            map_group: '1/3'
          - shard: heavy-unified-map
            map_group: '2/3'
          - shard: heavy-unified-map
            map_group: '3/3'
    steps:
      - name: Eventgebundenen Quellstand laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Unveränderliche Produzenten-Artefakt-ID prüfen
        shell: bash
        env:
          MID_ARTIFACT_ID: ${{ needs.prepare_release.outputs.snapshot_id }}
        run: node -e "if(!/^[1-9][0-9]*$/.test(process.env.MID_ARTIFACT_ID||''))throw Error('Missing producer artifact ID')"
      - name: Snapshot dieses Laufs laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare_release.outputs.snapshot_id }}
          merge-multiple: true
          digest-mismatch: error
          path: /tmp/mid-snapshot
      - name: Event, Manifest, Archiv und alle Dateien verifizieren
        shell: bash
        env:
          MID_SNAPSHOT_SHA: ${{ needs.prepare_release.outputs.snapshot_sha }}
        run: node tools/ci/release-snapshot.mjs restore /tmp/mid-snapshot
      - name: Node.js 22 mit npm-Cache einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Lockfile und npm-Registry prüfen
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail

          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 2
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 3000
          npm config set fetch-retry-maxtimeout 15000
          npm config set fetch-timeout 60000

          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const invalid = [];
          for (const [name, entry] of Object.entries(lock.packages ?? {})) {
            const resolved = entry && typeof entry === 'object' ? entry.resolved : undefined;
            if (typeof resolved !== 'string') continue;
            if (/internal\.api\.openai\.org|applied-caas-gateway|localhost|127\.0\.0\.1/i.test(resolved)) {
              invalid.push(`${name || '(root)'}: ${resolved}`);
            }
          }
          if (invalid.length) {
            console.error('Nicht öffentlich erreichbare Paket-URLs im Lockfile:\n' + invalid.join('\n'));
            process.exit(1);
          }
          console.log('Lockfile enthält keine internen oder lokalen Paket-URLs.');
          NODE

          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Registry: $(npm config get registry)"

      - name: Abhängigkeiten reproduzierbar installieren
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2 3; do
            if npm ci \
              --no-audit \
              --no-fund \
              --prefer-offline \
              --legacy-peer-deps \
              --loglevel=notice; then
              installed=true
              break
            fi
            echo "::warning::npm ci fehlgeschlagen (Versuch ${attempt}/3). Bereinige node_modules und prüfe den Cache vor erneutem Versuch."
            rm -rf node_modules
            npm cache verify || true
            sleep $((attempt * 3))
          done
          if [ "$installed" != true ]; then
            echo "::error::npm ci konnte nach drei Versuchen nicht erfolgreich abgeschlossen werden."
            exit 1
          fi


      - name: Vollständigen Heavy-Anteil des gleichen Releases prüfen
        shell: bash
        timeout-minutes: 15
        env:
          MID_REGRESSION_SHARD: ${{ matrix.shard }}
          MID_MAP_QA_SHARD: ${{ matrix.map_group }}
          MID_REGRESSION_VERBOSE: '1'
          VITE_METAR_PROXY_URL: ${{ vars.VITE_METAR_PROXY_URL }}
          VITE_ALERT_PROXY_URL: ${{ vars.VITE_ALERT_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_RADAR_PROXY_URL: ${{ vars.VITE_RADAR_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_WORKER_SAME_ORIGIN_PATH: ${{ vars.VITE_WORKER_SAME_ORIGIN_PATH || '/api/mid-worker' }}
          VITE_WORKER_FALLBACK_URLS: ${{ vars.VITE_WORKER_FALLBACK_URLS }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          set -euo pipefail
          npm run build
          npm run test:regressions
      - name: Laufzeitbericht ohne Freigabewirkung speichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mid-timings-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/mid-regression-timings.json
          if-no-files-found: warn
          retention-days: 7

  install_build:
    name: Vollständig geprüften Release sammeln und committen
    needs: [prepare_release, verify_core, verify_heavy]
    if: needs.prepare_release.result == 'success' && needs.verify_core.result == 'success' && needs.verify_heavy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      version: ${{ steps.release_meta.outputs.version }}
      worker_changed: ${{ steps.worker_diff.outputs.changed }}
    steps:
      - name: Eventgebundenen Quellstand laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Unveränderliche Produzenten-Artefakt-ID prüfen
        shell: bash
        env:
          MID_ARTIFACT_ID: ${{ needs.verify_core.outputs.snapshot_id }}
        run: node -e "if(!/^[1-9][0-9]*$/.test(process.env.MID_ARTIFACT_ID||''))throw Error('Missing producer artifact ID')"
      - name: Snapshot dieses Laufs laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify_core.outputs.snapshot_id }}
          merge-multiple: true
          digest-mismatch: error
          path: /tmp/mid-snapshot
      - name: Event, Manifest, Archiv und alle Dateien verifizieren
        shell: bash
        env:
          MID_SNAPSHOT_SHA: ${{ needs.verify_core.outputs.snapshot_sha }}
        run: node tools/ci/release-snapshot.mjs restore /tmp/mid-snapshot
      - name: Node.js 22 einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
      - name: Release- und Worker-Änderungsmetadaten ermitteln
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Fachliche Worker-Änderung gegen letzte stabile Basis ermitteln
        id: worker_diff
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          if git fetch --no-tags --depth=1 origin "+refs/heads/mid-stable:refs/remotes/origin/mid-stable" && git show origin/mid-stable:worker/metar-proxy.js > /tmp/mid-worker-stable.js; then
            node tools/cloudflare/worker_semantic_diff.mjs /tmp/mid-worker-stable.js worker/metar-proxy.js
          else
            echo "::warning::Letzter stabiler Worker konnte nicht gelesen werden; fail-safe wird ein Worker-Deploy verlangt."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: MID Release Bot Token für main erzeugen
        id: release_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.MID_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MID_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Neue MID-Version committen
        id: commit
        shell: bash
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          RELEASE_BOT_SLUG: ${{ steps.release_app_token.outputs.app-slug }}
        run: |
          set -euo pipefail

          bot_user_id="$(gh api "/users/${RELEASE_BOT_SLUG}[bot]" --jq .id)"
          git config user.name "${RELEASE_BOT_SLUG}[bot]"
          git config user.email "${bot_user_id}+${RELEASE_BOT_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

          # Ein laufender GitHub-Actions-App-Token darf keine Workflowdateien
          # selbst aktualisieren. .github bleibt deshalb grundsätzlich außerhalb
          # des automatischen Release-Commits. Kanonische Workflow-Patches liegen
          # unter ci/github und werden nur explizit synchronisiert.
          git reset -- .github >/dev/null 2>&1 || true
          git add -A -- . ':(exclude).github/**'

          if ! git diff --quiet -- .github; then
            echo "::notice::.github enthält lokale Änderungen, die bewusst nicht in den automatischen Release-Commit aufgenommen werden."
          fi

          if git diff --cached --quiet; then
            echo "::notice::Das Release-ZIP ist fachlich identisch zum bereits installierten Stand; der Workflow endet erfolgreich als No-op."
            echo "commit_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(node -p "require('./package.json').version")
          install_base_sha="$GITHUB_SHA"
          git commit -m "Install MID v${version}"

          # main kann zwischen Workflow-Start und Release-Commit weiterlaufen.
          # Nur reine .github-Änderungen dürfen transparent übernommen werden;
          # Anwendungs-, Dependency- oder ein neuer ZIP-Upload brechen den alten
          # Lauf sicher ab, damit nie ein neuerer Release-Stand überschrieben wird.
          pushed=false
          for attempt in 1 2 3; do
            git fetch --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
            remote_sha="$(git rev-parse origin/main)"

            if [ "$remote_sha" != "$install_base_sha" ] && [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              echo "main wurde während des langen Prüflaufs weitergeführt; für die bestehende Race-Prüfung wird die Historie jetzt vollständig nachgeladen."
              git fetch --unshallow --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
              remote_sha="$(git rev-parse origin/main)"
            fi

            if ! git merge-base --is-ancestor "$remote_sha" HEAD; then
              changed="$(git diff --name-only "$install_base_sha..$remote_sha" || true)"
              unsafe="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev '^\.github/' || true)"
              if [ -n "$unsafe" ]; then
                echo "::error::main wurde während der Installation durch fachliche Dateien weitergeführt. Dieser Lauf überschreibt den neueren Stand nicht."
                printf '%s\n' "$unsafe"
                exit 1
              fi
              echo "main enthält nur neuere .github-Änderungen; Release-Commit wird sicher darauf rebaset."
              git rebase origin/main
            fi

            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Push wurde parallel überholt; erneuter sicherer Versuch ${attempt}/3."
            sleep $((attempt * 2))
          done

          if [ "$pushed" != true ]; then
            echo "::error::Release-Commit konnte nach drei race-sicheren Versuchen nicht nach main übertragen werden."
            exit 1
          fi

          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"


  deploy_worker:
    name: Geprüften MID-Worker sicher automatisch veröffentlichen
    needs: install_build
    if: needs.install_build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: mid-cloudflare-worker
      cancel-in-progress: false

    steps:
      - name: Worker-Deploybedarf anzeigen
        shell: bash
        run: |
          echo "Fachliche Worker-Änderung: ${{ needs.install_build.outputs.worker_changed }}"
          echo "Release: ${{ needs.install_build.outputs.version }}"

      - name: Unveränderten Worker ohne Cloudflare-Zugriff bestätigen
        if: needs.install_build.outputs.worker_changed != 'true'
        shell: bash
        run: echo "Nur WORKER_VERSION/keine fachliche Worker-Änderung erkannt; Cloudflare-Deploy entfällt."

      - name: Einmalige Auto-Deploy-Konfiguration prüfen
        if: needs.install_build.outputs.worker_changed == 'true'
        shell: bash
        env:
          MID_WORKER_DEPLOY_ENABLED: ${{ vars.MID_WORKER_DEPLOY_ENABLED }}
          MID_CLOUDFLARE_WORKER_NAME: ${{ vars.MID_CLOUDFLARE_WORKER_NAME }}
          MID_WORKER_HEALTH_URL: ${{ vars.MID_WORKER_HEALTH_URL || vars.VITE_METAR_PROXY_URL || vars.MID_RUC_WORKER_HEALTH_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${MID_WORKER_DEPLOY_ENABLED}" != "true" ]; then
            echo "::error::Worker-Fachcode wurde geändert, aber MID_WORKER_DEPLOY_ENABLED=true ist noch nicht freigegeben. Release wird vor Pages/mid-stable angehalten."
            exit 1
          fi
          for name in MID_CLOUDFLARE_WORKER_NAME MID_WORKER_HEALTH_URL CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} fehlt für den sicheren automatischen Worker-Deploy."
              exit 1
            fi
          done

      - name: Geprüften Release-Commit laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.install_build.outputs.commit_sha }}
          fetch-depth: 1

      - name: Remote-Konfiguration und vorherige aktive Version fail-closed spiegeln
        if: needs.install_build.outputs.worker_changed == 'true'
        id: remote_worker
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MID_CLOUDFLARE_WORKER_NAME: ${{ vars.MID_CLOUDFLARE_WORKER_NAME }}
          MID_RUC_R2_BUCKET: ${{ vars.MID_RUC_R2_BUCKET }}
          MID_RUC_BINDING_AUTO_APPROVED: ${{ vars.MID_RUC_BINDING_AUTO_APPROVED }}
        run: |
          set -euo pipefail
          node tools/cloudflare/prepare_worker_deploy.mjs

      - name: Gespiegelte Worker-Konfiguration ohne Geheimnisse prüfen
        if: needs.install_build.outputs.worker_changed == 'true'
        shell: bash
        env:
          META_PATH: ${{ steps.remote_worker.outputs.meta_path }}
        run: |
          set -euo pipefail
          if [ -z "${META_PATH:-}" ] || [ ! -f "$META_PATH" ]; then
            echo "::error::Temporäre Worker-Metadaten fehlen nach der sicheren Remote-Spiegelung."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          with open(os.environ['META_PATH'], encoding='utf-8') as handle:
              meta=json.load(handle)
          print('Remote-Bindings:', ', '.join(f"{x['name']}:{x['type']}" for x in meta['bindingSummary']))
          print('RUC-R2-Binding im geplanten Deployment:', meta['rucBindingPresent'])
          PY

      - name: Neue Worker-Version nur hochladen, noch nicht live schalten
        if: needs.install_build.outputs.worker_changed == 'true'
        id: worker_upload
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.125.0'
          command: >-
            versions upload
            --config ${{ steps.remote_worker.outputs.config_path }}
            --no-bundle
            --keep-vars
            --strict
            --experimental-provision=false
            --experimental-auto-create=false
            --tag mid-${{ needs.install_build.outputs.version }}
            --message "MID v${{ needs.install_build.outputs.version }} · geprüfter Releasekandidat"

      - name: Hochgeladene Worker-Version sicher bestimmen
        if: needs.install_build.outputs.worker_changed == 'true'
        id: uploaded_worker
        shell: bash
        env:
          WRANGLER_COMMAND_OUTPUT: ${{ steps.worker_upload.outputs.command-output }}
        run: node tools/cloudflare/parse_wrangler_output.mjs

      - name: Neue Version mit 0 Prozent neben dem bisherigen Worker bereitstellen
        if: needs.install_build.outputs.worker_changed == 'true'
        id: staged_worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.125.0'
          command: >-
            versions deploy
            ${{ steps.uploaded_worker.outputs.version_id }}@0%
            ${{ steps.remote_worker.outputs.previous_version_id }}@100%
            --name ${{ vars.MID_CLOUDFLARE_WORKER_NAME }}
            --message "MID v${{ needs.install_build.outputs.version }} · 0%-Smoke"
            -y

      - name: Neue 0-Prozent-Version über Cloudflare-Versionsoverride testen
        if: needs.install_build.outputs.worker_changed == 'true'
        shell: bash
        env:
          MID_WORKER_HEALTH_URL: ${{ vars.MID_WORKER_HEALTH_URL || vars.VITE_METAR_PROXY_URL || vars.MID_RUC_WORKER_HEALTH_URL }}
          REQUIRE_RUC: ${{ vars.MID_RUC_PIPELINE_ENABLED }}
        run: |
          set -euo pipefail
          args=(--url "$MID_WORKER_HEALTH_URL" --expected-version "${{ needs.install_build.outputs.version }}" --worker "${{ vars.MID_CLOUDFLARE_WORKER_NAME }}" --version-id "${{ steps.uploaded_worker.outputs.version_id }}" --retries 6)
          if [ "$REQUIRE_RUC" = "true" ]; then args+=(--require-ruc-ready); fi
          node tools/cloudflare/check_worker_health.mjs "${args[@]}"

      - name: Geprüfte Worker-Version auf 100 Prozent promoten
        if: needs.install_build.outputs.worker_changed == 'true'
        id: promoted_worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.125.0'
          command: >-
            versions deploy
            ${{ steps.uploaded_worker.outputs.version_id }}@100%
            --name ${{ vars.MID_CLOUDFLARE_WORKER_NAME }}
            --message "MID v${{ needs.install_build.outputs.version }} · automatisch freigegeben"
            -y

      - name: Produktiven Worker nach Promotion erneut prüfen
        if: needs.install_build.outputs.worker_changed == 'true'
        id: production_smoke
        shell: bash
        env:
          MID_WORKER_HEALTH_URL: ${{ vars.MID_WORKER_HEALTH_URL || vars.VITE_METAR_PROXY_URL || vars.MID_RUC_WORKER_HEALTH_URL }}
          REQUIRE_RUC: ${{ vars.MID_RUC_PIPELINE_ENABLED }}
        run: |
          set -euo pipefail
          args=(--url "$MID_WORKER_HEALTH_URL" --expected-version "${{ needs.install_build.outputs.version }}" --retries 6)
          if [ "$REQUIRE_RUC" = "true" ]; then args+=(--require-ruc-ready); fi
          node tools/cloudflare/check_worker_health.mjs "${args[@]}"

      - name: Bestehenden www-CNAME für Same-Origin sicher über Cloudflare proxien
        id: same_origin_dns
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          MID_CLOUDFLARE_ZONE_ID: ${{ vars.MID_CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          node tools/cloudflare/ensure_www_proxy.mjs

      - name: Same-Origin-Route für produktives Web fail-closed verifizieren
        id: same_origin_route
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MID_CLOUDFLARE_WORKER_NAME: ${{ vars.MID_CLOUDFLARE_WORKER_NAME }}
          MID_CLOUDFLARE_ZONE_ID: ${{ vars.MID_CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          node tools/cloudflare/ensure_same_origin_route.mjs

      - name: Same-Origin-Datendienst vor Pages und Stable prüfen
        shell: bash
        env:
          REQUIRE_RUC: ${{ vars.MID_RUC_PIPELINE_ENABLED }}
          WORKER_CHANGED: ${{ needs.install_build.outputs.worker_changed }}
        run: |
          set -euo pipefail
          args=(--url "https://www.midwx.app/api/mid-worker" --retries 6)
          if [ "$WORKER_CHANGED" = "true" ]; then
            args+=(--expected-version "${{ needs.install_build.outputs.version }}")
          else
            args+=(--allow-existing-version)
          fi
          if [ "$REQUIRE_RUC" = "true" ]; then args+=(--require-ruc-ready); fi
          node tools/cloudflare/check_worker_health.mjs "${args[@]}"

      - name: Bei fehlgeschlagenem Smoke automatisch auf vorherige Version zurückschalten
        if: failure() && needs.install_build.outputs.worker_changed == 'true' && steps.staged_worker.conclusion == 'success'
        id: rollback_worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.125.0'
          command: >-
            versions deploy
            ${{ steps.remote_worker.outputs.previous_version_id }}@100%
            --name ${{ vars.MID_CLOUDFLARE_WORKER_NAME }}
            --message "Automatischer MID-Rollback nach fehlgeschlagenem Worker-Smoke"
            -y

  prepare_pages_artifact:
    outputs:
      artifact_ready: ${{ steps.artifact_state.outputs.ready }}
      artifact_name: ${{ steps.artifact_state.outputs.name }}
      ruc_run: ${{ steps.ruc_snapshot.outputs.run }}
    name: GitHub-Pages-Artefakt parallel vorbereiten
    needs: install_build
    if: needs.install_build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Geprüften Release-Baum für Pages-Artefakt laden
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.install_build.outputs.commit_sha }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "$RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -f dist/index.html
      - name: Bereits veröffentlichten kostenfreien RUC-Snapshot für Artefakt erhalten
        shell: bash
        env:
          MID_RUC_PIPELINE_ENABLED: ${{ vars.MID_RUC_PIPELINE_ENABLED }}
          MID_RUC_PAGES_BASE_URL: ${{ vars.MID_RUC_PAGES_BASE_URL }}
        run: |
          set -euo pipefail
          base="${MID_RUC_PAGES_BASE_URL:-https://midwx.app/ruc/}"
          args=(--base "$base" --target dist/ruc --workers 16)
          if [ "$MID_RUC_PIPELINE_ENABLED" = "true" ]; then args+=(--required); fi
          python tools/ruc/restore_ruc_pages_snapshot.py "${args[@]}"
      - name: Enthaltenen RUC-Lauf für späte Aktualitätsprüfung festhalten
        id: ruc_snapshot
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json,os
          from pathlib import Path
          p=Path('dist/ruc/latest.json')
          run=json.loads(p.read_text()).get('run','') if p.exists() else ''
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'run={run}\n')
          PYTHON
      - name: Pages-Artefakt vor Worker-Abschluss hochladen
        id: upload_artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-1
          path: ./dist
      - name: Vorbereiteten Pages-Artefaktstatus festhalten
        id: artifact_state
        if: always()
        shell: bash
        env:
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
        run: |
          if [ "$UPLOAD_OUTCOME" = "success" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'name=github-pages-${{ github.run_id }}-1' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'name=' >> "$GITHUB_OUTPUT"
          fi

  deploy_pages_1:
    outputs:
      deployed: ${{ steps.mark_deployed.outputs.deployed }}
      artifact_ready: ${{ needs.prepare_pages_artifact.outputs.artifact_ready == 'true' && steps.ruc_guard.outputs.current == 'true' }}
      artifact_name: ${{ needs.prepare_pages_artifact.outputs.artifact_name }}
    name: MID auf GitHub Pages veröffentlichen · Versuch 1
    needs:
      - install_build
      - deploy_worker
      - prepare_pages_artifact
    if: always() && needs.install_build.result == 'success' && needs.deploy_worker.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: mid-pages
      queue: max
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Geprüften Release für späte RUC-Prüfung laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.install_build.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: RUC-Snapshot innerhalb der Pages-Sperre auf Aktualität prüfen
        id: ruc_guard
        env:
          RUC_BASE: ${{ vars.MID_RUC_PAGES_BASE_URL || 'https://midwx.app/ruc/' }}
          RUC_ENABLED: ${{ vars.MID_RUC_PIPELINE_ENABLED }}
          RUC_EXPECTED: ${{ needs.prepare_pages_artifact.outputs.ruc_run }}
        run: python3 tools/ruc/check_ruc_snapshot_current.py --base "$RUC_BASE" --enabled "$RUC_ENABLED" --expected "$RUC_EXPECTED"
      - name: GitHub-Pages-Deployment · Versuch 1
        id: deployment
        if: needs.prepare_pages_artifact.outputs.artifact_ready == 'true' && steps.ruc_guard.outputs.current == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.prepare_pages_artifact.outputs.artifact_name }}
      - name: Erfolgreichen Pages-Versuch markieren
        id: mark_deployed
        if: steps.deployment.outcome == 'success'
        shell: bash
        run: echo 'deployed=true' >> "$GITHUB_OUTPUT"

  pages_cooldown_1:
    name: Pages-Retry abkühlen · 1
    needs:
      - install_build
      - deploy_worker
      - deploy_pages_1
    if: always() && needs.install_build.result == 'success' && needs.deploy_worker.result == 'success' && needs.deploy_pages_1.outputs.deployed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Backoff vor zweitem Pages-Versuch
        shell: bash
        run: |
          echo "Erster Pages-Versuch scheiterte. 75 s Backoff; ein bereits hochgeladenes Artefakt wird wiederverwendet."
          sleep 75

  deploy_pages_2:
    outputs:
      deployed: ${{ steps.mark_deployed.outputs.deployed }}
      artifact_ready: ${{ steps.artifact_state.outputs.ready == 'true' && steps.ruc_guard.outputs.current == 'true' }}
      artifact_name: ${{ steps.artifact_state.outputs.name }}
      ruc_run: ${{ steps.ruc_guard.outputs.run }}
    name: MID auf GitHub Pages veröffentlichen · Versuch 2
    needs:
      - install_build
      - deploy_worker
      - deploy_pages_1
      - pages_cooldown_1
      - prepare_pages_artifact
    if: always() && needs.install_build.result == 'success' && needs.deploy_worker.result == 'success' && needs.deploy_pages_1.outputs.deployed != 'true' && needs.pages_cooldown_1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: mid-pages
      queue: max
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Vorhandenes Pages-Artefakt übernehmen oder Neuaufbau planen
        id: artifact_plan
        shell: bash
        env:
          PREVIOUS_READY: ${{ needs.deploy_pages_1.outputs.artifact_ready }}
          PREVIOUS_NAME: ${{ needs.deploy_pages_1.outputs.artifact_name }}
        run: |
          set -euo pipefail
          if [ "$PREVIOUS_READY" = "true" ] && [ -n "$PREVIOUS_NAME" ]; then
            echo 'needs_upload=false' >> "$GITHUB_OUTPUT"
            echo "name=$PREVIOUS_NAME" >> "$GITHUB_OUTPUT"
          else
            echo 'needs_upload=true' >> "$GITHUB_OUTPUT"
            echo 'name=github-pages-${{ github.run_id }}-2' >> "$GITHUB_OUTPUT"
          fi

      - name: Geprüften Release-Baum nur bei fehlendem Artefakt neu laden
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.install_build.outputs.commit_sha }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "$RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -f dist/index.html

      - name: RUC-Snapshot nur bei fehlendem Artefakt erneut herstellen
        if: steps.artifact_plan.outputs.needs_upload == 'true'
        shell: bash
        env:
          MID_RUC_PIPELINE_ENABLED: ${{ vars.MID_RUC_PIPELINE_ENABLED }}
          MID_RUC_PAGES_BASE_URL: ${{ vars.MID_RUC_PAGES_BASE_URL }}
        run: |
          set -euo pipefail
          base="${MID_RUC_PAGES_BASE_URL:-https://midwx.app/ruc/}"
          args=(--base "$base" --target dist/ruc --workers 16)
          if [ "$MID_RUC_PIPELINE_ENABLED" = "true" ]; then args+=(--required); fi
          python tools/ruc/restore_ruc_pages_snapshot.py "${args[@]}"

      - name: Pages-Artefakt nur bei Bedarf hochladen · Versuch 2
        id: upload_artifact
        if: steps.artifact_plan.outputs.needs_upload == 'true'
        continue-on-error: true
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.artifact_plan.outputs.name }}
          path: ./dist

      - name: Pages-Artefaktstatus festhalten · Versuch 2
        id: artifact_state
        if: always()
        shell: bash
        env:
          NEEDS_UPLOAD: ${{ steps.artifact_plan.outputs.needs_upload }}
          ARTIFACT_NAME: ${{ steps.artifact_plan.outputs.name }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
        run: |
          if [ "$NEEDS_UPLOAD" = "false" ] || [ "$UPLOAD_OUTCOME" = "success" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'name=' >> "$GITHUB_OUTPUT"
          fi

      - name: RUC-Snapshot unmittelbar vor Deployment erneut prüfen
        id: ruc_guard
        env:
          RUC_BASE: ${{ vars.MID_RUC_PAGES_BASE_URL || 'https://midwx.app/ruc/' }}
          RUC_ENABLED: ${{ vars.MID_RUC_PIPELINE_ENABLED }}
          RUC_EXPECTED: ${{ needs.prepare_pages_artifact.outputs.ruc_run }}
          NEEDS_UPLOAD: ${{ steps.artifact_plan.outputs.needs_upload }}
        shell: bash
        run: |
          if [ "$NEEDS_UPLOAD" = true ] && [ "$RUC_ENABLED" = true ]; then
            RUC_EXPECTED="$(python3 -c 'import json; print(json.load(open("dist/ruc/latest.json"))["run"])')"
          fi
          python3 tools/ruc/check_ruc_snapshot_current.py --base "$RUC_BASE" --enabled "$RUC_ENABLED" --expected "$RUC_EXPECTED"

      - name: GitHub-Pages-Deployment · Versuch 2
        id: deployment
        if: always() && steps.artifact_state.outputs.ready == 'true' && steps.ruc_guard.outputs.current == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ steps.artifact_state.outputs.name }}

      - name: Erfolgreichen Pages-Versuch markieren
        id: mark_deployed
        if: steps.deployment.outcome == 'success'
        shell: bash
        run: echo 'deployed=true' >> "$GITHUB_OUTPUT"

  pages_cooldown_2:
    name: Pages-Retry abkühlen · 2
    needs:
      - install_build
      - deploy_worker
      - deploy_pages_1
      - deploy_pages_2
    if: always() && needs.install_build.result == 'success' && needs.deploy_worker.result == 'success' && needs.deploy_pages_1.outputs.deployed != 'true' && needs.deploy_pages_2.outputs.deployed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Längerer Backoff vor letztem Pages-Versuch
        shell: bash
        run: |
          echo "Zweiter Pages-Versuch scheiterte. 180 s Backoff; vorhandenes Artefakt bleibt bevorzugt."
          sleep 180

  deploy_pages_3:
    outputs:
      deployed: ${{ steps.mark_deployed.outputs.deployed }}
    name: MID auf GitHub Pages veröffentlichen · Versuch 3
    needs:
      - install_build
      - deploy_worker
      - deploy_pages_1
      - deploy_pages_2
      - pages_cooldown_2
    if: always() && needs.install_build.result == 'success' && needs.deploy_worker.result == 'success' && needs.deploy_pages_1.outputs.deployed != 'true' && needs.deploy_pages_2.outputs.deployed != 'true' && needs.pages_cooldown_2.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: mid-pages
      queue: max
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Vorhandenes Pages-Artefakt übernehmen oder letzten Neuaufbau planen
        id: artifact_plan
        shell: bash
        env:
          PREVIOUS_READY: ${{ needs.deploy_pages_2.outputs.artifact_ready }}
          PREVIOUS_NAME: ${{ needs.deploy_pages_2.outputs.artifact_name }}
        run: |
          set -euo pipefail
          if [ "$PREVIOUS_READY" = "true" ] && [ -n "$PREVIOUS_NAME" ]; then
            echo 'needs_upload=false' >> "$GITHUB_OUTPUT"
            echo "name=$PREVIOUS_NAME" >> "$GITHUB_OUTPUT"
          else
            echo 'needs_upload=true' >> "$GITHUB_OUTPUT"
            echo 'name=github-pages-${{ github.run_id }}-3' >> "$GITHUB_OUTPUT"
          fi

      - name: Geprüften Release-Baum nur bei weiterhin fehlendem Artefakt neu laden
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.install_build.outputs.commit_sha }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "$RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -f dist/index.html

      - name: RUC-Snapshot nur bei weiterhin fehlendem Artefakt erneut herstellen
        if: steps.artifact_plan.outputs.needs_upload == 'true'
        shell: bash
        env:
          MID_RUC_PIPELINE_ENABLED: ${{ vars.MID_RUC_PIPELINE_ENABLED }}
          MID_RUC_PAGES_BASE_URL: ${{ vars.MID_RUC_PAGES_BASE_URL }}
        run: |
          set -euo pipefail
          base="${MID_RUC_PAGES_BASE_URL:-https://midwx.app/ruc/}"
          args=(--base "$base" --target dist/ruc --workers 16)
          if [ "$MID_RUC_PIPELINE_ENABLED" = "true" ]; then args+=(--required); fi
          python tools/ruc/restore_ruc_pages_snapshot.py "${args[@]}"

      - name: Pages-Artefakt nur bei Bedarf hochladen · Versuch 3
        if: steps.artifact_plan.outputs.needs_upload == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.artifact_plan.outputs.name }}
          path: ./dist

      - name: RUC-Snapshot unmittelbar vor Deployment erneut prüfen
        id: ruc_guard
        env:
          RUC_BASE: ${{ vars.MID_RUC_PAGES_BASE_URL || 'https://midwx.app/ruc/' }}
          RUC_ENABLED: ${{ vars.MID_RUC_PIPELINE_ENABLED }}
          RUC_EXPECTED: ${{ needs.deploy_pages_2.outputs.ruc_run }}
          NEEDS_UPLOAD: ${{ steps.artifact_plan.outputs.needs_upload }}
        shell: bash
        run: |
          if [ "$NEEDS_UPLOAD" = true ] && [ "$RUC_ENABLED" = true ]; then
            RUC_EXPECTED="$(python3 -c 'import json; print(json.load(open("dist/ruc/latest.json"))["run"])')"
          fi
          python3 tools/ruc/check_ruc_snapshot_current.py --base "$RUC_BASE" --enabled "$RUC_ENABLED" --expected "$RUC_EXPECTED"

      - name: GitHub-Pages-Deployment · Versuch 3
        if: steps.ruc_guard.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ steps.artifact_plan.outputs.name }}

      - name: Erfolgreichen Pages-Versuch markieren
        id: mark_deployed
        if: steps.deployment.outcome == 'success'
        shell: bash
        run: echo 'deployed=true' >> "$GITHUB_OUTPUT"

  finalize_release:
    name: Erfolgreichen Pages-/Worker-Release finalisieren
    needs:
      - install_build
      - deploy_worker
      - deploy_pages_1
      - deploy_pages_2
      - deploy_pages_3
    if: always() && needs.install_build.result == 'success' && needs.deploy_worker.result == 'success' && (needs.deploy_pages_1.outputs.deployed == 'true' || needs.deploy_pages_2.outputs.deployed == 'true' || needs.deploy_pages_3.outputs.deployed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    # Stable-Promotion und RUC-Publish dürfen sich nicht zwischen der
    # Stable-SHA-Prüfung und dem eigentlichen Pages-Deployment überholen.
    # Der Lock bleibt auf den kurzen Abschluss beschränkt; Build, Audit,
    # Regressionen und Worker-Smoke laufen weiterhin davor.
    concurrency:
      group: mid-pages
      queue: max
      cancel-in-progress: false

    steps:
      - name: MID Release Bot Token für Stable-Promotion erzeugen
        id: release_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.MID_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MID_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-statuses: write

      - name: Release-SHA und Fast-Forward-Voraussetzung per GitHub-API verifizieren
        id: stable_guard
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          RELEASE_SHA: ${{ needs.install_build.outputs.commit_sha }}
        run: |
          set -euo pipefail
          release_sha="$RELEASE_SHA"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Ungültiger Release-SHA: $release_sha"
            exit 1
          fi
          commit_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${release_sha}" --jq .sha)"
          if [ "$commit_sha" != "$release_sha" ]; then
            echo "::error::Release-Commit konnte nicht SHA-genau verifiziert werden."
            exit 1
          fi
          stable_before="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/mid-stable" --jq .object.sha)"
          compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${stable_before}...${release_sha}" --jq .status)"
          if [ "$stable_before" != "$release_sha" ] && [ "$compare_status" != "ahead" ]; then
            echo "::error::mid-stable ${stable_before} ist kein Vorfahr des geprüften Release ${release_sha} (Compare: ${compare_status})."
            exit 1
          fi
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"
          echo "stable_before=${stable_before}" >> "$GITHUB_OUTPUT"

      - name: Release-Kandidatenstatus vor Stable-Promotion setzen
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          CANDIDATE_SHA: ${{ steps.stable_guard.outputs.release_sha }}
        run: |
          set -euo pipefail
          candidate_sha="$CANDIDATE_SHA"
          status_payload="$(python3 - <<PY
          import json, os
          print(json.dumps({
              'state': 'success',
              'context': 'MID / release-candidate-quality',
              'description': 'Build, Audit, Regressionen, Worker-Gate und Pages bestanden',
              'target_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          )"
          for attempt in 1 2 3 4 5; do
            http_code="$(curl --silent --show-error --output /tmp/mid-candidate-status.json --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --data "$status_payload" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${candidate_sha}" || printf '000')"
            if [ "$http_code" = 201 ] || [ "$http_code" = 200 ]; then
              echo "Release-Kandidatenstatus für ${candidate_sha} gesetzt."
              exit 0
            fi
            cat /tmp/mid-candidate-status.json || true
            if [ "$http_code" = 429 ] || [[ "$http_code" =~ ^5[0-9][0-9]$ ]] || [ "$http_code" = 000 ]; then
              echo "::warning::GitHub Status API temporär nicht verfügbar (HTTP ${http_code}, Versuch ${attempt}/5)."
              sleep $((attempt * 3))
              continue
            fi
            echo "::error::Release-Kandidatenstatus konnte wegen HTTP ${http_code} nicht gesetzt werden."
            exit 1
          done
          echo "::error::Release-Kandidatenstatus konnte nach fünf Versuchen nicht gesetzt werden; Stable-Promotion wird fail-closed abgebrochen."
          exit 1

      - name: Geprüften Release ausschließlich per API-Fast-Forward nach mid-stable promoten
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          RELEASE_SHA: ${{ steps.stable_guard.outputs.release_sha }}
        run: |
          set -euo pipefail
          release_sha="$RELEASE_SHA"
          stable_before="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/mid-stable" --jq .object.sha)"
          if [ "$stable_before" = "$release_sha" ]; then
            echo "mid-stable zeigt bereits auf den geprüften Release ${release_sha}."
            exit 0
          fi
          compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${stable_before}...${release_sha}" --jq .status)"
          if [ "$compare_status" != "ahead" ]; then
            echo "::error::mid-stable ${stable_before} ist kein Vorfahr des geprüften Release ${release_sha}; keine Historie wird überschrieben."
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/mid-stable"             -f sha="$release_sha" -F force=false >/tmp/mid-stable-promotion.json
          promoted="$(jq -r '.object.sha' /tmp/mid-stable-promotion.json)"
          if [ "$promoted" != "$release_sha" ]; then
            echo "::error::GitHub bestätigte nach Fast-Forward nicht den erwarteten Release-SHA."
            cat /tmp/mid-stable-promotion.json
            exit 1
          fi
          echo "mid-stable wurde ohne Force auf ${release_sha} fast-forward-promoviert."

      - name: Finalen Stable-SHA verifizieren und Qualitätsstatus setzen
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          STABLE_SHA: ${{ steps.stable_guard.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          stable_sha="$STABLE_SHA"

          remote_sha=''
          for attempt in 1 2 3 4; do
            remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/mid-stable" --jq .object.sha 2>/tmp/mid-stable-ref.err)" && [ -n "$remote_sha" ] && break
            echo "::warning::mid-stable konnte temporär nicht gelesen werden (Versuch ${attempt}/4)."
            cat /tmp/mid-stable-ref.err || true
            sleep $((attempt * 2))
          done
          if [ "$remote_sha" != "$stable_sha" ]; then
            echo "::error::mid-stable zeigt auf ${remote_sha:-<leer>} statt auf den geprüften Release ${stable_sha}."
            exit 1
          fi

          status_payload="$(python3 - <<PY
          import json, os
          print(json.dumps({
              'state': 'success',
              'context': 'MID / stable-release-quality',
              'description': 'Build, Audit, Regressionen, Worker-Gate und Pages bestanden',
              'target_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          )"

          status_written=false
          for attempt in 1 2 3 4 5; do
            http_code="$(curl --silent --show-error --output /tmp/mid-status-response.json --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --data "$status_payload" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${stable_sha}" || printf '000')"

            if [ "$http_code" = 201 ] || [ "$http_code" = 200 ]; then
              status_written=true
              echo "Qualitätsstatus für ${stable_sha} gesetzt."
              break
            fi

            cat /tmp/mid-status-response.json || true
            if [ "$http_code" = 429 ] || [[ "$http_code" =~ ^5[0-9][0-9]$ ]] || [ "$http_code" = 000 ]; then
              echo "::warning::GitHub Status API temporär nicht verfügbar (HTTP ${http_code}, Versuch ${attempt}/5)."
              sleep $((attempt * 3))
              continue
            fi

            echo "::error::Qualitätsstatus konnte wegen eines nicht-temporären GitHub-API-Fehlers (HTTP ${http_code}) nicht gesetzt werden."
            exit 1
          done

          if [ "$status_written" != true ]; then
            echo "::warning::GitHub Status API blieb nach fünf Versuchen temporär nicht verfügbar. Build, Regressionen, Pages-Deployment und finaler mid-stable-SHA sind dennoch erfolgreich verifiziert; der Release bleibt gültig."
          fi
