name: MID RUC IR10.8/GSP complete +0..+27h original GRIB QA (read-only)
on:
  push:
    branches: [chatgpt/v0.9.85.485-surroundings-radar-native-qa]
    paths: ['.github/workflows/mid-ruc-full-109-original-qa.yml']
permissions:
  contents: read
concurrency:
  group: mid-ruc-full-109-original-qa
  cancel-in-progress: false
jobs:
  full-original-source-qa:
    if: "${{ github.event.head_commit.message == 'qa(ruc): full 109 original IR and GSP source verification' }}"
    name: Genuine 109 frames x 4 GRIB products from one exact DWD run (NO RELEASE)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Exact SHA checkout, no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify workflow mirror and immutable MID Stable/Main lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/chatgpt/v0.9.85.485-surroundings-radar-native-qa
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cmp .github/workflows/mid-ruc-full-109-original-qa.yml ci/github/workflows/mid-ruc-full-109-original-qa.yml
          stable="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/mid-stable" --jq .object.sha)"
          main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$main" = "$stable"
          test "$stable" = c9fadfcd0969e949a92f414b321627dd3d4fb0cc
          compare="$(gh api "repos/$GITHUB_REPOSITORY/compare/$stable...$GITHUB_SHA")"
          jq -e --arg stable "$stable" '.status == "ahead" and .merge_base_commit.sha == $stable' <<< "$compare" >/dev/null
          echo 'Exact stable lineage verified, no production or release writes.'
      - name: Use existing ecCodes science environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Bounded science requirements and independent adversarial unit tests
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r tools/ruc/requirements-pages.txt
          python -m unittest discover -s tools/ruc -p 'test_qa_ruc_original_horizon_inventory.py' -v
          python -m unittest discover -s tools/ruc -p 'test_qa_ruc_late_originals.py' -v
          python -m unittest discover -s tools/ruc -p 'test_qa_ruc_full_109_originals.py' -v
          python -m unittest discover -s tools/ruc -p 'test_ir108_original_probe.py'
          python -m unittest discover -s tools/ruc -p 'test_original_15min_phase_gate.py'
      - name: Download/read/SHA/ecCodes/audit 436 real native GRIBs from ONE matching run
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          umask 077
          python -u tools/ruc/qa_ruc_full_109_originals.py --lookback-hours 10
          echo 'All 109 original UTC times each field: QA only; no raw GRIB archive, render, Worker, Pages, installation, warning or promotion.'
