name: MID Release Self-Heal
run-name: Temporäre Releasefehler automatisch behandeln

on:
  workflow_run:
    workflows:
      - Install MID release and deploy
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: mid-release-self-heal-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  classify_and_retry:
    name: Releasefehler klassifizieren und sicher erneut versuchen
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Geprüften Release-Classifier von mid-stable laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: mid-stable
          persist-credentials: false

      - name: Node.js 22 für unveränderliche Retry-Klassifikation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0

      - name: Fehlgeschlagene Jobs und Logs ohne Codeänderung klassifizieren
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          # Bootstrap before first Stable promotion: never run untrusted main/PR code.
          if [ ! -f tools/ci/release-self-heal-classify.mjs ]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "reason=trusted-classifier-not-yet-promoted" >> "$GITHUB_OUTPUT"
            echo "::notice::Trusted classifier is not yet in Stable; no automatic retry."
            exit 0
          fi
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/mid-failed.log 2>&1 || true
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > /tmp/mid-failed-jobs.json
          # Trusted Stable classifier never approves a release: it only retries
          # exactly the failed jobs on the same SHA, once for one known browser timeout.
          node tools/ci/release-self-heal-classify.mjs /tmp/mid-failed.log /tmp/mid-failed-jobs.json "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Nur temporär klassifizierte Fehler automatisch erneut ausführen
        if: steps.classify.outputs.retry == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
          echo "Temporärer Releasefehler: fehlgeschlagene Jobs werden automatisch erneut ausgeführt." >> "$GITHUB_STEP_SUMMARY"

      - name: Deterministische oder unbekannte Fehler sicher blockieren
        if: steps.classify.outputs.retry != 'true'
        shell: bash
        run: |
          {
            echo "### Kein automatisches Code-Umschreiben"
            echo
            echo "Fehlerklasse: ${{ steps.classify.outputs.reason }}."
            echo
            echo "MID veröffentlicht diesen Stand nicht. Echte Build-, Test-, Typ-, Sicherheits- oder unbekannte Fehler werden absichtlich nicht blind durch CI verändert."
          } >> "$GITHUB_STEP_SUMMARY"
