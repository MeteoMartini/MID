name: MID Groq ChatGPT catalog Issue relay (NO INFERENCE)
on:
  issues:
    types: [opened]
permissions:
  contents: read
  actions: write
concurrency:
  group: mid-ai-router-groq-catalog-owner-relay
  cancel-in-progress: false
  queue: max
jobs:
  verify-and-dispatch:
    if: ${{ github.actor == 'MeteoMartini' && github.event.issue.user.login == 'MeteoMartini' && startsWith(github.event.issue.title, '[MID-AI-GROQ-CATALOG] ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
      - name: Verify owner-created public issue, dispatch one stable-only read-only workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/run-mid-ai-router-groq-issue-relay.mjs
