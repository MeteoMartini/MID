name: 'MID #740 · path-scoped PR artifact shadow (NO RELEASE)'

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'tools/ci/mid_740_restore_dist.py'
      - 'tools/ci/test_mid_740_restore_dist.py'
      - '.github/workflows/mid-740-pr-artifact-shadow-qa.yml'
      - 'ci/github/workflows/mid-740-pr-artifact-shadow-qa.yml'
      - 'tools/ci/mid-740-pr-artifact-shadow.mjs'
      - 'tools/ci/mid-740-historical-chain-readback.mjs'
      - 'tools/ci/mid-740-native-review-cutover-readback.mjs'
      - 'tests/unit/mid-740-native-review-cutover-readback.test.ts'
      - 'tools/ci/mid-740-live-cubic-review-readback.mjs'
      - 'tests/unit/mid-740-live-cubic-review-readback.test.ts'
      - 'tools/ci/mid-review-premerge-guard.mjs'
      - 'tools/ci/mid-740-upstream-trigger-readback.mjs'
      - 'tools/ci/mid-740-producer-gate-receipt-qa.mjs'
      - 'tests/unit/mid-740-producer-gate-receipt-qa.test.ts'
      - 'tests/unit/mid-740-upstream-trigger-readback.test.ts'
      - 'tests/unit/mid-740-historical-chain-readback.test.ts'
      - 'tests/unit/mid-740-pr-artifact-shadow.test.ts'
      - 'docs/implementation/MID_740_PR_ARTIFACT_HANDOFF_SHADOW_2026_11_16.md'

permissions:
  contents: read

concurrency:
  group: mid-740-pr-shadow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # #740: restricted PR-only upload/download smoke; never runs on default branch.
  mid740-shadow-source-producer:
    name: 'MID #740 · PR-Shadow ZIP original hochladen (NO RELEASE)'
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'MeteoMartini/MID' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.number == 839 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'chatgpt/v0.9.85.484-issue740-merge-review-artifact-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Exakten PR-HEAD ohne Schreibcredentials laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Originale Git-Tree-Quelle und ZIP bytegenau vorbereiten
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          python3 tools/ci/mid-740-build-source-zip.py \
            --repository "$GITHUB_WORKSPACE" --source-sha "$PR_HEAD_SHA" \
            --destination "$RUNNER_TEMP/mid740-shadow-source"
          python3 tools/ci/verify-source-release-zip.py \
            "$RUNNER_TEMP/mid740-shadow-source/MID-professional-replacement.zip" "$PR_HEAD_SHA"
          python3 -c 'import json,os; from pathlib import Path; x=json.loads((Path(os.environ["RUNNER_TEMP"])/"mid740-shadow-source"/"MID-source-zip-evidence.json").read_text()); assert x["sourceMergeSha"]==os.environ["PR_HEAD_SHA"] and x["productionApproved"] is False and x["releaseAuthorized"] is False'
      - name: Nur geprüftes QA-ZIP kurzlebig sichern
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mid-740-pr-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mid740-shadow-source/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  mid740-shadow-readonly-consumer:
    name: 'MID #740 · PR-Shadow-Originalbytes unabhängig prüfen (NO RELEASE)'
    needs: mid740-shadow-source-producer
    if: >-
      needs.mid740-shadow-source-producer.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.number == 839 &&
      github.repository == 'MeteoMartini/MID'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - name: Exakten unabhängigen PR-HEAD-Verifier laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Node.js 22 für GitHub-REST-Readback einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
      - name: Originalen Run, Attempt, PR und Artifact-ID gegen GitHub prüfen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHADOW_ARTIFACT_ID: ${{ needs.mid740-shadow-source-producer.outputs.artifact_id }}
          SHADOW_ARTIFACT_DIGEST: ${{ needs.mid740-shadow-source-producer.outputs.digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
          node tools/ci/mid-740-pr-artifact-shadow.mjs \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SHADOW_ARTIFACT_ID" \
            "$EXPECTED_PR_HEAD" "$SHADOW_ARTIFACT_DIGEST" > "$RUNNER_TEMP/mid740-shadow-readback.json"
          jq -e '.prShadowMetadataVerified == true and .actualSourceProducerVerified == false and .installerAuthorized == false and .releaseAuthorized == false' "$RUNNER_TEMP/mid740-shadow-readback.json"
      - name: Originale GitHub-ZIP-Hülle ohne Entpacken laden
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.mid740-shadow-source-producer.outputs.artifact_id }}
          path: ${{ runner.temp }}/mid740-shadow-downloaded
          skip-decompress: true
          digest-mismatch: error
      - name: Originalbytes und vollständigen Quell-Git-Tree prüfen
        shell: bash
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHADOW_DIGEST: ${{ needs.mid740-shadow-source-producer.outputs.digest }}
        run: |
          set -euo pipefail
          mapfile -d '' envelopes < <(find "$RUNNER_TEMP/mid740-shadow-downloaded" -maxdepth 1 -type f -print0)
          test "${#envelopes[@]}" -eq 1
          test "$(sha256sum "${envelopes[0]}" | cut -d' ' -f1)" = "$SHADOW_DIGEST"
          python3 tools/ci/mid-740-verify-artifact-envelope.py \
            --envelope "${envelopes[0]}" --expected-envelope-sha256 "$SHADOW_DIGEST" \
            --source-sha "$EXPECTED_PR_HEAD" --destination "$RUNNER_TEMP/mid740-shadow-verified" \
            --repository "$GITHUB_WORKSPACE" \
            --local-verifier "$GITHUB_WORKSPACE/tools/ci/mid-740-verify-local-artifact.py" \
            --source-verifier "$GITHUB_WORKSPACE/tools/ci/verify-source-release-zip.py" \
            > "$RUNNER_TEMP/mid740-shadow-verified.json"
          jq -e '.envelopeBytesVerified == true and .sourceGitTreeVerified == true and .authenticatedGitHubProducer == false and .installerAuthorized == false and .releaseAuthorized == false' "$RUNNER_TEMP/mid740-shadow-verified.json"
          echo "### MID #740 · PR-only Artifact-Transport" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-genaue Git-Tree-Parität + Run/Attempt/Artifact-Digest; keine Produktion." >> "$GITHUB_STEP_SUMMARY"

  mid740-historical-source-chain-readonly:
    name: 'MID #740 · echter .486 Gate/Bot/Installer-Readback (NO RELEASE)'
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'MeteoMartini/MID' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.number == 839 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'chatgpt/v0.9.85.484-issue740-merge-review-artifact-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Nur exakten PR-HEAD für historischen Verifier lesen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Historischen Stable-dist-Tree isoliert wiederherstellen
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/ci -p 'test_mid_740*.py'
          stable=a78465b655d25cafc9ecc0390080694cb7aca957
          tree=b3df278b844130cc3634485b86f96ac0314bbce1
          git fetch --no-tags --depth=1 origin "$stable"
          test "$(git rev-parse "$stable:dist")" = "$tree"
          recovery="$(mktemp -d "$RUNNER_TEMP/mid740-dist-restore.XXXXXXXX")"
          git archive --format=zip "$stable" dist > "$recovery/MID-dist-release.zip"
          read -r digest _ < <(sha256sum "$recovery/MID-dist-release.zip")
          python3 tools/ci/mid_740_restore_dist.py "$recovery/MID-dist-release.zip" \
            "$recovery/restored" "$digest" "$tree" 0.9.85.486
          git -C "$recovery/restored" init -q
          git -C "$recovery/restored" add -f dist
          test "$(git -C "$recovery/restored" write-tree --prefix=dist/)" = "$tree"
      - name: Node.js 22 einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
      - name: Echte GitHub Source-Gate/Bot/Installer-Identität (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
          # A normal PR event MUST NOT pass a privileged workflow_run trust gate.
          if node tools/ci/mid-740-upstream-trigger-readback.mjs > "$RUNNER_TEMP/mid740-untrusted-event.json"; then
            echo "::error::Untrusted PR context passed a workflow_run-only gate"
            exit 1
          fi
          jq -e '.status == "BLOCKED" and .reason == "TRUSTED_WORKFLOW_RUN_CONTEXT_REQUIRED" and
            .installerAuthorized == false and .releaseAuthorized == false' "$RUNNER_TEMP/mid740-untrusted-event.json"
          # A PR event is NEVER accepted as producer-side workflow_run receipt.
          if node tools/ci/mid-740-producer-gate-receipt-qa.mjs > "$RUNNER_TEMP/mid740-receipt-untrusted.json"; then
            echo "::error::PR context could forge producer gate receipt"
            exit 1
          fi
          jq -e '.status == "BLOCKED" and .reason == "TRUSTED_WORKFLOW_RUN_CONTEXT_REQUIRED" and
            .trustedProductionReceiptAttested == false and
            .installerAuthorized == false and .releaseAuthorized == false' "$RUNNER_TEMP/mid740-receipt-untrusted.json"
          if ! node tools/ci/mid-740-historical-chain-readback.mjs > "$RUNNER_TEMP/mid740-real-history.json"; then
            jq -r '(.status // "BLOCKED") + ": " + (.reason // "UNKNOWN")' "$RUNNER_TEMP/mid740-real-history.json" >&2
            exit 1
          fi
          jq -e '.status == "HISTORIC_LEGACY_LINEAGE_QA_ONLY" and
            .sourceGateVerified == true and .testedSourceBaseVerified == true and
            .gitParentChainVerified == true and
            .originalGatePrCount == 0 and .originalBotPrCount == 0 and
            .producerArtifactCount == 0 and .installerStartedBeforeBotFinished == true and
            .upstreamEventLinkVerified == false and .producerArtifactVerified == false and
            .installerAuthorized == false and .recoveryAuthorized == false and
            .releaseAuthorized == false' "$RUNNER_TEMP/mid740-real-history.json"
          # Exact original GitHub PR #729 GraphQL comments + REST SHA: read only.
          node tools/ci/mid-740-live-cubic-review-readback.mjs > "$RUNNER_TEMP/mid740-live-cubic.json"
          jq -e '.status == "HISTORICAL_CUBIC_GRAPHQL_QA_ONLY" and
            .threads == 21 and .unresolvedThreads == 21 and
            .inlineComments == 21 and .realEvidenceRead == true and
            .nativeReviewEnforced == false and
            .mergeAuthorized == false and .releaseAuthorized == false' "$RUNNER_TEMP/mid740-live-cubic.json"
          if ! node tools/ci/mid-740-native-review-cutover-readback.mjs > "$RUNNER_TEMP/mid740-native-review-readback.json"; then
            # Print only the bounded fail-closed enum; never tokens/API bodies.
            jq -r '(.status // "BLOCKED") + ": " + (.reason // "UNKNOWN")' "$RUNNER_TEMP/mid740-native-review-readback.json" >&2
            exit 1
          fi
          jq -e '(
              (.status == "LEGACY_MAIN_WRITES_BLOCK_NO_BYPASS_CUTOVER_QA_ONLY" and
                .rulesetBypassActorsVerified == true and
                .productionReleaseIntegrationAlwaysBypasses == true)
              or
              (.status == "BYPASS_ACTORS_UNVERIFIED_CUTOVER_BLOCKED_QA_ONLY" and
                .rulesetBypassActorsVerified == false and
                .productionReleaseIntegrationAlwaysBypasses == null)
            ) and
            .registryAndRuleDetailsVerified == true and
            .twoLegacyMainWritePathsSHAAndBlobVerified == true and
            .productionRulesetHasRequiredPR == false and
            .nativeReviewEnforcementVerified == false and
            .noBypassCutoverCompatible == false and
            .cutoverAuthorized == false and .releaseAuthorized == false' "$RUNNER_TEMP/mid740-native-review-readback.json"
          echo "### MID #740 · echter historischer Release-Chain-Readback" >> "$GITHUB_STEP_SUMMARY"
          echo "Getestete .486-Source-Basis, Checkout-Git-Tree und historischer Installer geprüft." >> "$GITHUB_STEP_SUMMARY"
