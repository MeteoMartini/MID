name: MID RUC IR10.8/GSP native +14:15/+27:00 real GRIB boundary QA (read-only)
on:
  push:
    branches: [chatgpt/v0.9.85.485-surroundings-radar-native-qa]
    paths: ['.github/workflows/mid-ruc-late-original-boundary-qa.yml']
permissions:
  contents: read
concurrency:
  group: mid-ruc-late-original-boundary-one-shot-qa
  cancel-in-progress: false
jobs:
  original-grib-boundaries:
    if: "${{ github.event.head_commit.message == 'qa(ruc): three-run late original GRIB boundary verification' }}"
    name: 3 genuine runs x 4 products x 4 late original leads (NO RELEASE)
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - name: Exact HEAD checkout without persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Mirror and immutable Stable/Main lineage admission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/chatgpt/v0.9.85.485-surroundings-radar-native-qa
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cmp .github/workflows/mid-ruc-late-original-boundary-qa.yml ci/github/workflows/mid-ruc-late-original-boundary-qa.yml
          main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          stable="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/mid-stable" --jq .object.sha)"
          test "$stable" = "$main"
          test "$stable" = c9fadfcd0969e949a92f414b321627dd3d4fb0cc
          compare="$(gh api "repos/$GITHUB_REPOSITORY/compare/$stable...$GITHUB_SHA")"
          jq -e --arg stable "$stable" '.status == "ahead" and .merge_base_commit.sha == $stable' <<< "$compare" >/dev/null
          echo 'SHA-bound read-only original-data QA, NO productive source/installer/worker changes.'
      - name: Official MID Python/ecCodes dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install existing MID RUC science environment and regression guards
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r tools/ruc/requirements-pages.txt
          python -m unittest discover -s tools/ruc -p 'test_qa_ruc_original_horizon_inventory.py' -v
          python -m unittest discover -s tools/ruc -p 'test_qa_ruc_late_originals.py' -v
          python -m unittest discover -s tools/ruc -p 'test_ir108_original_probe.py'
          python -m unittest discover -s tools/ruc -p 'test_original_15min_phase_gate.py'
      - name: Read, SHA-bind, ecCodes-inspect 48 actual boundary GRIBs from 3 complete DWD runs
        shell: bash
        timeout-minutes: 11
        run: |
          set -euo pipefail
          umask 077
          python tools/ruc/qa_ruc_late_originals.py --lookback-hours 10
          echo 'Boundary-only genuine GRIB admission, NO full 27h, lookup, visual, warning or release approval.'
