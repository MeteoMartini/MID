name: MID automated code revision
# Installer revision 3: preserves the verified MID lockfile, avoids duplicate ZIP runs and recovers pending releases.
run-name: MID-Revision – ${{ github.event_name }} / ${{ inputs.task || 'automatic' }}

on:
  push:
    branches:
      - mid-stable
    paths-ignore:
      - 'MID-professional-replacement*.zip'
      - 'MID-worker*.zip'
  pull_request:
    branches:
      - mid-stable
  workflow_dispatch:
    inputs:
      task:
        description: Auszuführende Revisionsklasse
        required: true
        default: ci
        type: choice
        options:
          - ci
          - nightly
          - health
          - performance
          - codeql
          - install
          - all
  schedule:
    - cron: '17 3 * * *'
    - cron: '23 */6 * * *'
    - cron: '23 2 * * 0'
    - cron: '41 1 * * 3'

permissions:
  contents: read

concurrency:
  group: mid-revision-${{ github.workflow }}-${{ github.ref }}-${{ github.event.schedule || inputs.task || github.event_name }}
  cancel-in-progress: false

jobs:
  revision_source:
    name: Exakten Revisions-SHA binden
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/mid-stable') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.task == 'ci' || inputs.task == 'nightly' || inputs.task == 'all')) ||
      (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - id: pin
        name: Main/Stable-Drift und Event-SHA fail-closed prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            sha="$GITHUB_SHA"
          else
            stable="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/mid-stable" --jq .object.sha)"
            main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            test "$stable" = "$main" || { echo "::error::Main/Stable-Drift"; exit 1; }
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              test "$GITHUB_SHA" = "$stable" || { echo "::error::Veralteter Stable-Push"; exit 1; }
            fi
            sha="$stable"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  revision_regressions:
    name: Revisionsregression · ${{ matrix.shard }} · ${{ matrix.map_group }}
    needs: [revision_source]
    if: needs.revision_source.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 'core-1/4', map_group: ''}
          - {shard: 'core-2/4', map_group: ''}
          - {shard: 'core-3/4', map_group: ''}
          - {shard: 'core-4/4', map_group: ''}
          - {shard: 'heavy-browser-state', map_group: ''}
          - {shard: 'heavy-native-map', map_group: ''}
          - {shard: 'heavy-mountain-visual', map_group: ''}
          - {shard: 'heavy-unified-map', map_group: '1/3'}
          - {shard: 'heavy-unified-map', map_group: '2/3'}
          - {shard: 'heavy-unified-map', map_group: '3/3'}
    steps:
      - name: Gemeinsamen geprüften Quell-SHA laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision_source.outputs.sha }}
          persist-credentials: false
      - name: Node.js 22 einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Unveränderte Abhängigkeiten aus Lockfile installieren
        run: npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps
      - name: Python für RUC-Regressionen einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/ruc/requirements-pages.txt
      - name: RUC-Testabhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check -r tools/ruc/requirements-pages.txt
      - name: Browser für alle UI- und Wetterkartenprüfungen bereitstellen
        timeout-minutes: 10
        run: |
          node scripts/prepare-browser-runtimes.mjs
      - name: Vollständige Regressionstest-Zuordnung verifizieren
        run: node scripts/test-regression-sharding-0985171.mjs
      - name: Identischen Produktionsbuild für alle Shards ausführen
        env:
          VITE_METAR_PROXY_URL: ${{ vars.VITE_METAR_PROXY_URL }}
          VITE_ALERT_PROXY_URL: ${{ vars.VITE_ALERT_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_RADAR_PROXY_URL: ${{ vars.VITE_RADAR_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_WORKER_SAME_ORIGIN_PATH: ${{ vars.VITE_WORKER_SAME_ORIGIN_PATH }}
          VITE_WORKER_FALLBACK_URLS: ${{ vars.VITE_WORKER_FALLBACK_URLS }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: npm run build
      - name: Alle Regressionen des verpflichtenden Matrixteils prüfen
        env:
          MID_REGRESSION_SHARD: ${{ matrix.shard }}
          MID_MAP_QA_SHARD: ${{ matrix.map_group }}
          VITE_METAR_PROXY_URL: ${{ vars.VITE_METAR_PROXY_URL }}
          VITE_ALERT_PROXY_URL: ${{ vars.VITE_ALERT_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_RADAR_PROXY_URL: ${{ vars.VITE_RADAR_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_WORKER_SAME_ORIGIN_PATH: ${{ vars.VITE_WORKER_SAME_ORIGIN_PATH }}
          VITE_WORKER_FALLBACK_URLS: ${{ vars.VITE_WORKER_FALLBACK_URLS }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: npm run test:regressions

  ci:
    name: MID CI verify
    needs: [revision_source, revision_regressions]
    if: >-
      always() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/mid-stable') ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && (inputs.task == 'ci' || inputs.task == 'all'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Alle Pflichtshards müssen erfolgreich sein
        env:
          SOURCE_RESULT: ${{ needs.revision_source.result }}
          MATRIX_RESULT: ${{ needs.revision_regressions.result }}
        run: |
          test "$SOURCE_RESULT" = success && test "$MATRIX_RESULT" = success
      - name: Zu prüfenden MID-Stand laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision_source.outputs.sha }}
      - name: Installationsstand erkennen
        id: revision_ready
        shell: bash
        run: |
          if [ -f scripts/check-build-budget.mjs ] && [ -f MID_PERFORMANCE_BASELINE.json ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Die Bootstrap-Workflowdatei ist vorhanden; das Revisionsoverlay wurde noch nicht installiert.'
          fi
      - name: Node.js 22 einrichten
        if: steps.revision_ready.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhängigkeiten reproduzierbar installieren
        if: steps.revision_ready.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps
      - name: Python für die vollständigen RUC-Regressionen einrichten
        if: steps.revision_ready.outputs.ready == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/ruc/requirements-pages.txt

      - name: Vorhandene RUC-Testabhängigkeiten installieren
        if: steps.revision_ready.outputs.ready == 'true'
        shell: bash
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check -r tools/ruc/requirements-pages.txt

      - name: Chromium und WebKit vor der Revision vollständig vorbereiten
        if: steps.revision_ready.outputs.ready == 'true'
        timeout-minutes: 10
        run: node scripts/prepare-browser-runtimes.mjs

      - name: Produktionsbuild nach vollständiger Shardprüfung ausführen
        if: steps.revision_ready.outputs.ready == 'true'
        env:
          VITE_METAR_PROXY_URL: ${{ vars.VITE_METAR_PROXY_URL }}
          VITE_ALERT_PROXY_URL: ${{ vars.VITE_ALERT_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_RADAR_PROXY_URL: ${{ vars.VITE_RADAR_PROXY_URL || vars.VITE_METAR_PROXY_URL }}
          VITE_WORKER_SAME_ORIGIN_PATH: ${{ vars.VITE_WORKER_SAME_ORIGIN_PATH }}
          VITE_WORKER_FALLBACK_URLS: ${{ vars.VITE_WORKER_FALLBACK_URLS }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          npm run build
          node --check worker/metar-proxy.js
      - name: Produktionsabhängigkeiten prüfen
        if: steps.revision_ready.outputs.ready == 'true'
        run: npm run audit:dependencies
      - name: Build-Größenbudget prüfen
        if: steps.revision_ready.outputs.ready == 'true'
        run: node scripts/check-build-budget.mjs

  nightly:
    name: Nächtliche MID-Revision
    needs: [revision_source, revision_regressions]
    if: >-
      always() && (
        (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *') ||
        (github.event_name == 'workflow_dispatch' && (inputs.task == 'nightly' || inputs.task == 'all'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write
    steps:
      - name: MID Stable laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision_source.outputs.sha }}
      - name: Node.js 22 einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - id: install
        name: Abhängigkeiten installieren
        continue-on-error: true
        run: npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps
      - name: Python für die vollständigen RUC-Regressionen einrichten
        if: steps.install.outcome == 'success'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/ruc/requirements-pages.txt

      - name: Vorhandene RUC-Testabhängigkeiten installieren
        if: steps.install.outcome == 'success'
        shell: bash
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check -r tools/ruc/requirements-pages.txt

      - id: browser_install
        name: Chromium und WebKit vor der nächtlichen Revision vorbereiten
        if: steps.install.outcome == 'success'
        timeout-minutes: 10
        continue-on-error: true
        run: node scripts/prepare-browser-runtimes.mjs

      - id: verify
        name: Vollständige SHA-Matrix und Produktionsbuild
        if: steps.install.outcome == 'success' && steps.browser_install.outcome == 'success'
        continue-on-error: true
        env:
          SOURCE_RESULT: ${{ needs.revision_source.result }}
          MATRIX_RESULT: ${{ needs.revision_regressions.result }}
        run: |
          test "$SOURCE_RESULT" = success && test "$MATRIX_RESULT" = success
          npm run build
          node --check worker/metar-proxy.js
      - id: audit
        name: Vollständiger npm-Audit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run audit:all
      - id: budget
        name: Build-Budget
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-build-budget.mjs
      - id: contracts
        name: Open-Meteo- und Datenverträge
        continue-on-error: true
        env:
          MID_WORKER_HEALTH_URL: ${{ vars.MID_WORKER_HEALTH_URL }}
        run: node scripts/check-api-contracts.mjs
      - name: Revisionsbericht erzeugen
        if: always()
        run: node scripts/create-revision-report.mjs
      - name: Befund als dedupliziertes Issue melden
        if: always() && (steps.install.outcome != 'success' || steps.browser_install.outcome != 'success' || steps.verify.outcome != 'success' || steps.audit.outcome != 'success' || steps.budget.outcome != 'success' || steps.contracts.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='[Auto-Revision] Nächtliche MID-Revision fehlgeschlagen'
          gh label create automated-review --color 6f42c1 --description 'Automatisch erkannte Revisionsbefunde' --force
          number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Install: ${{ steps.install.outcome }}
          Chromium/WebKit: ${{ steps.browser_install.outcome }}
          Verify: ${{ steps.verify.outcome }}
          Audit: ${{ steps.audit.outcome }}
          Budget: ${{ steps.budget.outcome }}
          API-Verträge: ${{ steps.contracts.outcome }}"
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body" --label automated-review; fi
      - name: Revision bei Befund fehlschlagen lassen
        if: always() && (steps.install.outcome != 'success' || steps.browser_install.outcome != 'success' || steps.verify.outcome != 'success' || steps.audit.outcome != 'success' || steps.budget.outcome != 'success' || steps.contracts.outcome != 'success')
        run: exit 1

  health:
    name: MID Produktiv- und API-Healthcheck
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '23 */6 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.task == 'health' || inputs.task == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: MID Stable laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: mid-stable
      - name: Node.js 22 einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
      - id: site
        name: www.midwx.app und Weiterleitung prüfen
        continue-on-error: true
        env:
          MID_SITE_URL: https://www.midwx.app/
          MID_APEX_URL: https://midwx.app/
        run: node scripts/check-deployed-mid.mjs
      - id: contracts
        name: Open-Meteo-Verträge prüfen
        continue-on-error: true
        env:
          MID_WORKER_HEALTH_URL: ${{ vars.MID_WORKER_HEALTH_URL }}
        run: node scripts/check-api-contracts.mjs
      - name: Befund als dedupliziertes Issue melden
        if: always() && (steps.site.outcome != 'success' || steps.contracts.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='[Auto-Revision] MID-Produktivprüfung fehlgeschlagen'
          gh label create automated-review --color 6f42c1 --description 'Automatisch erkannte Revisionsbefunde' --force
          number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Website: ${{ steps.site.outcome }}
          API-Verträge: ${{ steps.contracts.outcome }}"
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body" --label automated-review; fi
      - name: Healthcheck bei Befund fehlschlagen lassen
        if: always() && (steps.site.outcome != 'success' || steps.contracts.outcome != 'success')
        run: exit 1

  performance:
    name: MID Browser- und Performance-Revision
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '23 2 * * 0') ||
      (github.event_name == 'workflow_dispatch' && (inputs.task == 'performance' || inputs.task == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      issues: write
    steps:
      - name: MID Stable laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: mid-stable
      - name: Node.js 22 einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - id: install
        name: Projektabhängigkeiten installieren
        continue-on-error: true
        run: npm ci --no-audit --no-fund --prefer-offline --legacy-peer-deps
      - id: tools
        name: Playwright und Lighthouse isoliert ohne Lockfile-Änderung installieren
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm install --no-save --no-package-lock --ignore-scripts --legacy-peer-deps --no-audit --no-fund @playwright/test@1.54.2 @lhci/cli@0.15.1
      - id: build
        name: Produktionsbuild erstellen
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build
      - id: budget
        name: Bundlebudget prüfen
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-build-budget.mjs
      - id: browser_install
        name: Chromium für Playwright installieren
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - id: playwright
        name: Vier Geräteprofile mit Playwright prüfen
        if: steps.browser_install.outcome == 'success'
        continue-on-error: true
        env:
          MID_SITE_URL: https://www.midwx.app/
        run: npx playwright test --config=playwright.config.mjs
      - id: lighthouse
        name: Lighthouse CI ausführen
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        env:
          MID_SITE_URL: https://www.midwx.app/
        run: npx lhci autorun --config=./lighthouserc.cjs
      - name: Befund als dedupliziertes Issue melden
        if: always() && (steps.install.outcome != 'success' || steps.tools.outcome != 'success' || steps.build.outcome != 'success' || steps.budget.outcome != 'success' || steps.browser_install.outcome != 'success' || steps.playwright.outcome != 'success' || steps.lighthouse.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='[Auto-Revision] MID-Browser- oder Performanceprüfung fehlgeschlagen'
          gh label create automated-review --color 6f42c1 --description 'Automatisch erkannte Revisionsbefunde' --force
          number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Werkzeuge: ${{ steps.tools.outcome }}
          Build: ${{ steps.build.outcome }}
          Budget: ${{ steps.budget.outcome }}
          Playwright: ${{ steps.playwright.outcome }}
          Lighthouse: ${{ steps.lighthouse.outcome }}"
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body" --label automated-review; fi
      - name: Performanceprüfung bei Befund fehlschlagen lassen
        if: always() && (steps.install.outcome != 'success' || steps.tools.outcome != 'success' || steps.build.outcome != 'success' || steps.budget.outcome != 'success' || steps.browser_install.outcome != 'success' || steps.playwright.outcome != 'success' || steps.lighthouse.outcome != 'success')
        run: exit 1

  codeql:
    name: CodeQL JavaScript/TypeScript
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/mid-stable') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'schedule' && github.event.schedule == '41 1 * * 3') ||
      (github.event_name == 'workflow_dispatch' && (inputs.task == 'codeql' || inputs.task == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Zu analysierenden MID-Stand laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'mid-stable' || github.sha }}
      - name: CodeQL initialisieren
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: CodeQL auswerten
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
