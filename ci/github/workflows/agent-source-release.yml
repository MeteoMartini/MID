name: MID Agent Source Release
run-name: Geprüften Agent-PR automatisch veröffentlichen

on:
  workflow_run:
    workflows:
      - MID ChatGPT/Codex Source-PR Gate
    types:
      - completed
    # Filter on the *source gate's* head branch; never authorize copilot/*.
    branches:
      - 'chatgpt/**'
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: mid-agent-source-release
  # Preserve waiting release requests; never cancel an active release.
  queue: max
  cancel-in-progress: false

jobs:
  merge_package_dispatch:
    name: PR mergen, Release-ZIP erzeugen und Installer starten
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      (startsWith(github.event.workflow_run.head_branch, 'chatgpt/') ||
       startsWith(github.event.workflow_run.head_branch, 'codex/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: MID Release Bot Token erzeugen
        id: release_app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.MID_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MID_RELEASE_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: write
          permission-pull-requests: write

      - name: Geprüften PR robust identifizieren
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "$RUN_HEAD_BRANCH" in
            chatgpt/*|codex/*) ;;
            *)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Workflow-Run gehört nicht zu einem autorisierten Agent-Branch: ${RUN_HEAD_BRANCH}"
              exit 0
              ;;
          esac

          owner="${GITHUB_REPOSITORY%%/*}"
          prs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=all \
            -f base=main \
            -f head="${owner}:${RUN_HEAD_BRANCH}" \
            -f per_page=100)"

          matches="$(jq --arg repo "$GITHUB_REPOSITORY" --arg sha "$RUN_HEAD_SHA" '[.[] | select(.head.repo.full_name == $repo and .head.sha == $sha and .draft == false and (.state == "open" or .merged_at != null))]' <<<"$prs")"
          count="$(jq 'length' <<<"$matches")"
          if [ "$count" != "1" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Kein exakt passender offener oder bereits geschützter gemergter Agent-PR für ${RUN_HEAD_BRANCH}@${RUN_HEAD_SHA} gefunden; Auto-Release wird sauber übersprungen."
            exit 0
          fi

          pr_number="$(jq -r '.[0].number' <<<"$matches")"
          head_sha="$(jq -r '.[0].head.sha' <<<"$matches")"
          if [ "$(jq -r '.[0].merged_at != null' <<<"$matches")" = "true" ]; then
            echo "already_merged=true" >> "$GITHUB_OUTPUT"
            echo "merge_sha=$(jq -r '.[0].merge_commit_sha // empty' <<<"$matches")" >> "$GITHUB_OUTPUT"
          else
            echo "already_merged=false" >> "$GITHUB_OUTPUT"
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

      - name: Unabhängigen Reviewstand vor SHA-Merge fail-closed prüfen
        # Runs only from the trusted default-branch workflow; no untrusted PR checkout.
        if: steps.pr.outputs.eligible == 'true' && steps.pr.outputs.already_merged != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys, urllib.request
          repo=os.environ.get("GITHUB_REPOSITORY","")
          number=os.environ.get("PR_NUMBER","")
          head=os.environ.get("EXPECTED_HEAD_SHA","")
          token=os.environ.get("GH_TOKEN","")
          if (not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+",repo)
              or not number.isdecimal() or int(number)<1 or not re.fullmatch(r"[a-f0-9]{40}",head)
              or not token):
              raise SystemExit("MID review gate: invalid configuration; no merge")
          owner,name=repo.split("/",1)
          query="""query($owner:String!,$name:String!,$number:Int!,$rCursor:String,$tCursor:String){
            repository(owner:$owner,name:$name){pullRequest(number:$number){
              id state isDraft headRefOid baseRefName
              reviews(first:100,after:$rCursor){
                nodes{id state submittedAt bodyText commit{oid}}
                pageInfo{hasNextPage endCursor}
              }
              reviewThreads(first:100,after:$tCursor){
                nodes{id isResolved isOutdated}
                pageInfo{hasNextPage endCursor}
              }
            }}
          }"""
          def one_page(r_cursor,t_cursor):
              payload=json.dumps({"query":query,"variables":{
                "owner":owner,"name":name,"number":int(number),
                "rCursor":r_cursor,"tCursor":t_cursor}},separators=(",",":")).encode()
              request=urllib.request.Request("https://api.github.com/graphql",data=payload,
                headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json",
                  "Content-Type":"application/json","User-Agent":"MID-trusted-review-premerge"},
                method="POST")
              with urllib.request.urlopen(request,timeout=15) as reply:
                response=json.load(reply)
              if response.get("errors") or not isinstance(response.get("data"),dict):
                raise ValueError("GitHub GraphQL returned errors or incomplete data")
              pr=(response["data"].get("repository") or {}).get("pullRequest")
              if not isinstance(pr,dict):raise ValueError("PR review data not readable")
              return pr
          def snapshot():
              meta=None
              reviews,threads=[],[]
              r_cursor=t_cursor=None
              r_done=t_done=False
              for _ in range(20):
                pr=one_page(r_cursor,t_cursor)
                current={key:pr.get(key) for key in ("id","state","isDraft","headRefOid","baseRefName")}
                if meta is None:meta=current
                if current!=meta:raise ValueError("PR state or SHA changed during pagination")
                r=pr.get("reviews") or {}
                t=pr.get("reviewThreads") or {}
                rp=r.get("pageInfo") or {}
                tp=t.get("pageInfo") or {}
                if not isinstance(r.get("nodes"),list) or not isinstance(t.get("nodes"),list):
                  raise ValueError("Review or thread page incomplete")
                if not r_done:reviews.extend(r["nodes"])
                if not t_done:threads.extend(t["nodes"])
                r_done=(rp.get("hasNextPage") is False)
                t_done=(tp.get("hasNextPage") is False)
                if r_done and t_done:return {"pr":meta,"reviews":reviews,"threads":threads}
                if not r_done:
                  next_cursor=rp.get("endCursor")
                  if not next_cursor or next_cursor==r_cursor:raise ValueError("Review cursor missing or stalled")
                  r_cursor=next_cursor
                if not t_done:
                  next_cursor=tp.get("endCursor")
                  if not next_cursor or next_cursor==t_cursor:raise ValueError("Thread cursor missing or stalled")
                  t_cursor=next_cursor
              raise ValueError("Review pagination exceeds fail-closed page cap")
          try:
              first=snapshot()
              second=snapshot()
              if first!=second:raise ValueError("PR review evidence changed during readback")
              pr=first["pr"]
              if (pr.get("state")!="OPEN" or pr.get("isDraft") is not False
                  or pr.get("headRefOid")!=head or pr.get("baseRefName")!="main"):
                raise ValueError("PR not ready or head/base SHA differs from source gate")
              if first["threads"]:
                raise ValueError("Independent triage required for submitted review threads")
              seen=set()
              for review in first["reviews"]:
                identifier=review.get("id") if isinstance(review,dict) else None
                if not identifier or identifier in seen:raise ValueError("Review ID missing or duplicated")
                seen.add(identifier)
                state=review.get("state")
                if state in ("PENDING","DISMISSED"):continue
                review_sha=(review.get("commit") or {}).get("oid","")
                if not review.get("submittedAt") or not re.fullmatch(r"[a-f0-9]{40}",review_sha):
                  raise ValueError("Submitted review provenance missing")
                if review_sha!=head:raise ValueError("Submitted review on stale SHA")
                if state=="CHANGES_REQUESTED":raise ValueError("Changes requested")
                body=(review.get("bodyText") or "").strip()
                if state=="APPROVED":
                  # Even an approval may explicitly report real defects.
                  if any(int(value)!=0 for value in re.findall(r"\b(\d+)\s+issues?\s+found\b",body,re.I)):
                    raise ValueError("Approved review still reports substantive issues")
                  continue
                if state!="COMMENTED":raise ValueError("Unexpected submitted review state")
                if not body:continue
                counts=re.findall(r"\b(\d+)\s+issues?\s+found\b",body,re.I)
                if not counts or any(int(value)!=0 for value in counts):
                  raise ValueError("Substantive review needs independent disposition")
              print("MID pre-merge review evidence: PASS (no unresolved or untriaged findings)")
          except Exception as error:
              print("::error::MID pre-merge review gate blocked: "+str(error),file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Geprüften Agent-PR automatisch zusammenführen
        if: steps.pr.outputs.eligible == 'true' && steps.pr.outputs.already_merged != 'true'
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          response="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" -f merge_method=squash -f sha="${EXPECTED_HEAD_SHA}" -f commit_title="MID Agent-Release PR #${PR_NUMBER}")"
          if [ "$(jq -r '.merged' <<<"$response")" != "true" ]; then
            echo "::error::GitHub hat den geprüften Agent-PR nicht zusammengeführt."
            jq . <<<"$response"
            exit 1
          fi
          echo "merge_sha=$(jq -r '.sha' <<<"$response")" >> "$GITHUB_OUTPUT"

      - name: Zusammengeführten main-Stand laden
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Paketierung benötigt nur den aktuellen main-Snapshot.
          fetch-depth: 1
          persist-credentials: false

      - name: Release-ZIP aus dem aktuellen main-Quellstand erzeugen und committen
        if: steps.pr.outputs.eligible == 'true'
        id: package
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          RELEASE_BOT_SLUG: ${{ steps.release_app_token.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot_user_id="$(gh api "/users/${RELEASE_BOT_SLUG}[bot]" --jq .id)"
          git config user.name "${RELEASE_BOT_SLUG}[bot]"
          git config user.email "${bot_user_id}+${RELEASE_BOT_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
          make_zip() {
            rm -f MID-professional-replacement.zip
            python3 <<'PY'
          import subprocess
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, is_zipfile
          out = Path('MID-professional-replacement.zip')
          excluded_roots = {'.github', '.git', 'node_modules', 'dist'}
          excluded_files = {'MID-professional-replacement.zip'}
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with ZipFile(out, 'w', ZIP_DEFLATED, compresslevel=9) as zf:
              for raw in tracked:
                  if not raw:
                      continue
                  path = Path(raw)
                  if path.parts and path.parts[0] in excluded_roots:
                      continue
                  if path.name in excluded_files:
                      continue
                  if path.is_symlink():
                      raise SystemExit(f'Symlink im Release-Quellstand unzulässig: {path}')
                  if path.is_file():
                      zf.write(path, path.as_posix())
          if not is_zipfile(out):
              raise SystemExit('Release-Paket ist kein gültiges ZIP')
          with ZipFile(out) as zf:
              corrupt = zf.testzip()
              if corrupt is not None:
                  raise SystemExit(f'Beschädigter ZIP-Eintrag: {corrupt}')
              names = set(zf.namelist())
              for required in ('package.json', 'package-lock.json', 'MID_BASELINE.json', 'MID_SOURCE_OF_TRUTH.md'):
                  if required not in names:
                      raise SystemExit(f'Release-Paket fehlt: {required}')
              for prefix in ('src/', 'worker/', 'public/', 'ios/'):
                  if not any(name.startswith(prefix) for name in names):
                      raise SystemExit(f'Release-Paket fehlt: {prefix}')
          print(f'Release-ZIP: {out.stat().st_size} Byte')
          PY
          }
          pushed=false
          for attempt in 1 2 3; do
            git fetch --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
            git reset --hard origin/main
            make_zip
            git add -f MID-professional-replacement.zip
            git commit -m "Prepare MID agent release from PR #${{ steps.pr.outputs.number }}"
            package_sha="$(git rev-parse HEAD)"
            if git push origin HEAD:main; then
              pushed=true
              echo "package_sha=${package_sha}" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "::warning::main wurde parallel fortgeführt; Release-Paket wird aus dem neuesten main-Stand neu erzeugt (Versuch ${attempt}/3)."
            sleep $((attempt * 2))
          done
          if [ "$pushed" != true ]; then
            echo "::error::Release-Paket konnte nach drei race-sicheren Versuchen nicht nach main übertragen werden."
            exit 1
          fi

      - name: Bewährten MID-Installer explizit starten
        if: steps.pr.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
        run: |
          set -euo pipefail
          gh workflow run install-mid.yml --ref main
          {
            echo "### Automatischer MID-Release gestartet"
            echo
            echo "- PR: #${{ steps.pr.outputs.number }}"
            echo "- Merge: ${{ steps.merge.outputs.merge_sha || steps.pr.outputs.merge_sha }}"
            echo "- Release-Paket: ${{ steps.package.outputs.package_sha }}"
            echo "- Installer: install-mid.yml via workflow_dispatch"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Übersprungenen Run dokumentieren
        if: steps.pr.outputs.eligible != 'true'
        shell: bash
        run: |
          {
            echo "### Auto-Release übersprungen"
            echo
            echo "Für den abgeschlossenen Source-Gate-Lauf existiert kein exakt passender offener Agent-PR mehr."
            echo "Es wurde weder gemergt noch paketiert oder deployt."
          } >> "$GITHUB_STEP_SUMMARY"
