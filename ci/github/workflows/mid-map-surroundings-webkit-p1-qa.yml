name: MID maps surroundings WebKit responsive fixture QA (read-only)
on:
  push:
    branches: [chatgpt/v0.9.85.485-surroundings-radar-native-qa]
    paths: ['.github/workflows/mid-map-surroundings-webkit-p1-qa.yml']
permissions:
  contents: read
concurrency:
  group: mid-map-surroundings-webkit-p1-qa
  cancel-in-progress: false
jobs:
  webkit-responsive:
    if: "${{ github.event.head_commit.message == 'qa(maps): linux WebKit responsive surroundings smoke' }}"
    name: Linux WebKit source-fixture 5 widths x 2 themes + touch (NOT REAL iOS)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Exact SHA checkout without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable Stable/main SHA and duplicated workflow contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/chatgpt/v0.9.85.485-surroundings-radar-native-qa
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cmp .github/workflows/mid-map-surroundings-webkit-p1-qa.yml ci/github/workflows/mid-map-surroundings-webkit-p1-qa.yml
          main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          stable="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/mid-stable" --jq .object.sha)"
          test "$main" = "$stable"
          test "$stable" = c9fadfcd0969e949a92f414b321627dd3d4fb0cc
          compare="$(gh api "repos/$GITHUB_REPOSITORY/compare/$stable...$GITHUB_SHA")"
          jq -e --arg stable "$stable" '.status == "ahead" and .merge_base_commit.sha == $stable' <<< "$compare" >/dev/null
          echo "Read-only Linux WebKit QA; NO iOS/VoiceOver claims, no release."
      - name: Existing MID Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Pinned Playwright WebKit 1.56.1, supported Ubuntu 24.04 dependencies
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm exec --yes --package=playwright@1.56.1 -- playwright install --with-deps webkit
      - name: Linux WebKit mobile touch plus portrait/landscape desktop layout gates
        shell: bash
        timeout-minutes: 11
        env:
          NODE_ENV: test
          MID_QA_BROWSER: webkit
          VITE_WORKER_SAME_ORIGIN_PATH: /__qa-worker
        run: |
          set -euo pipefail
          node scripts/qa-surroundings-browser-responsive-0985485.mjs
          echo 'Linux WebKit deterministic weather-source fixtures only. Real Safari/iOS/VoiceOver remains unverified.'
