version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    versioning-strategy: increase-if-necessary
    groups:
      npm-safe-updates:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - maintenance
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:35"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - maintenance
    commit-message:
      prefix: "chore(actions)"
